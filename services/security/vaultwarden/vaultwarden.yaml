---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Secret
metadata:
  name: vaultwarden-env
  namespace: vaultwarden
type: Opaque
stringData:
  # Admin panel (/admin). Prefer an Argon2 PHC string (`vaultwarden hash`) over
  # a plain token; it is substituted verbatim, so its `$` signs are safe.
  ADMIN_TOKEN: "${vaultwarden_admin_token}"
  # Plain secret of the Authelia "vaultwarden" OIDC client
  SSO_CLIENT_SECRET: "${vaultwarden_sso_client_secret}"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: vaultwarden
  labels:
    backup.longhorn.io/enabled: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root process bind port 80 (namespaced, safe sysctl)
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: vaultwarden
          image: vaultwarden/server:1.37.4
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            # Must match the Ingress host: used for links, WebAuthn and attachments
            - name: DOMAIN
              value: "https://vault.${domain}"
            # No open registration: invite users from /admin. Without SMTP an
            # invited email can register directly.
            - name: SIGNUPS_ALLOWED
              value: "false"
            - name: INVITATIONS_ALLOWED
              value: "true"
            - name: SHOW_PASSWORD_HINT
              value: "false"
            # Real client IPs from Traefik for logs and login rate limiting
            - name: IP_HEADER
              value: "X-Forwarded-For"
            # Log in through Authelia; the master password still decrypts the
            # vault. Existing accounts link on first SSO login by email, new
            # ones still need an invite. SSO_ONLY: no email + master password login.
            - name: SSO_ENABLED
              value: "true"
            - name: SSO_ONLY
              value: "true"
            # Must equal the issuer in Authelia's discovery document
            - name: SSO_AUTHORITY
              value: "https://auth.${domain}"
            - name: SSO_CLIENT_ID
              value: "vaultwarden"
            # offline_access: refresh tokens, so sessions outlive the access token
            - name: SSO_SCOPES
              value: "email profile offline_access"
            - name: SSO_PKCE
              value: "true"
            # Authelia only for login; sessions then use Vaultwarden's own
            # refresh tokens (30 days idle) instead of Authelia's (90 min)
            - name: SSO_AUTH_ONLY_NOT_SESSION
              value: "true"
          envFrom:
            - secretRef:
                name: vaultwarden-env
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /alive
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vaultwarden-data
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: vaultwarden
  labels:
    app: vaultwarden
spec:
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vaultwarden
  namespace: vaultwarden
  # Vaultwarden authenticates itself; Authelia would block the Bitwarden
  # apps and browser extensions. LAN-only (websecure), also reached over the
  # Tailscale subnet router; deliberately not published through cfgate.
  labels:
    enable-oauth: "false"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ""
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Vaultwarden"
    gethomepage.dev/description: "Password Manager"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "vaultwarden.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=vaultwarden"
spec:
  rules:
    - host: vault.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vaultwarden
                port:
                  number: 80
