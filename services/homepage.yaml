---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
  namespace: homepage
spec:
  interval: 24h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 12h
  chart:
    spec:
      chart: homepage
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
      interval: 12h
  timeout: 30s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        hosts:
          - host: homepage.${domain}
            paths:
              - path: /
                pathType: Prefix
    config:
      settings:
        title: bonjwa.cloud Dashboard
      bookmarks:
        - Developer:
            - Github:
                - href: https://github.com
            - YouTube:
                - href: https://youtube.com
      services:
        - Cluster:
            - Open WebUI:
                - href: https://ai.${domain}
                  icon: open-webui.png
            - Headlamp:
                - href: https://headlamp.${domain}
                  icon: headlamp.png
            - Jellyfin:
                - href: https://stream.${domain}
                  icon: jellyfin.png
