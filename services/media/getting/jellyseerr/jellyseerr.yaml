apiVersion: v1
kind: Namespace
metadata:
  name: jellyseerr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyseerr-config
  namespace: jellyseerr
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  # Single SQLite database on an RWO volume: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyseerr
  template:
    metadata:
      labels:
        app: jellyseerr
    spec:
      # Seerr runs as the image's node user (1000); make the config volume writable for it
      securityContext:
        fsGroup: 1000
      containers:
        # Jellyseerr continues as Seerr (Jellyseerr + Overseerr merged); names kept so the
        # Radarr/Sonarr/Jellyfin policies that allow the jellyseerr namespace still match.
        - name: jellyseerr
          image: ghcr.io/seerr-team/seerr:v3.5.0
          env:
            - name: LOG_LEVEL
              value: "info"
            - name: TZ
              value: "Europe/Stockholm"
          ports:
            - name: http
              containerPort: 5055
          startupProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/status
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /app/config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyseerr-config
---
apiVersion: v1
kind: Service
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  selector:
    app: jellyseerr
  ports:
    - name: http
      port: 5055
      targetPort: 5055
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jellyseerr
  namespace: jellyseerr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Seerr"
    gethomepage.dev/description: "Media Requests"
    gethomepage.dev/group: "Media"
    gethomepage.dev/icon: "jellyseerr.png"
    gethomepage.dev/href: "https://requests.${domain}"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=jellyseerr"
spec:
  ingressClassName: traefik
  rules:
    - host: requests.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyseerr
                port:
                  number: 5055
    - host: seerr.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jellyseerr
                port:
                  number: 5055
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyseerr
  namespace: jellyseerr
spec:
  endpointSelector:
    matchLabels:
      app: jellyseerr
  ingress:
    # Web UI access from Traefik; Jellyfin Enhanced proxies requests and discovery
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: jellyfin
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Send movie requests to Radarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Send TV show requests to Sonarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Sync media library with Jellyfin
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Push notifications to ntfy (topic seerr)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Metadata and TMDB API access
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
