apiVersion: v1
kind: Namespace
metadata:
  name: qbittorrent
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-config
  namespace: qbittorrent
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  # RWO config volume, and two clients must never share the download directory
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: qbittorrent
  template:
    metadata:
      labels:
        app: qbittorrent
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${media_node}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: run-dir
          image: lscr.io/linuxserver/qbittorrent:latest
          command: ["mkdir", "-p", "/emptydir/run"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: run
              mountPath: /emptydir
        - name: init-qbittorrent-config
          image: busybox:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              mkdir -p /config/qBittorrent
              CONF="/config/qBittorrent/qBittorrent.conf"
              if [ ! -f "$CONF" ]; then
                cat << 'EOF' > "$CONF"
              [Preferences]
              Connection\PortRangeMin=6881
              Downloads\SavePath=/data/downloading/
              Downloads\TempPath=/data/downloading/incomplete/
              Downloads\TempPathEnabled=true
              WebUI\Address=*
              WebUI\Port=8080
              WebUI\HostHeaderValidation=false
              WebUI\LocalHostAuth=false
              WebUI\AuthSubnetWhitelistEnabled=true
              EOF
              fi
              # set_pref <key> <value> [section, default Preferences]
              set_pref() {
                SECTION="$3"; [ -n "$SECTION" ] || SECTION=Preferences
                grep -v "^$(echo "$1" | sed 's/\\/\\\\/g')=" "$CONF" > "$CONF.tmp" || true
                grep -q "^\[$SECTION\]" "$CONF.tmp" || printf '\n[%s]\n' "$SECTION" >> "$CONF.tmp"
                sed -i "/^\[$SECTION\]/a $(echo "$1" | sed 's/\\/\\\\/g')=$2" "$CONF.tmp"
                mv "$CONF.tmp" "$CONF"
              }
              # Stop seeding after 1 day or a 1.0 ratio, whichever comes first. Imports are
              # hardlinks, so removing the content only drops the copy in downloading/.
              set_pref 'Session\GlobalMaxRatio' 1 BitTorrent
              set_pref 'Session\GlobalMaxSeedingMinutes' 1440 BitTorrent
              set_pref 'Session\ShareLimitAction' RemoveWithContent BitTorrent
              # Authelia is the only login: requests from the pod network (Traefik, Radarr, Sonarr,
              # Prowlarr; Cilium decides who gets in) skip qBittorrent's own auth.
              set_pref 'WebUI\HostHeaderValidation' false
              set_pref 'WebUI\LocalHostAuth' false
              set_pref 'WebUI\AuthSubnetWhitelistEnabled' true
              set_pref 'WebUI\AuthSubnetWhitelist' '127.0.0.1/32, ${pod_cidr}'
              chown -R 1000:1000 /config
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
        # Native sidecar: qBittorrent only starts once the VPN is up; the kill switch blocks
        # all egress outside the tunnel until then.
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          # Root with NET_ADMIN for the tunnel and kill switch (allowlisted in the Kyverno
          # restricted policies); every other container in the pod runs as 1000.
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: OPENVPN_USER
              value: "${pia_user}"
            - name: OPENVPN_PASSWORD
              value: "${pia_password}"
            - name: SERVER_REGIONS
              value: "${pia_region}"
            # Pinned: the CiliumNetworkPolicy only lets this pod reach the internet on this port
            - name: OPENVPN_PROTOCOL
              value: "udp"
            - name: VPN_ENDPOINT_PORT
              value: "8080"
            - name: VPN_PORT_FORWARDING
              value: "on"
            - name: VPN_PORT_FORWARDING_PROVIDER
              value: "private internet access"
            - name: VPN_PORT_FORWARDING_STATUS_FILE
              value: "/tmp/gluetun/forwarded_port"
            # Cluster traffic (DNS, Radarr/Sonarr callbacks) bypasses the tunnel
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "${pod_cidr},10.96.0.0/12,192.168.0.0/16"
            # Web UI / API for Traefik, Radarr, Sonarr, Prowlarr and the kubelet
            - name: FIREWALL_INPUT_PORTS
              value: "8080"
            - name: IP6TABLES
              value: "off"
            # DNS stays on gluetun's own resolver (no DNS_KEEP_NAMESERVER): tracker lookups must not
            # leak outside the tunnel, and nothing in this pod needs cluster names.
          # Healthy only while the tunnel is up. No liveness probe: gluetun reconnects by itself.
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 120
          # Kill switch at the Service level: while the tunnel is down the pod is NotReady, so
          # Traefik and the other apps stop routing to it instead of it looking healthy.
          readinessProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 400m
              memory: 64Mi
            limits:
              cpu: 2
              memory: 256Mi
          volumeMounts:
            - name: gluetun-data
              mountPath: /tmp/gluetun
            - name: tun
              mountPath: /dev/net/tun
      containers:
        - name: qbittorrent
          image: lscr.io/linuxserver/qbittorrent:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
            - name: WEBUI_PORT
              value: "8080"
          ports:
            - name: http
              containerPort: 8080
          # TCP, not the API: the kubelet's node IP is outside the auth whitelist (403)
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            failureThreshold: 5
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 768Mi
            limits:
              cpu: 2
              memory: 3Gi
          volumeMounts:
            - name: run
              mountPath: /run
              subPath: run
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
        - name: port-forward-sync
          image: curlimages/curl:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - /bin/sh
            - -c
            - |
              echo "Starting qBittorrent port-forward sync watcher..."
              LAST_PORT=""
              while true; do
                if [ -s /tmp/gluetun/forwarded_port ]; then
                  PORT=$(cat /tmp/gluetun/forwarded_port)
                  if [ -n "$PORT" ] && [ "$PORT" != "$LAST_PORT" ]; then
                    echo "Forwarded port detected: $PORT. Updating qBittorrent..."
                    if curl -s -f http://127.0.0.1:8080/api/v2/app/version >/dev/null 2>&1; then
                      curl -s -X POST -d "json={\"listen_port\":$PORT,\"random_port\":false}" http://127.0.0.1:8080/api/v2/app/setPreferences
                      echo "Updated listening port to $PORT"
                      LAST_PORT="$PORT"
                    fi
                  fi
                fi
                sleep 15
              done
          resources:
            requests:
              cpu: 5m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: gluetun-data
              mountPath: /tmp/gluetun
      volumes:
        # Running as non-root, s6-overlay needs a /run owned by its user: an emptyDir is
        # root-owned, so the run-dir init container creates a subdirectory as 1000
        - name: run
          emptyDir: {}
        - name: config
          persistentVolumeClaim:
            claimName: qbittorrent-config
        - name: data
          hostPath:
            path: /mnt/hdd/Shared
        - name: gluetun-data
          emptyDir: {}
        - name: tun
          hostPath:
            path: /dev/net/tun
---
apiVersion: v1
kind: Service
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  selector:
    app: qbittorrent
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "qBittorrent"
    gethomepage.dev/description: "Download Client"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "qbittorrent.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=qbittorrent"
    # No credentials: the pod CIDR is in the WebUI auth whitelist
    gethomepage.dev/widget.type: "qbittorrent"
    gethomepage.dev/widget.url: "http://qbittorrent.qbittorrent.svc.cluster.local:8080"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - qbit.${domain}
        - qbittorrent.${domain}
      secretName: qbittorrent-tls
  rules:
    - host: qbit.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
    - host: qbittorrent.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qbittorrent
                port:
                  number: 8080
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: qbittorrent
  namespace: qbittorrent
spec:
  endpointSelector:
    matchLabels:
      app: qbittorrent
  ingress:
    # Web UI / API access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Download client API calls from Radarr, Sonarr, Prowlarr, Dispatcharr, Cleanuparr;
    # dashboard widget from Homepage
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
        - matchLabels:
            io.kubernetes.pod.namespace: prowlarr
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
        - matchLabels:
            io.kubernetes.pod.namespace: cleanuparr
        - matchLabels:
            io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # BitTorrent incoming peer traffic
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6881"
              protocol: TCP
            - port: "6881"
              protocol: UDP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Internet only through the VPN: the OpenVPN connection to PIA (UDP 8080, pinned in gluetun).
    # Peers and trackers travel inside the tunnel; anything that would bypass it shows up as
    # DROPPED in Hubble. A second kill switch next to gluetun's firewall.
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "8080"
              protocol: UDP
    # Intra-namespace communication
    - toEndpoints:
        - {}
