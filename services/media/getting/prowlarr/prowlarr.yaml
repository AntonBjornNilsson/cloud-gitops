apiVersion: v1
kind: Namespace
metadata:
  name: prowlarr
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: prowlarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      containers:
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
          ports:
            - name: http
              containerPort: 9696
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: 9696
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  endpointSelector:
    matchLabels:
      app: prowlarr
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Indexer searches / release grabs from Radarr and Sonarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Download client testing / management on qBittorrent
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Indexer sync to Radarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Indexer sync to Sonarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # External trackers, indexers, and RSS feeds
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
