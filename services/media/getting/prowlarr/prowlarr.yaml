apiVersion: v1
kind: Namespace
metadata:
  name: prowlarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prowlarr-config
  namespace: prowlarr
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  # Single SQLite database on an RWO volume: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: prowlarr
  template:
    metadata:
      labels:
        app: prowlarr
    spec:
      # Indexer traffic goes out through the VPN. gluetun is a native sidecar, so Prowlarr only
      # starts once the tunnel is up; its kill switch blocks egress until then.
      initContainers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41.3
          restartPolicy: Always
          securityContext:
            capabilities:
              add:
                - NET_ADMIN
          env:
            - name: VPN_SERVICE_PROVIDER
              value: "private internet access"
            - name: VPN_TYPE
              value: "openvpn"
            - name: OPENVPN_USER
              value: "${pia_user}"
            - name: OPENVPN_PASSWORD
              value: "${pia_password}"
            - name: SERVER_REGIONS
              value: "${pia_region}"
            # Cluster traffic (Radarr, Sonarr, qBittorrent, DNS) bypasses the tunnel
            - name: FIREWALL_OUTBOUND_SUBNETS
              value: "10.244.0.0/16,10.96.0.0/12,192.168.0.0/16"
            - name: FIREWALL_INPUT_PORTS
              value: "9696"
            - name: IP6TABLES
              value: "off"
            # Keep cluster DNS: gluetun's own forwarder is dead whenever the tunnel is down
            - name: DNS_KEEP_NAMESERVER
              value: "on"
          # Healthy only while the tunnel is up. No liveness probe: gluetun reconnects by itself.
          startupProbe:
            exec:
              command: ["/gluetun-entrypoint", "healthcheck"]
            periodSeconds: 5
            failureThreshold: 120
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
      containers:
        # Solves Cloudflare challenges for indexers (Prowlarr indexer proxy at http://localhost:8191/).
        # Same pod on purpose: the clearance cookies only work from the IP that solved the
        # challenge, so FlareSolverr must leave through the same VPN as Prowlarr.
        - name: flaresolverr
          image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
          env:
            - name: TZ
              value: "Europe/Stockholm"
            - name: LOG_LEVEL
              value: info
          ports:
            - name: flaresolverr
              containerPort: 8191
          # Exec, not httpGet: gluetun's firewall only lets the kubelet reach port 9696
          readinessProbe:
            exec:
              command: ["curl", "-fsS", "-m", "5", "http://localhost:8191/health"]
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            # Each solve runs its own headless Chromium; requests stuck on an unsolvable
            # challenge pile up until they time out, so leave room for several at once
            limits:
              memory: 2Gi
        - name: prowlarr
          image: lscr.io/linuxserver/prowlarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
            # Authelia guards the UI; without this Prowlarr forces its own login on first start.
            # The API still requires the API key (Radarr/Sonarr connect in-cluster, not via Traefik).
            - name: PROWLARR__AUTH__METHOD
              value: External
            - name: PROWLARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 9696
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: prowlarr-config
        - name: tun
          hostPath:
            path: /dev/net/tun
---
apiVersion: v1
kind: Service
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 9696
      targetPort: 9696
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr
  namespace: prowlarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Prowlarr"
    gethomepage.dev/description: "Indexer Manager"
    gethomepage.dev/group: "Downloads"
    gethomepage.dev/icon: "prowlarr.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=prowlarr"
    gethomepage.dev/widget.type: "prowlarr"
    gethomepage.dev/widget.url: "http://prowlarr.prowlarr.svc.cluster.local:9696"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
spec:
  ingressClassName: traefik
  rules:
    - host: prowlarr.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: prowlarr
                port:
                  number: 9696
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prowlarr
  namespace: prowlarr
spec:
  endpointSelector:
    matchLabels:
      app: prowlarr
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Indexer searches / release grabs from Radarr and Sonarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Dispatcharr's arr integration
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Dashboard widget API calls from Homepage
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Download client testing / management on qBittorrent
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Indexer sync to Radarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Indexer sync to Sonarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # External trackers, indexers, and RSS feeds
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
