---
apiVersion: v1
kind: Namespace
metadata:
  name: stalkarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# The image repository is private.
# ghcr_pull_auth = base64("<github user>:<PAT with read:packages>")
apiVersion: v1
kind: Secret
metadata:
  name: ghcr-pull
  namespace: stalkarr
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"${ghcr_pull_auth}"}}}'
---
# stalkarr_devices is a JSON list of the MAG boxes allowed on the portal, e.g.
# [{"mac":"00:1A:79:..","name":"Living room"},{"mac":"..","name":"Kids","groups":["Kids"]}]
apiVersion: v1
kind: Secret
metadata:
  name: stalkarr
  namespace: stalkarr
type: Opaque
stringData:
  STALKARR_SECRET: "${stalkarr_secret}"
  STALKARR_DEVICES: '${stalkarr_devices}'
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stalkarr-data
  namespace: stalkarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stalkarr
  namespace: stalkarr
spec:
  replicas: 1
  # RWO volume: never run two pods at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: stalkarr
  template:
    metadata:
      labels:
        app: stalkarr
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: stalkarr
          image: ghcr.io/${ghcr_owner}/stalkarr:latest
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: stalkarr
          ports:
            - name: http
              containerPort: 9292
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        # Generated by kustomization.yaml; the name hash rolls the pod on config changes.
        - name: config
          configMap:
            name: stalkarr-config
        - name: data
          persistentVolumeClaim:
            claimName: stalkarr-data
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stalkarr
  namespace: stalkarr
spec:
  selector:
    app: stalkarr
  ports:
    - name: http
      port: 9292
      targetPort: http
---
# MAG boxes cannot do Authelia; the portal authenticates boxes by MAC allowlist.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stalkarr
  namespace: stalkarr
  labels:
    enable-oauth: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: tv.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stalkarr
                port:
                  number: 9292
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stalkarr
  namespace: stalkarr
spec:
  endpointSelector: {}
  ingress:
    # Portal, API and streams via Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "9292"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Dispatcharr: HDHR lineup, M3U, XMLTV, logos and streams
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
            app: dispatcharr-web
      toPorts:
        - ports:
            - port: "9191"
              protocol: TCP
