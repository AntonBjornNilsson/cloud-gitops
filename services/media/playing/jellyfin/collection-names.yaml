# Strips " Collection" from automatic collection names (see collection-names/rename.py).
# Uses the exporter's Jellyfin API key.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: collection-names
  namespace: jellyfin
spec:
  schedule: "40 * * * *"
  timeZone: "Europe/Stockholm"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      template:
        metadata:
          labels:
            app: collection-names
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: rename
              image: python:3.13-alpine
              command: ["python3", "/app/rename.py"]
              env:
                - name: DRY_RUN
                  value: "false"
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: jellyfin-exporter
                      key: api-key
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: app
              configMap:
                name: collection-names-app
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: collection-names
  namespace: jellyfin
spec:
  endpointSelector:
    matchLabels:
      app: collection-names
  ingress: []
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Jellyfin API
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
