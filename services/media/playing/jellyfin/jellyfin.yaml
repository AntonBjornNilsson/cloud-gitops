---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Config on a block (RWO) volume: SQLite locking over the RWX/NFS share made every
# database read wait behind library-scan writes (~30s per request).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: jellyfin
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Jellyfin refuses to start with under 2GiB free in /config/data
      storage: 10Gi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      interval: 12h
  # First boot after a major upgrade runs database migrations
  timeout: 30m0s
  # Jellyfin authenticates itself (Authorization: MediaBrowser ...), which Authelia
  # rejects with a 401 basic-auth prompt; the chart has no ingress labels value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: jellyfin
            patch: |
              - op: add
                path: /metadata/labels/enable-oauth
                value: "false"
  values:
    replicaCount: 1
    image:
      tag: "12.1"
    # Never run two pods at once: the RWO config volume must detach first.
    # Not Recreate: the live rollingUpdate defaults would make the patch invalid.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    resources:
      limits:
        cpu: 2000m
        memory: 2048Mi
      requests:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: ""
        # Internet-facing: also served on the tunnel entrypoint
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Jellyfin"
        gethomepage.dev/description: "Media Streaming"
        gethomepage.dev/group: "Media & Entertainment"
        gethomepage.dev/icon: "jellyfin.png"
      hosts:
        - host: stream.${domain}
          paths:
            - path: /
              pathType: Prefix

    # Allow up to 30m for startup database migrations
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 180
    # /health stalls for minutes during heavy work (e.g. Live TV guide refresh);
    # only restart on a sustained hang (~5m) and don't drop out of Traefik early
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 30
    # Readiness avoids /health: its database check stalls during guide refreshes while the
    # server keeps answering, and dropping out of the Service turns that into 503s in Traefik.
    readinessProbe:
      httpGet:
        path: /System/Info/Public
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6

    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config-local
      media:
        enabled: true
        type: hostPath
        hostPath: "/mnt/hdd"
      cache:
        enabled: true
        accessMode: ReadWriteMany

    nodeSelector:
      kubernetes.io/hostname: ${media_node}
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  endpointSelector: {}
  ingress:
    # Web and streaming ingress from Traefik, Jellyseerr, and local LAN;
    # library refresh notifications from Radarr and Sonarr;
    # session polling from Tracearr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
        - matchLabels:
            io.kubernetes.pod.namespace: tracearr
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Live TV from Dispatcharr (HDHomeRun tuner, XMLTV guide and streams)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
      toPorts:
        - ports:
            - port: "9191"
              protocol: TCP
    # Metadata, plugin repositories, cover art
    - toEntities:
        - world

