---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      interval: 12h
  # First boot after a major upgrade runs database migrations
  timeout: 30m0s
  # Jellyfin authenticates itself (Authorization: MediaBrowser ...), which Authelia
  # rejects with a 401 basic-auth prompt; the chart has no ingress labels value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: jellyfin
            patch: |
              - op: add
                path: /metadata/labels/enable-oauth
                value: "false"
  values:
    replicaCount: 1
    image:
      tag: "12.1"
    # Never run two pods against the shared SQLite database (config is RWX)
    deploymentStrategy:
      type: Recreate
    resources:
      limits:
        cpu: 2000m
        memory: 2048Mi
      requests:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: ""
      hosts:
        - host: stream.${domain}
          paths:
            - path: /
              pathType: Prefix

    # Allow up to 30m for startup database migrations
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 180
    # /health stalls past the 1s default under load, restarting the pod
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
    readinessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      timeoutSeconds: 5

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteMany
        annotations:
          backup.longhorn.io/enabled: "true"
      media:
        enabled: true
        type: hostPath
        hostPath: "/mnt/hdd"
      cache:
        enabled: true
        accessMode: ReadWriteMany

    nodeSelector:
      kubernetes.io/hostname: nilsson-server
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  endpointSelector: {}
  ingress:
    # Web and streaming ingress from Traefik, Jellyseerr, and local LAN
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Metadata, plugin repositories, cover art
    - toEntities:
        - world

