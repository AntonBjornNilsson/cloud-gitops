---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      interval: 12h
  timeout: 30s
  values:
    replicaCount: 1
    resources:
      limits:
        cpu: 2000m
        memory: 2048Mi
      requests:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: true
      ingressClassName: "traefik"
      hosts:
        - host: stream.${domain}
          paths:
            - path: /
              pathType: Prefix

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteMany
      media:
        enabled: true
        type: hostPath
        hostPath: "/mnt/hdd"
      cache:
        enabled: true
        accessMode: ReadWriteMany

    nodeSelector:
      kubernetes.io/hostname: nilsson-server
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  endpointSelector: {}
  ingress:
    # Web and streaming ingress from Traefik, Jellyseerr, and local LAN
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Metadata, plugin repositories, cover art
    - toEntities:
        - world

