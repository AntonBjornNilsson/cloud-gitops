---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# Config on a block (RWO) volume: SQLite locking over the RWX/NFS share made every
# database read wait behind library-scan writes (~30s per request).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config-local
  namespace: jellyfin
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      # Jellyfin refuses to start with under 2GiB free in /config/data
      storage: 10Gi
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      interval: 12h
  # First boot after a major upgrade runs database migrations
  timeout: 30m0s
  # Jellyfin authenticates itself (Authorization: MediaBrowser ...), which Authelia
  # rejects with a 401 basic-auth prompt; the chart has no ingress labels value.
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Ingress
              name: jellyfin
            patch: |
              - op: add
                path: /metadata/labels/enable-oauth
                value: "false"
          # Cap the node-local cache; going over evicts the pod, which also empties it.
          - target:
              kind: Deployment
              name: jellyfin
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: jellyfin
              spec:
                template:
                  spec:
                    volumes:
                      - name: cache
                        emptyDir:
                          sizeLimit: 25Gi
  values:
    replicaCount: 1
    image:
      tag: "12.1"
    # Never run two pods at once: the RWO config volume must detach first.
    # Not Recreate: the live rollingUpdate defaults would make the patch invalid.
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
    # The image defaults to root but needs nothing from it (software transcoding, no
    # devices). The existing config is root-owned; fsGroup makes it group-writable once.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    # Software transcodes peak at ~2 cores and ~1.5Gi
    resources:
      limits:
        cpu: 4
        memory: 3Gi
      requests:
        cpu: 500m
        memory: 768Mi

    ingress:
      enabled: true
      className: traefik
      annotations:
        traefik.ingress.kubernetes.io/router.middlewares: ""
        # Internet-facing: also served on the tunnel entrypoint
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Jellyfin"
        gethomepage.dev/description: "Media Streaming"
        gethomepage.dev/group: "Media"
        gethomepage.dev/icon: "jellyfin.png"
        # version 2: Jellyfin 10.12+ API
        gethomepage.dev/widget.type: "jellyfin"
        gethomepage.dev/widget.url: "http://jellyfin.jellyfin.svc.cluster.local:8096"
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
        gethomepage.dev/widget.version: "2"
        gethomepage.dev/widget.enableBlocks: "true"
        gethomepage.dev/widget.enableNowPlaying: "true"
      hosts:
        - host: stream.${domain}
          paths:
            - path: /
              pathType: Prefix

    # Allow up to 30m for startup database migrations
    startupProbe:
      tcpSocket:
        port: http
      periodSeconds: 10
      failureThreshold: 180
    # /health stalls for minutes during heavy work (e.g. Live TV guide refresh);
    # only restart on a sustained hang (~5m) and don't drop out of Traefik early
    livenessProbe:
      httpGet:
        path: /health
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 30
    # Readiness avoids /health: its database check stalls during guide refreshes while the
    # server keeps answering, and dropping out of the Service turns that into 503s in Traefik.
    readinessProbe:
      httpGet:
        path: /System/Info/Public
        port: http
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 10
      failureThreshold: 6

    # Trust X-Forwarded-For from in-cluster proxies (Traefik, whose pod IP
    # changes), so sessions show the client's IP instead of Traefik's (e.g. in
    # Tracearr). Jellyfin keeps this in network.xml on the config volume;
    # rewrite it on every start so Git stays the source of truth.
    extraInitContainers:
      - name: known-proxies
        image: docker.io/jellyfin/jellyfin:12.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
          - sh
          - -c
          - |
            case "${pod_cidr}" in "") echo "pod_cidr not set, skipping"; exit 0;; esac
            test -f /config/config/network.xml || exit 0
            sed -z -i -E 's#<KnownProxies */>|<KnownProxies>([^<]|<string>[^<]*</string>)*</KnownProxies>#<KnownProxies><string>${pod_cidr}</string></KnownProxies>#' /config/config/network.xml
            grep -o '<KnownProxies>.*</KnownProxies>' /config/config/network.xml
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts:
          - name: config
            mountPath: /config
      # Delete transcode segments once they are SegmentKeepSeconds behind the playhead,
      # and throttle ffmpeg instead of transcoding the whole file ahead. Without this a
      # single movie leaves GBs of segments that only the daily cleanup task (files older
      # than a day) removes, and a few evening streams filled the cache.
      - name: transcode-cleanup
        image: docker.io/jellyfin/jellyfin:12.1
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
          - sh
          - -c
          - |
            test -f /config/config/encoding.xml || exit 0
            sed -i -E 's#<(EnableThrottling|EnableSegmentDeletion)>false<#<\1>true<#' /config/config/encoding.xml
            grep -oE '<(EnableThrottling|EnableSegmentDeletion)>[a-z]*' /config/config/encoding.xml
        resources:
          requests: {cpu: 10m, memory: 16Mi}
          limits: {cpu: 200m, memory: 64Mi}
        volumeMounts:
          - name: config
            mountPath: /config

    persistence:
      config:
        enabled: true
        existingClaim: jellyfin-config-local
      media:
        enabled: true
        type: hostPath
        hostPath: "/mnt/hdd"
      # Not enabled = node-local emptyDir: temporary by design, wiped on every restart
      # and never replicated by Longhorn. Images and metadata re-download on demand.
      cache:
        enabled: false

    nodeSelector:
      kubernetes.io/hostname: ${media_node}
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  endpointSelector: {}
  ingress:
    # Web and streaming ingress from Traefik, Jellyseerr, and local LAN;
    # library refresh notifications from Radarr and Sonarr;
    # session polling from Tracearr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
        - matchLabels:
            io.kubernetes.pod.namespace: tracearr
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Live TV from Dispatcharr (HDHomeRun tuner, XMLTV guide and streams)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
      toPorts:
        - ports:
            - port: "9191"
              protocol: TCP
    # Jellyfin Enhanced: requests and discovery proxied to Seerr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
    # Metadata, plugin repositories, cover art
    # SSO plugin: Authelia token/userinfo calls; auth.<domain> resolves to the
    # Traefik LoadBalancer IP, which Cilium translates to the Traefik pod
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    - toEntities:
        - world

