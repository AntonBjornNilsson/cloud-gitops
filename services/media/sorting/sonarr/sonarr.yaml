apiVersion: v1
kind: Namespace
metadata:
  name: sonarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sonarr-config
  namespace: sonarr
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  namespace: sonarr
spec:
  # Single SQLite database on an RWO volume: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: ${media_node}
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
            # Authelia guards the UI; without this Sonarr forces its own login on first start.
            # The API still requires the API key (Prowlarr and Jellyseerr connect in-cluster).
            - name: SONARR__AUTH__METHOD
              value: External
            - name: SONARR__AUTH__REQUIRED
              value: Enabled
          ports:
            - name: http
              containerPort: 8989
          startupProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 65m
              memory: 256Mi
            limits:
              cpu: 2
              memory: 1Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sonarr-config
        - name: data
          hostPath:
            path: /mnt/hdd/Shared
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      port: 8989
      targetPort: 8989
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Sonarr"
    gethomepage.dev/description: "TV Management"
    gethomepage.dev/group: "Library"
    gethomepage.dev/icon: "sonarr.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=sonarr"
    gethomepage.dev/widget.type: "sonarr"
    gethomepage.dev/widget.url: "http://sonarr.sonarr.svc.cluster.local:8989"
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
spec:
  ingressClassName: traefik
  rules:
    - host: sonarr.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sonarr
                port:
                  number: 8989
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: sonarr
  namespace: sonarr
spec:
  endpointSelector:
    matchLabels:
      app: sonarr
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Requests from Jellyseerr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Indexer sync from Prowlarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prowlarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Subtitle management from Bazarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bazarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Stream integration from Dispatcharr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Queue cleanup from Cleanuparr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: cleanuparr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Profile and custom format sync from Recyclarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: recyclarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Dashboard widget API calls from Homepage
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: homepage
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Download management on qBittorrent
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Indexer search on Prowlarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Webhook triggers to Bazarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bazarr
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
    # Library refresh on import (Jellyfin connection)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
    # External metadata APIs (TVDB, Sonarr API)
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
