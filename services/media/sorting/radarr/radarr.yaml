apiVersion: v1
kind: Namespace
metadata:
  name: radarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: radarr-config
  namespace: radarr
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radarr
  namespace: radarr
spec:
  selector:
    matchLabels:
      app: radarr
  template:
    metadata:
      labels:
        app: radarr
    spec:
      nodeSelector:
        kubernetes.io/hostname: nilsson-server
      tolerations:
        - key: "node-role.kubernetes.io/control-plane"
          effect: "NoSchedule"
      containers:
        - name: radarr
          image: lscr.io/linuxserver/radarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
          ports:
            - name: http
              containerPort: 7878
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /data
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: radarr-config
        - name: data
          hostPath:
            path: /mnt/hdd/Shared
---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: radarr
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 7878
      targetPort: 7878
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr
  namespace: radarr
spec:
  ingressClassName: traefik
  rules:
    - host: radarr.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: radarr
                port:
                  number: 7878
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: radarr
  namespace: radarr
spec:
  endpointSelector:
    matchLabels:
      app: radarr
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Requests from Jellyseerr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: jellyseerr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Indexer sync from Prowlarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prowlarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Subtitle management from Bazarr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bazarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Stream integration from Dispatcharr
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: dispatcharr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Download management on qBittorrent
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Indexer search on Prowlarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
    # Webhook triggers to Bazarr
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: bazarr
      toPorts:
        - ports:
            - port: "6767"
              protocol: TCP
    # External metadata APIs (TMDB, Radarr API)
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
