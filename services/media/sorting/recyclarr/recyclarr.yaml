apiVersion: v1
kind: Namespace
metadata:
  name: recyclarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Secret
metadata:
  name: recyclarr-api-keys
  namespace: recyclarr
stringData:
  SONARR_API_KEY: "${sonarr_api_key}"
  RADARR_API_KEY: "${radarr_api_key}"
---
# TRaSH Guides 1080p profiles. Recyclarr owns these profiles and their custom formats:
# edit scores here, not in the Sonarr/Radarr UI (the next sync overwrites UI changes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: recyclarr
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      sonarr:
        base_url: http://sonarr.sonarr.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true

        # TRaSH's Bluray-1080p minimum (50.4 MB/min) is sized for full-bitrate encodes and
        # rejects most 1080p BluRay encodes and season packs (e.g. 35 GB for a 16-episode
        # season), so Cleanuparr's replacement searches came back empty. 20 MB/min still
        # filters out the tiny low-bitrate ones.
        quality_definition:
          type: series
          qualities:
            - name: Bluray-1080p
              min: 20

        # Every series uses this profile. Besides TRaSH's WEB 1080p it also accepts BluRay
        # (anime and older shows have no WEB release) and HDTV (the only 1080p source for some
        # shows), best first. Upgrades still stop at WEB 1080p, so nothing re-downloads to BluRay.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # No Golden Rule HD here: Korean drama and anime packs are mostly 1080p x265, which it blocks.
        custom_format_groups:
          add:
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs

    radarr:
      radarr:
        base_url: http://radarr.radarr.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true

        # Same as Sonarr: TRaSH's 50.8 MB/min (5.7 GB for a 2-hour film) rejects normal
        # 1080p BluRay encodes; 20 MB/min is about 2.3 GB for 2 hours.
        quality_definition:
          type: movie
          qualities:
            - name: Bluray-1080p
              min: 20

        # Every movie uses this profile. 1080p only: TRaSH's Bluray-720p fallback is left out.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p

        # No Golden Rule HD, as for Sonarr: 1080p x265 encodes are allowed.
        custom_format_groups:
          add:
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  schedule: "0 4 * * *"
  timeZone: "Europe/Stockholm"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: recyclarr
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              image: ghcr.io/recyclarr/recyclarr:9.0.0
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              # Any argument makes the entrypoint run the CLI once instead of its own cron
              args: ["sync"]
              env:
                - name: TZ
                  value: "Europe/Stockholm"
              envFrom:
                - secretRef:
                    name: recyclarr-api-keys
              resources:
                requests:
                  cpu: 20m
                  memory: 128Mi
                limits:
                  cpu: 1
                  memory: 512Mi
              volumeMounts:
                # Writable: Recyclarr clones the TRaSH guides repo and keeps a cache here
                - name: config
                  mountPath: /config
                - name: recyclarr-config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
          volumes:
            - name: config
              emptyDir: {}
            - name: recyclarr-config
              configMap:
                name: recyclarr-config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  endpointSelector:
    matchLabels:
      app: recyclarr
  ingress: []
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Profile and custom format sync
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # TRaSH guides and config templates (git clone from GitHub)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
