apiVersion: v1
kind: Namespace
metadata:
  name: recyclarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Secret
metadata:
  name: recyclarr-api-keys
  namespace: recyclarr
stringData:
  SONARR_API_KEY: "${sonarr_api_key}"
  RADARR_API_KEY: "${radarr_api_key}"
---
# TRaSH Guides 1080p profiles. Recyclarr owns these profiles and their custom formats:
# edit scores here, not in the Sonarr/Radarr UI (the next sync overwrites UI changes).
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: recyclarr
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v9/config-schema.json
    sonarr:
      sonarr:
        base_url: http://sonarr.sonarr.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        delete_old_custom_formats: true

        # TRaSH's Bluray-1080p minimum (50.4 MB/min) is sized for full-bitrate encodes and
        # rejects most 1080p BluRay encodes and season packs (e.g. 35 GB for a 16-episode
        # season), so Cleanuparr's replacement searches came back empty. 20 MB/min still
        # filters out the tiny low-bitrate ones.
        quality_definition:
          type: series
          qualities:
            - name: Bluray-1080p
              min: 20

        # Every series uses this profile. Besides TRaSH's WEB 1080p it also accepts BluRay
        # (anime and older shows have no WEB release) and HDTV (the only 1080p source for some
        # shows), best first. Upgrades still stop at WEB 1080p, so nothing re-downloads to BluRay.
        quality_profiles:
          - trash_id: 72dae194fc92bf828f32cde7744e51a1  # WEB-1080p
            reset_unmatched_scores:
              enabled: true
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p
              - name: HDTV-1080p

        # No Golden Rule HD here: Korean drama and anime packs are mostly 1080p x265, which it blocks.
        custom_format_groups:
          add:
            - trash_id: 85fae4a2294965b75710ef2989c850eb  # [Streaming Services] HD/UHD boost
            - trash_id: 59c3af66780d08332fdc64e68297098f  # [Unwanted] Unwanted Formats
            - trash_id: d920fd959d220306888f40b6f38e1578  # [Optional] Season Packs

    radarr:
      radarr:
        base_url: http://radarr.radarr.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        delete_old_custom_formats: true

        # Same as Sonarr: TRaSH's 50.8 MB/min (5.7 GB for a 2-hour film) rejects normal
        # 1080p BluRay encodes; 20 MB/min is about 2.3 GB for 2 hours.
        quality_definition:
          type: movie
          qualities:
            - name: Bluray-1080p
              min: 20

        # Every movie uses this profile. 1080p only: TRaSH's Bluray-720p fallback is left out.
        quality_profiles:
          - trash_id: d1d67249d3890e49bc12e275d989a7e9  # HD Bluray + WEB
            reset_unmatched_scores:
              enabled: true
            qualities:
              - name: Bluray-1080p
              - name: WEB 1080p
                qualities:
                  - WEBDL-1080p
                  - WEBRip-1080p

        # No Golden Rule HD, as for Sonarr: 1080p x265 encodes are allowed.
        custom_format_groups:
          add:
            - trash_id: a3ac6af01d78e4f21fcb75f601ac96df  # [Unwanted] Unwanted Formats
  # Server settings. The schedule replaces the old CronJob; TZ (below) sets its time zone.
  settings.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v9/settings-schema.json
    server:
      schedule:
        cron: "0 4 * * *"
---
# Recyclarr's state: which Sonarr/Radarr custom formats and profiles it created.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: recyclarr-state
  namespace: recyclarr
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 1Gi
---
# Recyclarr 9 is a server: it syncs on its own schedule (settings.yml) and the image no
# longer runs CLI commands passed as arguments. Sync by hand with
#   kubectl -n recyclarr exec deploy/recyclarr -- recyclarr sync [--preview]
apiVersion: apps/v1
kind: Deployment
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: recyclarr
  template:
    metadata:
      labels:
        app: recyclarr
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The server refuses to start without an API key (32+ characters). Only the CLI in
        # this same container uses it, so a fresh random key per pod start is enough.
        - name: api-key
          image: ghcr.io/recyclarr/recyclarr:9.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - umask 077 && head -c 48 /dev/urandom | base64 | tr -d '\n=+/' > /run/recyclarr/api-key
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: api-key
              mountPath: /run/recyclarr
      containers:
        - name: recyclarr
          image: ghcr.io/recyclarr/recyclarr:9.0.0
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: TZ
              value: "Europe/Stockholm"
            - name: RECYCLARR_API_KEY_FILE
              value: /run/recyclarr/api-key
            # /config is the read-only ConfigMap; downloaded guides and logs go to an
            # emptyDir, state to the PVC
            - name: RECYCLARR_DATA_DIR
              value: /data
            - name: RECYCLARR_STATE_DIR
              value: /state
          envFrom:
            - secretRef:
                name: recyclarr-api-keys
          ports:
            - name: api
              containerPort: 7982
              protocol: TCP
            - name: metrics
              containerPort: 7983
              protocol: TCP
          # No port opens until the first TRaSH guides download finishes
          startupProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /livez
              port: metrics
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 192Mi
            limits:
              cpu: 1
              memory: 768Mi
          volumeMounts:
            # Mounted as a directory (no subPath) so ConfigMap edits reach the pod
            - name: recyclarr-config
              mountPath: /config
              readOnly: true
            - name: state
              mountPath: /state
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: api-key
              mountPath: /run/recyclarr
              readOnly: true
      volumes:
        - name: recyclarr-config
          configMap:
            name: recyclarr-config
        - name: state
          persistentVolumeClaim:
            claimName: recyclarr-state
        - name: data
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: api-key
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: recyclarr
  namespace: recyclarr
spec:
  endpointSelector:
    matchLabels:
      app: recyclarr
  ingress:
    # Kubelet probes (/livez, /readyz)
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "7983"
              protocol: TCP
    # Sync metrics
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "7983"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Profile and custom format sync
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: sonarr
      toPorts:
        - ports:
            - port: "8989"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: radarr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
    # TRaSH guides (download from GitHub)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
