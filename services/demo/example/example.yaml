apiVersion: v1
kind: Namespace
metadata:
  name: nginx-echo-namespace
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  namespace: nginx-echo-namespace
  labels:
    app: nginx-echo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-echo
  template:
    metadata:
      labels:
        app: nginx-echo
    spec:
      # Echoes the request (path, headers, client IP, hostname) as JSON
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx-echo
          image: ghcr.io/mendhak/http-https-echo:43
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 96Mi

---
kind: Service
apiVersion: v1
metadata:
  name: nginx-echo
  namespace: nginx-echo-namespace
  labels:
    app: nginx-echo
spec:
  selector:
    app: nginx-echo
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello
  namespace: nginx-echo-namespace
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Hello"
    gethomepage.dev/description: "Echo Server"
    gethomepage.dev/group: "Demo"
    gethomepage.dev/icon: "nginx.png"
    gethomepage.dev/pod-selector: "app=nginx-echo"
spec:
  ingressClassName: traefik
  rules:
  - host: hello.${domain}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-echo
            port:
              number: 80
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nginx-echo
  namespace: nginx-echo-namespace
spec:
  endpointSelector:
    matchLabels:
      app: nginx-echo
  ingress:
    # HTTP ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
          rules:
            http: [{}]
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"