---
apiVersion: v1
kind: Namespace
metadata:
  name: jellyfin
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 24h
  url: https://jellyfin.github.io/jellyfin-helm
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: jellyfin
  namespace: jellyfin
spec:
  interval: 12h
  chart:
    spec:
      chart: jellyfin
      version: "3.2.0"
      sourceRef:
        kind: HelmRepository
        name: jellyfin
        namespace: jellyfin
      interval: 12h
  timeout: 30s
  values:
    replicaCount: 1
    resources:
      limits:
        cpu: 2000m
        memory: 2048Mi
      requests:
        cpu: 500m
        memory: 512Mi

    ingress:
      enabled: true
      ingressClassName: "traefik"
      hosts:
        - host: stream.${auth_domain}
          paths:
            - path: /
              pathType: Prefix

    persistence:
      config:
        enabled: true
        accessMode: ReadWriteMany
      media:
        enabled: true
        type: hostPath
        hostPath: "/mnt/hdd"
      cache:
        enabled: true
        accessMode: ReadWriteMany

    nodeSelector:
      kubernetes.io/hostname: nilsson-server
    tolerations:
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
