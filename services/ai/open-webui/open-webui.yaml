---
apiVersion: v1
kind: Namespace
metadata:
  name: open-webui
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 24h
  url: https://helm.openwebui.com/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
  namespace: open-webui
spec:
  interval: 11h
  chart:
    spec:
      chart: open-webui
      version: "16.6.0"
      sourceRef:
        kind: HelmRepository
        name: open-webui
        namespace: open-webui
      interval: 12h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    sso:
      enabled: true
      enableSignup: true
      oidc:
        enabled: true
        clientId: ${open_webui_client_id}
        clientSecret: ${open_webui_client_secret}
        providerUrl: ${open_webui_provider_url}
        providerName: ${open_webui_provider_name}
        scopes: ${open_webui_scopes}
    # Roles from Authelia groups: open-webui -> user, admin -> admin; anyone else is refused
    extraEnvVars:
      - name: ENABLE_OAUTH_ROLE_MANAGEMENT
        value: "true"
      - name: OAUTH_ROLES_CLAIM
        value: groups
      - name: OAUTH_ALLOWED_ROLES
        value: open-webui,admin
      - name: OAUTH_ADMIN_ROLES
        value: admin
      # Same as Grafana: link to existing accounts by email (single IdP, unique emails)
      - name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL
        value: "true"
      # On the volume: the default (/app/backend, in the image) is lost on every restart
      # and not writable by the non-root user
      - name: WEBUI_SECRET_KEY_FILE
        value: /app/backend/data/.webui_secret_key
    replicaCount: 1
    resources:
      requests:
        cpu: 10m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 2Gi
    # The image defaults to root. As 1000 the app only needs its data volume (root-owned
    # from before; fsGroup makes it group-writable once) and a writable static dir, which
    # it rewrites on startup: an emptyDir seeded from the image by copy-app-data.
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: ["ALL"]
    volumes:
      - name: static
        emptyDir: {}
    volumeMounts:
      initContainer:
        - name: static
          mountPath: /tmp/static
      container:
        - name: static
          mountPath: /app/backend/open_webui/static
    # Init container copying the app data into the volume (chart default command), and
    # the image's static files into the writable static dir
    copyAppData:
      command:
        - sh
        - -c
        - cp -R -n /app/backend/data/* /tmp/app-data/; cp -R /app/backend/open_webui/static/. /tmp/static/
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 512Mi
    persistence:
      labels:
        backup.longhorn.io/enabled: "true"

    ollama:
      enabled: false

    ollamaUrls:
      - http://ollama.ollama.svc.cluster.local:11434

    websocket:
      enabled: true
      manager: redis
      redis:
        enabled: true
        # redis user/group of the alpine image; no volume
        podSecurityContext:
          runAsNonRoot: true
          runAsUser: 999
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        containerSecurityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          requests:
            cpu: 5m
            memory: 16Mi
          limits:
            cpu: 200m
            memory: 64Mi

    pipelines:
      enabled: false

    tika:
      enabled: false

    ingress:
      enabled: true
      class: "traefik"
      host: "ai.${domain}"
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Open WebUI"
        gethomepage.dev/description: "Local LLM Interface"
        gethomepage.dev/group: "AI"
        gethomepage.dev/icon: "open-webui.png"

    persistentVolume:
      enabled: true

---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-webui
  namespace: open-webui
spec:
  endpointSelector: {}
  ingress:
    # HTTP ingress from Traefik and cluster
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Intra-namespace communication (webui <-> redis)
    - fromEndpoints:
        - {}
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Ollama backend in ollama namespace
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    # Identity Provider OIDC (Authelia)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authelia
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # OIDC discovery/token exchange via the public auth hostname. It
    # resolves to the Traefik LoadBalancer IP, which Cilium translates to the
    # Traefik pod, so the policy sees the container ports, not 80/443.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Intra-namespace (Redis)
    - toEndpoints:
        - {}
    # External APIs (HuggingFace, model downloads, web search)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
---