---
apiVersion: v1
kind: Namespace
metadata:
  name: ollama
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 24h
  url: https://otwld.github.io/ollama-helm/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ollama
  namespace: ollama
spec:
  interval: 11h
  chart:
    spec:
      chart: ollama
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: ollama
        namespace: ollama
      interval: 12h
  timeout: 15m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    ollama:
      gpu:
        enabled: true
        type: "amd"
        number: 1
      # models.pull is intentionally omitted — the pull Job runs on every helm
      # upgrade and causes Flux health checks to time out. Models are persisted
      # on the PVC and survive pod restarts. Pull new models imperatively via:
      #   kubectl exec -n ollama deploy/ollama -- ollama pull <model>
    # In-cluster only: the API has no auth, and its clients (open-webui,
    # holmesgpt) use the Service DNS name
    service:
      type: ClusterIP
    image:
      tag: "rocm" # force amd
    persistentVolume:
      enabled: true
      size: 60Gi
    gpu:
      enabled: true
      type: "amd"
      number: 1
    tolerations:
    - key: "GPU"
      operator: "Equal"
      value: "true"
      effect: "NoSchedule"
    resources:
      requests:
        memory: "4Gi"
        cpu: "2"
        amd.com/gpu: "1"
      limits:
        memory: "10Gi"
        cpu: "6"
        amd.com/gpu: "1"
    # extraEnv:
    #   - name: OLLAMA_DEBUG
    #     value: "2"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ollama
  namespace: ollama
spec:
  endpointSelector: {}
  ingress:
    # API requests from open-webui and holmesgpt only
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: open-webui
        - matchLabels:
            io.kubernetes.pod.namespace: holmesgpt
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    # Health and liveness probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Intra-namespace communication (model pull job <-> ollama server)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
    # Model downloads from ollama library / huggingface
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP



