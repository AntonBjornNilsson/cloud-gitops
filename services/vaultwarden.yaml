---
apiVersion: v1
kind: Namespace
metadata:
  name: vaultwarden
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gabe565
  namespace: vaultwarden
spec:
  interval: 24h
  url: https://charts.gabe565.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: vaultwarden
  namespace: vaultwarden
spec:
  interval: 12h
  chart:
    spec:
      chart: vaultwarden
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: vaultwarden
      interval: 12h
  timeout: 30s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    env:
      ADMIN_TOKEN: ${vaultwarden_admin_token}
      SIGNUPS_ALLOWED: "true"
    ingress:
      main:
        enabled: true
        className: "traefik"
        hosts:
          - host: vault.${domain}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      data:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 2Gi
        globalMounts:
          - path: /data
