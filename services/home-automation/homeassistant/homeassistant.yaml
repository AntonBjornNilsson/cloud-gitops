apiVersion: v1
kind: Namespace
metadata:
  name: homeassistant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-config
  namespace: homeassistant
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  # SQLite recorder database on an RWO volume: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: homeassistant
  template:
    metadata:
      labels:
        app: homeassistant
    spec:
      initContainers:
        # configuration.yaml includes these; Home Assistant only creates them
        # together with a default configuration.yaml, which Git provides instead
        - name: include-files
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          command:
            - sh
            - -c
            - |
              test -f /config/automations.yaml || echo "[]" > /config/automations.yaml
              touch /config/scripts.yaml /config/scenes.yaml
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: http-store
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          command: ["python3", "/scripts/http-store.py"]
          env:
            - name: TRUSTED_PROXIES
              value: "${pod_cidr}"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /scripts/http-store.py
              subPath: http-store.py
              readOnly: true
      containers:
        - name: homeassistant
          image: ghcr.io/home-assistant/home-assistant:2026.10.4
          env:
            - name: TZ
              value: "Europe/Stockholm"
          ports:
            - name: http
              containerPort: 8123
          startupProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /manifest.json
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 350m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: configuration
              mountPath: /config/configuration.yaml
              subPath: configuration.yaml
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: homeassistant-config
        - name: configuration
          configMap:
            name: homeassistant-config
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    app: homeassistant
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homeassistant
  namespace: homeassistant
  # Home Assistant authenticates itself; Authelia would block the companion
  # apps. LAN-only (websecure); deliberately not published through cfgate.
  labels:
    enable-oauth: "false"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ""
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Home Assistant"
    gethomepage.dev/description: "Home automation"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "home-assistant.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=homeassistant"
spec:
  ingressClassName: traefik
  rules:
    - host: homeassistant.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: homeassistant
                port:
                  number: 8123
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  endpointSelector:
    matchLabels:
      app: homeassistant
  ingress:
    # Web UI, WebSocket API and companion apps through Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # LAN devices (polled by IP) and cloud integrations
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
