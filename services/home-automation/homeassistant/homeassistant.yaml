---
apiVersion: v1
kind: Namespace
metadata:
  name: homeassistant
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: gabe565
  namespace: homeassistant
spec:
  interval: 24h
  url: https://charts.gabe565.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  interval: 12h
  chart:
    spec:
      chart: home-assistant
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: gabe565
        namespace: homeassistant
      interval: 12h
  timeout: 30s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    env:
      TZ: Europe/Stockholm
    ingress:
      main:
        enabled: true
        className: "traefik"
        hosts:
          - host: homeassistant.${domain}
            paths:
              - path: /
                pathType: Prefix
    persistence:
      config:
        enabled: true
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /config
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  endpointSelector: {}
  ingress:
    # Web and WebSocket ingress from Traefik and local LAN
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    - fromEntities:
        - cluster
        - host
        - remote-node
        - world
      toPorts:
        - ports:
            - port: "8123"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Local network IoT devices, integrations, and external cloud services
    - toEntities:
        - world
        - cluster
        - host
        - remote-node

