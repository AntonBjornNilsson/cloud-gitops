# Managed in Git (mounted read-only); automations, scripts and scenes made in the
# UI go to their own files on the config volume. HTTP settings (reverse proxy)
# live in .storage/http, written by the http-store init container.
default_config:

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Entity states for VictoriaMetrics (/api/prometheus, needs a long-lived token)
prometheus:
