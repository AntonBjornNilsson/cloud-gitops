---
apiVersion: v1
kind: Namespace
metadata:
  name: ntfy
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-config
  namespace: ntfy
type: Opaque
stringData:
  # ntfy does its own auth (not Authelia) so the mobile apps can log in.
  # Users, ACLs and tokens are provisioned from the secrets repo on startup:
  #   ntfy_admin_user / ntfy_admin_password_hash  -> you (phone, web app)
  #   ntfy_alertmanager_password_hash / ntfy_alertmanager_token -> alert bridge
  # Hashes: `ntfy user hash`; token: `ntfy token generate` (tk_..., 32 chars).
  server.yml: |
    base-url: "https://ntfy.${domain}"
    listen-http: ":80"
    cache-file: "/var/lib/ntfy/cache.db"
    cache-duration: "72h"
    attachment-cache-dir: "/var/lib/ntfy/attachments"
    attachment-total-size-limit: "5G"
    attachment-file-size-limit: "25M"
    behind-proxy: true
    # Defaults (burst 60, +1 per 5s) are shared by everything on the alertmanager
    # token; the bridge posts one message per alert, so a big alert group plus
    # Alertmanager retries keeps the bucket empty and every notify fails with 429.
    visitor-request-limit-burst: 300
    visitor-request-limit-replenish: "1s"
    upstream-base-url: "https://ntfy.sh"
    # Prometheus metrics on a separate port (not reachable via the Ingress)
    metrics-listen-http: ":9090"
    auth-file: "/var/lib/ntfy/user.db"
    auth-default-access: "deny-all"
    enable-login: true
    auth-users:
      - "${ntfy_admin_user}:${ntfy_admin_password_hash}:admin"
      - "alertmanager:${ntfy_alertmanager_password_hash}:user"
    auth-access:
      - "alertmanager:homelab-alerts:wo"
      # claude-agent reports, sent by the claude-agent service with the same token
      - "alertmanager:claude-agent:wo"
      # Seerr request/issue notifications (token set in Seerr's ntfy agent settings)
      - "alertmanager:seerr:wo"
      # Cleanuparr strike/removal notifications (same token)
      - "alertmanager:cleanuparr:wo"
    auth-tokens:
      - "alertmanager:${ntfy_alertmanager_token}:alertmanager-ntfy bridge"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ntfy-data
  namespace: ntfy
  labels:
    backup.longhorn.io/enabled: "true"
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: ntfy
  template:
    metadata:
      labels:
        app: ntfy
      annotations:
        # Bump to restart ntfy after changing server.yml
        config-version: "6"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root process bind port 80 (namespaced, safe sysctl)
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      containers:
        - name: ntfy
          image: binwiederhier/ntfy:v2.34.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          args:
            - serve
            - --config=/etc/ntfy/server.yml
          ports:
            - containerPort: 80
              name: http
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: config
              mountPath: /etc/ntfy
            - name: data
              mountPath: /var/lib/ntfy
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: config
          secret:
            secretName: ntfy-config
        - name: data
          persistentVolumeClaim:
            claimName: ntfy-data
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy
  namespace: ntfy
  labels:
    app: ntfy
spec:
  selector:
    app: ntfy
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ntfy
  namespace: ntfy
  # ntfy authenticates itself; Authelia would block the mobile apps
  labels:
    enable-oauth: "false"
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: ""
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "Ntfy"
    gethomepage.dev/description: "Push Notifications"
    gethomepage.dev/group: "Observability"
    gethomepage.dev/icon: "ntfy.png"
    # Homepage looks for app.kubernetes.io/name=<ingress> by default
    gethomepage.dev/pod-selector: "app=ntfy"
spec:
  rules:
    - host: ntfy.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ntfy
                port:
                  number: 80
