---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
  namespace: homepage
spec:
  interval: 24h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 12h
  chart:
    spec:
      chart: homepage
      version: "2.1.0"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
      interval: 12h
  timeout: 5m0s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    enableRbac: true
    serviceAccount:
      create: true
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: "homepage.${domain},${domain}"
      - name: HOMEPAGE_AUTH_ENABLED
        value: "true"
      - name: HOMEPAGE_AUTH_SECRET
        value: "${homepage_auth_secret}"
      - name: HOMEPAGE_EXTERNAL_URL
        value: "https://homepage.${domain}"
      - name: HOMEPAGE_OIDC_ISSUER
        value: "https://auth.${domain}"
      - name: HOMEPAGE_OIDC_CLIENT_ID
        value: "homepage"
      - name: HOMEPAGE_OIDC_CLIENT_SECRET
        value: "${homepage_client_secret}"
      - name: HOMEPAGE_OIDC_SCOPE
        value: "openid email profile groups"
      - name: HOMEPAGE_OIDC_NAME
        value: "Authelia"
      - name: HOMEPAGE_OIDC_AUTO_LOGIN
        value: "true"
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        labels:
          enable-oauth: "true"
        hosts:
          - host: homepage.${domain}
            paths:
              - path: /
                pathType: Prefix
    config:
      settings:
        title: Homelab Dashboard
        theme: dark
        color: slate
        headerStyle: boxed
        cardBlur: sm
      kubernetes:
        mode: cluster
      bookmarks:
        - Developer:
            - GitHub:
                - icon: github.png
                  href: https://github.com
            - YouTube:
                - icon: youtube.png
                  href: https://youtube.com
            - Messenger:
                - icon: facebook-messenger.png
                  href: https://messenger.com
            - Klart:
                - icon: mdi-weather-partly-cloudy
                  href: https://klart.se
        - Streaming:
            - Netflix:
                - icon: netflix.png
                  href: https://netflix.com
            - Prime Video:
                - icon: prime-video.png
                  href: https://primevideo.com
            - Disney+:
                - icon: disney-plus.png
                  href: https://disneyplus.com
            - HBO Max:
                - icon: max.png
                  href: https://max.com
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
  namespace: homepage
spec:
  endpointSelector: {}
  ingress:
    # Web ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http: [{}]
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API Server for service and ingress auto-discovery
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Internal cluster services queried by dashboard widgets
    - toEntities:
        - cluster
    # External services, icons, weather APIs
    - toEntities:
        - world
