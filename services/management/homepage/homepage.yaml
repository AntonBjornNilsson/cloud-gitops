---
apiVersion: v1
kind: Namespace
metadata:
  name: homepage
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: jameswynn
  namespace: homepage
spec:
  interval: 24h
  url: https://jameswynn.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: homepage
  namespace: homepage
spec:
  interval: 12h
  chart:
    spec:
      chart: homepage
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: jameswynn
        namespace: homepage
      interval: 12h
  timeout: 5m0s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    env:
      - name: HOMEPAGE_ALLOWED_HOSTS
        value: "homepage.${domain},${domain}"
      - name: HOMEPAGE_AUTH_ENABLED
        value: "true"
      - name: HOMEPAGE_AUTH_SECRET
        value: "${homepage_auth_secret}"
      - name: HOMEPAGE_EXTERNAL_URL
        value: "https://homepage.${domain}"
      - name: HOMEPAGE_OIDC_ISSUER
        value: "https://auth.${domain}"
      - name: HOMEPAGE_OIDC_CLIENT_ID
        value: "homepage"
      - name: HOMEPAGE_OIDC_CLIENT_SECRET
        value: "${homepage_client_secret}"
      - name: HOMEPAGE_OIDC_SCOPE
        value: "openid email profile groups"
      - name: HOMEPAGE_OIDC_NAME
        value: "Authelia"
      - name: HOMEPAGE_OIDC_AUTO_LOGIN
        value: "true"
    ingress:
      main:
        enabled: true
        ingressClassName: "traefik"
        labels:
          enable-oauth: "true"
        hosts:
          - host: homepage.${domain}
            paths:
              - path: /
                pathType: Prefix
    config:
      settings:
        title: Homelab Dashboard
        theme: dark
        color: slate
        headerStyle: boxed
        cardBlur: sm
      bookmarks:
        - Developer:
            - GitHub:
                - icon: github.png
                  href: https://github.com
            - YouTube:
                - icon: youtube.png
                  href: https://youtube.com
      services:
        - Infrastructure & Management:
            - Headlamp:
                icon: headlamp.png
                href: https://headlamp.${domain}
                description: Kubernetes Dashboard
            - Grafana:
                icon: grafana.png
                href: https://grafana.${domain}
                description: Monitoring & Metrics
            - Hubble:
                icon: cilium.png
                href: https://hubble.${domain}
                description: Network Observability
            - Longhorn:
                icon: longhorn.png
                href: https://longhorn.${domain}
                description: Distributed Block Storage
            - AdGuard Home:
                icon: adguard-home.png
                href: https://adguard.${domain}
                description: DNS & Ad Blocking
            - Ntfy:
                icon: ntfy.png
                href: https://ntfy.${domain}
                description: Push Notifications
        - Media & Entertainment:
            - Jellyfin:
                icon: jellyfin.png
                href: https://stream.${domain}
                description: Media Streaming
            - Dispatcharr:
                icon: dispatcharr.png
                href: https://dispatcharr.${domain}
                description: Stream Management
            - Jellyseerr:
                icon: jellyseerr.png
                href: https://requests.${domain}
                description: Media Requests
        - Media Automation:
            - Sonarr:
                icon: sonarr.png
                href: https://sonarr.${domain}
                description: TV Series Management
            - Radarr:
                icon: radarr.png
                href: https://radarr.${domain}
                description: Movies Management
            - Prowlarr:
                icon: prowlarr.png
                href: https://prowlarr.${domain}
                description: Indexer Manager
            - Bazarr:
                icon: bazarr.png
                href: https://bazarr.${domain}
                description: Subtitle Management
            - qBittorrent:
                icon: qbittorrent.png
                href: https://qbit.${domain}
                description: Torrent Client
        - AI:
            - Open WebUI:
                icon: open-webui.png
                href: https://ai.${domain}
                description: Local LLM Interface
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: homepage
  namespace: homepage
spec:
  endpointSelector: {}
  ingress:
    # Web ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http: [{}]
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Internal cluster services queried by dashboard widgets
    - toEntities:
        - cluster
    # External services, icons, weather APIs
    - toEntities:
        - world

