apiVersion: v1
kind: Namespace
metadata:
  name: unifi
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# unifi_mongo_password: alphanumeric only (it ends up in a MongoDB URI), e.g. `openssl rand -hex 24`.
# Used for both the MongoDB root user and the controller's own user.
apiVersion: v1
kind: Secret
metadata:
  name: unifi-mongo
  namespace: unifi
type: Opaque
stringData:
  password: "${unifi_mongo_password}"
---
# Runs once, on the first start of an empty MongoDB volume: creates the controller's user.
# The ${...} below are shell variables, so Flux must not substitute them.
apiVersion: v1
kind: ConfigMap
metadata:
  name: unifi-mongo-init
  namespace: unifi
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  init-mongo.sh: |
    #!/bin/bash
    mongosh <<EOF
    use ${MONGO_AUTHSOURCE}
    db.auth("${MONGO_INITDB_ROOT_USERNAME}", "${MONGO_INITDB_ROOT_PASSWORD}")
    db.createUser({
      user: "${MONGO_USER}",
      pwd: "${MONGO_PASS}",
      roles: [
        { db: "${MONGO_DBNAME}", role: "dbOwner" },
        { db: "${MONGO_DBNAME}_stat", role: "dbOwner" },
        { db: "${MONGO_DBNAME}_audit", role: "dbOwner" }
      ]
    })
    EOF
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-config
  namespace: unifi
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-mongo
  namespace: unifi
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: unifi
spec:
  # MongoDB on RWO volumes: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      containers:
        - name: unifi
          image: lscr.io/linuxserver/unifi-network-application:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: "Europe/Stockholm"
            # MONGO_* are only read on first start, to write /config/data/system.properties
            - name: MONGO_HOST
              value: localhost
            - name: MONGO_PORT
              value: "27017"
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_AUTHSOURCE
              value: admin
            - name: MONGO_USER
              value: unifi
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo
                  key: password
            - name: MEM_LIMIT
              value: "1024"
            - name: MEM_STARTUP
              value: "512"
          ports:
            - name: https
              containerPort: 8443
            - name: inform
              containerPort: 8080
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10001
              protocol: UDP
            - name: speedtest
              containerPort: 6789
          startupProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 10
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /status
              port: https
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              memory: 2Gi
          volumeMounts:
            - name: config
              mountPath: /config
        - name: mongo
          image: docker.io/mongo:8.0
          env:
            - name: MONGO_INITDB_ROOT_USERNAME
              value: root
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo
                  key: password
            - name: MONGO_DBNAME
              value: unifi
            - name: MONGO_AUTHSOURCE
              value: admin
            - name: MONGO_USER
              value: unifi
            - name: MONGO_PASS
              valueFrom:
                secretKeyRef:
                  name: unifi-mongo
                  key: password
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: mongo
              mountPath: /data/db
            - name: mongo-init
              mountPath: /docker-entrypoint-initdb.d/init-mongo.sh
              subPath: init-mongo.sh
              readOnly: true
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: unifi-config
        - name: mongo
          persistentVolumeClaim:
            claimName: unifi-mongo
        - name: mongo-init
          configMap:
            name: unifi-mongo-init
            defaultMode: 0755
---
# Web UI, through Traefik. The controller only serves HTTPS with its own self-signed cert.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi
  namespace: unifi
spec:
  insecureSkipVerify: true
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: unifi-unifi@kubernetescrd
spec:
  selector:
    app: unifi
  ports:
    - name: https
      port: 8443
      targetPort: 8443
---
# Device traffic on a fixed LAN IP. Set the controller's "Inform Host" override to this IP
# so adopted devices keep finding it.
apiVersion: v1
kind: Service
metadata:
  name: unifi-devices
  namespace: unifi
  annotations:
    metallb.io/loadBalancerIPs: "${unifi_lb_ip}"
spec:
  type: LoadBalancer
  selector:
    app: unifi
  ports:
    - name: inform
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: discovery
      port: 10001
      targetPort: 10001
      protocol: UDP
    - name: speedtest
      port: 6789
      targetPort: 6789
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi
  namespace: unifi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "UniFi"
    gethomepage.dev/description: "Network controller"
    gethomepage.dev/group: "Infrastructure & Management"
    gethomepage.dev/icon: "unifi.png"
    gethomepage.dev/pod-selector: "app=unifi"
spec:
  ingressClassName: traefik
  rules:
    - host: unifi.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unifi
                port:
                  number: 8443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi
  namespace: unifi
spec:
  endpointSelector:
    matchLabels:
      app: unifi
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
    # UniFi devices via the MetalLB IP (inform, STUN, discovery, speed test)
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "10001"
              protocol: UDP
            - port: "6789"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # SSH adoption of LAN devices, firmware downloads, UniFi cloud
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
