apiVersion: v1
kind: Namespace
metadata:
  name: unifi
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
# UniFi OS Server, community image built from Ubiquiti's installer
# (https://github.com/lemker/unifi-os-server). Everything (Network app, MongoDB,
# Postgres, RabbitMQ, nginx) runs as systemd services in one container.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-os
  namespace: unifi
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
# On the NAS (truenas-csi); replaces unifi-os (Longhorn)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: unifi-os-nas
  namespace: unifi
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unifi
  namespace: unifi
spec:
  # RWO volume: never run two pods
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: unifi
  template:
    metadata:
      labels:
        app: unifi
    spec:
      # Stops systemd services cleanly (STOPSIGNAL SIGRTMIN+3)
      terminationGracePeriodSeconds: 120
      # Services inside reach the host's port 11084 via host.docker.internal;
      # here that's the pod itself
      hostAliases:
        - ip: 127.0.0.1
          hostnames: ["host.docker.internal"]
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: unifi
          image: ghcr.io/lemker/unifi-os-server:v1.8.0
          # Privileged: systemd as PID 1 needs a writable cgroup tree and mounts
          # (allowlisted in the Kyverno policies)
          securityContext:
            privileged: true
          env:
            - name: TZ
              value: "Europe/Stockholm"
            # Inform address handed to devices: the LoadBalancer IP below
            - name: UOS_SYSTEM_IP
              value: "${unifi_lb_ip}"
          ports:
            - name: https
              containerPort: 443
            - name: http
              containerPort: 80
            - name: inform
              containerPort: 8080
            - name: stun
              containerPort: 3478
              protocol: UDP
            - name: discovery
              containerPort: 10003
              protocol: UDP
            - name: syslog
              containerPort: 5514
              protocol: UDP
            - name: speedtest
              containerPort: 6789
          startupProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 10
            failureThreshold: 90
          livenessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/ping
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 200m
              memory: 2Gi
            limits:
              cpu: 2
              memory: 4Gi
          volumeMounts:
            - name: data
              mountPath: /persistent
              subPath: persistent
            - name: data
              mountPath: /var/log
              subPath: log
            - name: data
              mountPath: /data
              subPath: data
            - name: data
              mountPath: /srv
              subPath: srv
            - name: data
              mountPath: /var/lib/unifi
              subPath: unifi
            - name: data
              mountPath: /var/lib/mongodb
              subPath: mongodb
            - name: data
              mountPath: /etc/rabbitmq/ssl
              subPath: rabbitmq
            - name: run
              mountPath: /run
            - name: run-lock
              mountPath: /run/lock
            - name: tmp
              mountPath: /tmp
            - name: journal
              mountPath: /var/lib/journal
            - name: unifi-tmp
              mountPath: /var/opt/unifi/tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: unifi-os
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: run-lock
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: journal
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: unifi-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
# Web UI, through Traefik. UniFi OS only serves HTTPS with its own self-signed cert.
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata:
  name: unifi
  namespace: unifi
spec:
  insecureSkipVerify: true
---
apiVersion: v1
kind: Service
metadata:
  name: unifi
  namespace: unifi
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: unifi-unifi@kubernetescrd
spec:
  selector:
    app: unifi
  ports:
    - name: https
      port: 443
      targetPort: 443
---
# Device traffic on a fixed LAN IP; UOS_SYSTEM_IP above makes it the inform address.
apiVersion: v1
kind: Service
metadata:
  name: unifi-devices
  namespace: unifi
  annotations:
    metallb.io/loadBalancerIPs: "${unifi_lb_ip}"
spec:
  type: LoadBalancer
  selector:
    app: unifi
  ports:
    - name: inform
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: stun
      port: 3478
      targetPort: 3478
      protocol: UDP
    - name: discovery
      port: 10003
      targetPort: 10003
      protocol: UDP
    - name: syslog
      port: 5514
      targetPort: 5514
      protocol: UDP
    - name: speedtest
      port: 6789
      targetPort: 6789
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unifi
  namespace: unifi
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "UniFi"
    gethomepage.dev/description: "Network controller"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "unifi.png"
    gethomepage.dev/pod-selector: "app=unifi"
spec:
  ingressClassName: traefik
  rules:
    - host: unifi.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: unifi
                port:
                  number: 443
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: unifi
  namespace: unifi
spec:
  endpointSelector:
    matchLabels:
      app: unifi
  ingress:
    # Web UI access from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # UniFi devices via the MetalLB IP (inform, STUN, discovery, syslog, speed test)
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "3478"
              protocol: UDP
            - port: "10003"
              protocol: UDP
            - port: "5514"
              protocol: UDP
            - port: "6789"
              protocol: TCP
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
    # Intra-namespace communication
    - fromEndpoints:
        - {}
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # SSH adoption of LAN devices, firmware downloads, UniFi cloud
    - toEntities:
        - world
    # Intra-namespace communication
    - toEndpoints:
        - {}
