---
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 24h
  url: https://kubernetes-sigs.github.io/headlamp/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: headlamp
  namespace: headlamp
spec:
  interval: 12h
  chart:
    spec:
      chart: headlamp
      version: "0.40.0"
      sourceRef:
        kind: HelmRepository
        name: headlamp
        namespace: headlamp
      interval: 12h
  timeout: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    config:
      oidc:
        clientID: ${headlamp_client_id}
        clientSecret: ${headlamp_client_secret}
        issuerURL: ${headlamp_issuer_url}
        scopes: ${headlamp_scopes}
        callbackURL: "https://headlamp.${domain}/oidc-callback"

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    enable-oauth: "false"
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-wildcard-issuer
    traefik.ingress.kubernetes.io/router.middlewares: ""
spec:
  ingressClassName: traefik
  rules:
  - host: headlamp.${domain}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: headlamp
            port:
              number: 80
  tls:
  - hosts:
    - headlamp.${domain}
    secretName: headlamp-tls
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: headlamp
  namespace: headlamp
spec:
  endpointSelector: {}
  ingress:
    # Web ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "4466"
              protocol: TCP
          rules:
            http: [{}]
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API Server (Headlamp queries Kubernetes API)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Identity Provider OIDC (Authelia)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: authelia
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "9091"
              protocol: TCP
    # OIDC discovery/token exchange via the public auth hostname. It
    # resolves to the Traefik LoadBalancer IP, which Cilium translates to the
    # Traefik pod, so the policy sees the container ports, not 80/443.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # External OIDC providers
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP

