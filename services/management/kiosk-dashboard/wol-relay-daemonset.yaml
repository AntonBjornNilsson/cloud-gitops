# Sends the magic packets requested through the wol-requests ConfigMap. Magic
# packets are L2 broadcasts, so this runs with hostNetwork on every node: any
# node that is still up can wake the others. It opens no port.
# hostNetwork is not covered by Cilium endpoint policies.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wol-relay-script
  namespace: kiosk-dashboard
data:
  relay.py: |
    """Turns entries in the wol-requests ConfigMap into magic packets on this node's networks."""
    import fcntl
    import json
    import os
    import re
    import socket
    import ssl
    import struct
    import time
    import urllib.request

    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    MAX_AGE = 120
    POLL_SECONDS = 2
    MAC = re.compile(r"([0-9a-f]{2}:){5}[0-9a-f]{2}")
    SKIP = ("lo", "cilium", "lxc", "veth", "docker", "kube", "tailscale", "nodelocal")
    SIOCGIFFLAGS, SIOCGIFADDR, SIOCGIFBRDADDR = 0x8913, 0x8915, 0x8919
    IFF_UP_BROADCAST = 0x1 | 0x2


    def networks():
        found = []
        with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
            for _, name in socket.if_nameindex():
                if name.startswith(SKIP):
                    continue
                req = struct.pack("16s16x", name.encode()[:15])
                try:
                    flags = struct.unpack("h", fcntl.ioctl(s, SIOCGIFFLAGS, req)[16:18])[0]
                    if flags & IFF_UP_BROADCAST != IFF_UP_BROADCAST:
                        continue
                    addr = socket.inet_ntoa(fcntl.ioctl(s, SIOCGIFADDR, req)[20:24])
                    broadcast = socket.inet_ntoa(fcntl.ioctl(s, SIOCGIFBRDADDR, req)[20:24])
                except OSError:  # no IPv4 address
                    continue
                found.append((addr, broadcast))
        return found


    def send(mac, port):
        payload = b"\xff" * 6 + bytes.fromhex(mac.replace(":", "")) * 16
        for addr, broadcast in networks():
            with socket.socket(socket.AF_INET, socket.SOCK_DGRAM) as s:
                s.setsockopt(socket.SOL_SOCKET, socket.SO_BROADCAST, 1)
                s.bind((addr, 0))
                s.sendto(payload, (broadcast, port))
                print(f"sent {mac} to {broadcast}:{port}", flush=True)


    def process(data, seen, now):
        """Sends each new, recent, valid entry once and returns the keys to remember."""
        for key, value in data.items():
            if key in seen:
                continue
            try:
                request = json.loads(value)
                mac, port = request["mac"], int(request.get("port", 9))
                if MAC.fullmatch(mac) and 0 < port < 65536 and now - float(request["ts"]) <= MAX_AGE:
                    send(mac, port)
            except (ValueError, KeyError, TypeError, OSError) as e:
                print(f"skipping {key}: {e}", flush=True)
        return set(data)


    def fetch(context):
        host, port = os.environ["KUBERNETES_SERVICE_HOST"], os.environ["KUBERNETES_SERVICE_PORT"]
        url = f"https://{host}:{port}/api/v1/namespaces/kiosk-dashboard/configmaps/wol-requests"
        with open(f"{SA}/token") as f:
            request = urllib.request.Request(url, headers={"Authorization": "Bearer " + f.read().strip()})
        with urllib.request.urlopen(request, context=context, timeout=10) as r:
            return json.load(r).get("data") or {}


    def main():
        context = ssl.create_default_context(cafile=f"{SA}/ca.crt")
        seen = set()
        print("wol-relay started, networks:", networks(), flush=True)
        while True:
            try:
                seen = process(fetch(context), seen, time.time())
            except Exception as e:
                print(f"poll failed: {e}", flush=True)
            time.sleep(POLL_SECONDS)


    if __name__ == "__main__":
        main()
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wol-relay
  namespace: kiosk-dashboard
spec:
  selector:
    matchLabels:
      app: wol-relay
  template:
    metadata:
      labels:
        app: wol-relay
    spec:
      serviceAccountName: wol-relay
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      # On every node, control plane included
      tolerations:
        - operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: python:3.13-alpine
          command: ["python3", "-u", "/app/relay.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: wol-relay-script
