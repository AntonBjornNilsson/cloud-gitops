---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-controller
  namespace: arc-system
spec:
  endpointSelector: {}
  ingress:
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # GitHub Actions API communication
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-runners
  namespace: arc-runners
spec:
  endpointSelector: {}
  ingress:
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # CI/CD runners require broad internet access to pull dependencies, clone repos, and publish artifacts
    - toEntities:
        - world
    # Internal cluster access for testing if needed
    - toEntities:
        - cluster
