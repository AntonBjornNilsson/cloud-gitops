---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: flux-webhook
  namespace: flux-system
  labels:
    enable-oauth: "false"
  annotations:
    cert-manager.io/cluster-issuer: cloudflare-wildcard-issuer
    # GitHub push webhooks arrive through the tunnel
    traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
spec:
  ingressClassName: traefik
  rules:
    - host: flux-webhook.${domain}
      http:
        paths:
          - path: /hook
            pathType: Prefix
            backend:
              service:
                name: webhook-receiver
                port:
                  number: 80
  tls:
    - hosts:
        - flux-webhook.${domain}
      secretName: flux-webhook-tls

