apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflare-operator
  namespace: cloudflare-operator-system
spec:
  endpointSelector: {}
  ingress:
    # Health checks and metrics scraping
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "2000"
              protocol: TCP
  egress:
    # 1. Kubernetes DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # 2. Kubernetes API server communication
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 3. Cloudflare API and edge communication (HTTPS & QUIC for tunnels)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: UDP
    # 4. Proxying ingress traffic to Traefik
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
