apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cloudflare
spec:
  endpointSelector:
    matchLabels:
      app: cloudflared
  ingress:
    # Probes on the metrics/ready port
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "2000"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Cloudflare edge (QUIC/HTTP2 on 7844) and API
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: ANY
    # Origin: Traefik's "public" entrypoint (Service traefik-public).
    # 8000/8443 (LAN entrypoints) stay until the tunnel origin is switched.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
