# ==============================================================================
# Cloudflare Secret Template (Reference for cloud-gitops-secrets)
# ==============================================================================
# Place these secrets into the cloud-gitops-secrets repository or SOPS-encrypted
# Secret manifests in the cluster under the `cloudflare-operator-system` namespace.
# ==============================================================================
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: cloudflare-secrets
#   namespace: cloudflare-operator-system
# type: Opaque
# stringData:
#   # API Token with Zone:DNS:Edit, Account:Cloudflare Tunnel:Edit permissions
#   CLOUDFLARE_API_TOKEN: "your-cloudflare-api-token"
#   CLOUDFLARE_ACCOUNT_ID: "your-cloudflare-account-id"
#   # Optional: tunnel credentials JSON if using an existing tunnel created via CLI
#   credentials.json: |
#     {
#       "AccountTag": "your-account-tag",
#       "TunnelSecret": "your-tunnel-secret-base64",
#       "TunnelID": "your-tunnel-uuid"
#     }
# ---
# apiVersion: v1
# kind: Secret
# metadata:
#   name: cloudflare-access-tokens
#   namespace: cloudflare-operator-system
# type: Opaque
# stringData:
#   CLOUDFLARE_ACCESS_SERVICE_TOKEN_ID: "your-access-service-token-client-id"
#   CLOUDFLARE_ACCESS_SERVICE_TOKEN_TOKEN: "your-access-service-token-client-secret"
