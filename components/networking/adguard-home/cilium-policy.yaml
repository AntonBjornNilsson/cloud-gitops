apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: adguard-home
  namespace: adguard-home
spec:
  endpointSelector: {}
  ingress:
    # DNS queries from LAN devices (via the LoadBalancer IP), pods and nodes
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
    # Web UI/API only through Traefik (Authelia); AdGuard has no users of its own
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Exporter metrics
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "9618"
              protocol: TCP
    # Probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # In-cluster DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Upstream resolvers (plain DNS for bootstrap, DoT/DoQ, DoH) and blocklist downloads
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
            - port: "853"
              protocol: ANY
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
