apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-adguard-home
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/networking/adguard-home
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  # LoadBalancer IP pool, the NAS volume (TrueNAS CSI), and Kyverno's Ingress
  # mutations (TLS + Authelia) must exist before the unauthenticated UI does.
  dependsOn:
    - name: system-metallb-config
    - name: system-truenas-csi
    - name: system-kyverno-config
    - name: system-traefik
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
      - kind: Secret
        name: network-substitutions
