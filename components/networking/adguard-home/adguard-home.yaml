---
apiVersion: v1
kind: Namespace
metadata:
  name: adguard-home
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: adguard-home-data
  namespace: adguard-home
  labels:
    backup.longhorn.io/enabled: "true"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard-home
  namespace: adguard-home
  labels:
    app: adguard-home
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: adguard-home
  template:
    metadata:
      labels:
        app: adguard-home
    spec:
      # LAN DNS must not sit on the media node, which freezes regularly.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: NotIn
                    values:
                      - ${media_node}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        # Lets the non-root process bind port 53 and 80 (namespaced, safe sysctl)
        sysctls:
          - name: net.ipv4.ip_unprivileged_port_start
            value: "0"
      initContainers:
        # Git owns the config (see config/AdGuardHome.yaml); AdGuard rewrites
        # the file at runtime, so it is copied onto the volume on every start.
        - name: seed-config
          image: adguard/adguardhome:v0.107.79
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          command:
            - sh
            - -c
            - |
              cp /config/AdGuardHome.yaml /opt/adguardhome/conf/AdGuardHome.yaml
              # The image's binary carries cap_net_bind_service as a file capability, which a
              # non-root process with no-new-privileges cannot exec. A plain copy drops it; the
              # sysctl above already allows binding 53 and 80.
              cp /opt/adguardhome/AdGuardHome /adguard-bin/AdGuardHome
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 200m
              memory: 64Mi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: adguard-bin
              mountPath: /adguard-bin
      containers:
        - name: adguard-home
          image: adguard/adguardhome:v0.107.79
          imagePullPolicy: IfNotPresent
          command: ["/adguard-bin/AdGuardHome"]
          args:
            - "--config"
            - "/opt/adguardhome/conf/AdGuardHome.yaml"
            - "--work-dir"
            - "/opt/adguardhome/work"
            - "--no-check-update"
          ports:
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: adguard-bin
              mountPath: /adguard-bin
              readOnly: true
            - name: data
              mountPath: /opt/adguardhome/conf
              subPath: conf
            - name: data
              mountPath: /opt/adguardhome/work
              subPath: work
          startupProbe:
            tcpSocket:
              port: 53
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 53
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /control/status
              port: 80
            periodSeconds: 10
        # AdGuard has no users (Authelia guards the UI), so any credentials work.
        - name: exporter
          image: ghcr.io/henrywhitaker3/adguard-exporter:v1.2.1
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: ADGUARD_SERVERS
              value: http://127.0.0.1:80
            - name: ADGUARD_USERNAMES
              value: unused
            - name: ADGUARD_PASSWORDS
              value: unused
            - name: INTERVAL
              value: 30s
          ports:
            - name: metrics
              containerPort: 9618
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: 9618
            periodSeconds: 30
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: adguard-home-config
        - name: adguard-bin
          emptyDir: {}
        - name: data
          persistentVolumeClaim:
            claimName: adguard-home-data
---
# LAN DNS on a fixed IP: hand ${adguard_lb_ip} out as DNS server via DHCP.
# Local traffic policy keeps the client IPs (query log, per-client rate limit).
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-dns
  namespace: adguard-home
  annotations:
    metallb.io/loadBalancerIPs: "${adguard_lb_ip}"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: adguard-home
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: adguard-home-web
  namespace: adguard-home
spec:
  type: ClusterIP
  selector:
    app: adguard-home
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: adguard-home
  namespace: adguard-home
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: "AdGuard Home"
    gethomepage.dev/description: "LAN DNS and ad blocking"
    gethomepage.dev/group: "Infrastructure"
    gethomepage.dev/icon: "adguard-home.png"
    gethomepage.dev/pod-selector: "app=adguard-home"
    # The native widget needs AdGuard credentials; read the exporter's metrics instead
    gethomepage.dev/widget.type: "prometheusmetric"
    gethomepage.dev/widget.url: "http://vmsingle-vm-k8s-stack.victoriametrics.svc.cluster.local:8428"
    gethomepage.dev/widget.metrics.0.label: "Queries (24h)"
    gethomepage.dev/widget.metrics.0.query: "sum(adguard_queries)"
    gethomepage.dev/widget.metrics.0.format.type: "number"
    gethomepage.dev/widget.metrics.1.label: "Blocked"
    gethomepage.dev/widget.metrics.1.query: "100 * sum(adguard_queries_blocked) / clamp_min(sum(adguard_queries), 1)"
    gethomepage.dev/widget.metrics.1.format.type: "percent"
spec:
  rules:
    - host: adguard.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: adguard-home-web
                port:
                  number: 80
