---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: external-pool
  namespace: metallb
spec:
  addresses:
    - "${metallb_external_pool}"
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: internal-pool
  namespace: metallb
spec:
  addresses:
    - "${metallb_internal_pool}"
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: l2-service-pool
  namespace: metallb
spec:
  addresses:
    - "${metallb_l2_pool}"
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: ltwo
  namespace: metallb
