apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-metallb-config
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/networking/metallb/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-metallb
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions