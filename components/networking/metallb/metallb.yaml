---
apiVersion: v1
kind: Namespace
metadata:
  name: metallb
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: metallb-repo
  namespace: metallb
spec:
  interval: 10m0s
  url: https://metallb.github.io/metallb
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb
spec:
  chart:
    spec:
      chart: metallb
      version: "0.16.1"
      sourceRef:
        kind: HelmRepository
        name: metallb-repo
  interval: 10m0s
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  timeout: 5m
  values:
    controller:
      # Pod securityContext, merged into the chart default (65534, fsGroup). The speaker
      # and frr-k8s need host networking and capabilities (allowlisted).
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      resources:
        requests:
          cpu: 5m
          memory: 64Mi
        limits:
          cpu: 500m
          memory: 384Mi
    speaker:
      resources:
        requests:
          cpu: 10m
          memory: 48Mi
        limits:
          cpu: 500m
          memory: 192Mi
    frr-k8s:
      frrk8s:
        resources:
          requests:
            cpu: 5m
            memory: 32Mi
          limits:
            cpu: 200m
            memory: 128Mi
        frr:
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 128Mi
        frrMetrics:
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
        frrStatus:
          resources:
            requests:
              cpu: 5m
              memory: 24Mi
            limits:
              cpu: 200m
              memory: 128Mi
        reloader:
          resources:
            requests:
              cpu: 1m
              memory: 8Mi
            limits:
              cpu: 100m
              memory: 32Mi
  # frr-k8s' init containers and status cleaner have no resources in the chart values
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: metallb-frr-k8s
            patch: |
              - op: add
                path: /spec/template/spec/initContainers/0/resources
                value: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
              - op: add
                path: /spec/template/spec/initContainers/1/resources
                value: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
              - op: add
                path: /spec/template/spec/initContainers/2/resources
                value: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
              - op: add
                path: /spec/template/spec/initContainers/3/resources
                value: {requests: {cpu: 5m, memory: 16Mi}, limits: {cpu: 100m, memory: 64Mi}}
          - target:
              kind: Deployment
              name: metallb-frr-k8s-statuscleaner
            patch: |
              - op: add
                path: /spec/template/spec/containers/0/resources
                value: {requests: {cpu: 5m, memory: 32Mi}, limits: {cpu: 100m, memory: 128Mi}}
---