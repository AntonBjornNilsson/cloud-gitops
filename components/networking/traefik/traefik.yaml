---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://helm.traefik.io/traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 12h
  chart:
    spec:
      chart: traefik
      version: "29.0.1"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  timeout: 5m
  values:
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: false
    logs:
      general:
        format: json
        level: INFO
      # One JSON line per request (status, duration, router, client) shipped
      # to VictoriaLogs by the VLAgent collector.
      access:
        enabled: true
        format: json
    metrics:
      prometheus:
        entryPoint: metrics
        addServicesLabels: true
        addEntryPointsLabels: true
        addRoutersLabels: true
        # Finer latency histogram than the default 0.1/0.3/1.2/5
        buckets: "0.005,0.01,0.025,0.05,0.1,0.25,0.5,1,2.5,5,10"
        service:
          enabled: true
          spec:
            loadBalancerIP: 192.168.21.25
          annotations:
            metallb.io/address-pool: external-pool
        serviceMonitor:
          enabled: true
    ports:
      web:
        redirectTo:
          port: websecure
    tracing:
      addInternals: true
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://vtsingle-traces.victoriametrics.svc.cluster.local:10428/insert/opentelemetry/v1/traces
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  # HTTPS only: on "web" this route would win over the entrypoint redirect
  entryPoints:
    - websecure
  routes:
    - match: (Host(`traefik.${domain}`) || Host(`traefik.${auth_domain}`)) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      middlewares:
        - name: authelia-forward-auth
          namespace: traefik
      services:
        - name: api@internal
          kind: TraefikService