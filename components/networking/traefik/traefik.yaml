---
apiVersion: v1
kind: Namespace
metadata:
  name: traefik
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 24h
  url: https://helm.traefik.io/traefik
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: traefik
  namespace: traefik
spec:
  interval: 12h
  chart:
    spec:
      chart: traefik
      version: "29.x"
      sourceRef:
        kind: HelmRepository
        name: traefik
        namespace: traefik
      interval: 12h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 1m
  timeout: 5m
  values:
    api:
      dashboard: true
    ingressRoute:
      dashboard:
        enabled: false
    logs:
      general:
        format: json
        level: TRACE
    metrics:
      prometheus:
        entryPoint: metrics
        addServicesLabels: true
        addEntryPointsLabels: true
        service:
          enabled: true
          spec:
            loadBalancerIP: 192.168.21.25
          annotations:
            metallb.io/address-pool: external-pool
        serviceMonitor:
          enabled: true
    ports:
      web:
        redirectTo:
          port: websecure
    tracing:
      addInternals: true
      otlp:
        enabled: true
        http:
          enabled: true
          endpoint: http://jaeger-collector.jaeger.svc.cluster.local:4318/v1/traces
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-dashboard
  namespace: traefik
spec:
  entryPoints:
    - web
    - websecure
  routes:
    - match: (Host(`traefik.${domain}`) || Host(`traefik.${auth_domain}`)) && (PathPrefix(`/dashboard`) || PathPrefix(`/api`))
      kind: Rule
      services:
        - name: api@internal
          kind: TraefikService