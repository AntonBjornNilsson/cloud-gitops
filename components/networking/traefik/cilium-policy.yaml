apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: traefik
  namespace: traefik
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  ingress:
    # HTTP and HTTPS traffic from external clients and cluster nodes
    - fromEntities:
        - world
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # Health checks, metrics, and internal dashboard
    - fromEntities:
        - cluster
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Forward incoming requests to all service backends in the cluster
    - toEntities:
        - cluster
