apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: baseline-cluster-policy
spec:
  description: "Baseline cluster-wide network policy: permits health probes and kube-dns egress cluster-wide without enabling default-deny"
  enableDefaultDeny:
    ingress: false
    egress: false
  endpointSelector: {}
  ingress:
    # Kubelet health/liveness/readiness probes and Cilium node health checks
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # Cluster DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
