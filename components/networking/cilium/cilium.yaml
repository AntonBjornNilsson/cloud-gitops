---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 24h
  url: https://helm.cilium.io/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
  namespace: kube-system
spec:
  interval: 12h
  chart:
    spec:
      chart: cilium
      version: "*"
      sourceRef:
        kind: HelmRepository
        name: cilium
        namespace: kube-system
      interval: 12h
  timeout: 5m
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 3
  values:
    # Standalone Cilium with kube-proxy replacement
    kubeProxyReplacement: true
    k8sServiceHost: "192.168.21.105"
    k8sServicePort: 6443

    # Routing configuration
    routingMode: tunnel
    tunnelProtocol: vxlan

    # Cgroup v2 configuration
    cgroup:
      autoMount:
        enabled: false
      hostRoot: /sys/fs/cgroup

    # Operator configuration
    operator:
      replicas: 1
      tolerations:
        - operator: Exists
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true

    # Prometheus Metrics & ServiceMonitors
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true

    # IPAM configuration matching cluster pod CIDRs
    ipam:
      mode: kubernetes

    # Automatically restart pods when config updates
    rollOutCiliumPods: true

    # Layer 7 Proxy
    l7Proxy: true

    # Hubble observability & UI
    hubble:
      enabled: true
      relay:
        enabled: true
      # Redact sensitive headers & credentials in L7 flows
      redact:
        enabled: true
        http:
          urlQuery: false
          userInfo: true
          headers:
            deny:
              - "Authorization"
              - "Proxy-Authorization"
              - "Cookie"
              - "Set-Cookie"
      # L7 & flow metrics exported to Prometheus / VictoriaMetrics
      metrics:
        # labelsContext adds namespace/workload labels so drops, DNS and
        # flows can be attributed (used by alerts and the Hubble dashboards)
        enabled:
          - dns:query;ignoreAAAA;labelsContext=source_namespace,source_workload
          - drop:labelsContext=source_namespace,source_workload,destination_namespace,destination_workload,traffic_direction
          - tcp
          - flow:labelsContext=source_namespace,destination_namespace
          - port-distribution
          - icmp
          - policy:sourceContext=app|workload-name|pod|reserved-identity;destinationContext=app|workload-name|pod|dns|reserved-identity;labelsContext=source_namespace,destination_namespace
          - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction
        enableOpenMetrics: true
        serviceMonitor:
          enabled: true
      ui:
        enabled: true
        rollOutPods: true
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: cloudflare-wildcard-issuer
          className: "traefik"
          hosts:
            - hubble.${domain}
          tls:
            - secretName: hubble-ui-tls
              hosts:
                - hubble.${domain}
