# Subnet router: makes the home LAN reachable from every device on the tailnet.
# Hostnames under ${domain} resolve to the Traefik LoadBalancer IP through the
# LAN DNS server; point a Tailscale split-DNS entry for the domain at it.
apiVersion: tailscale.com/v1alpha1
kind: Connector
metadata:
  name: home-lan
spec:
  hostname: home-lan
  proxyClass: resources
  subnetRouter:
    # Flow list from the secrets repo, e.g. ["<cidr-1>", "<cidr-2>"]
    advertiseRoutes: ${tailscale_advertise_routes}
---
# The operator only sets a token request on the proxy containers
apiVersion: tailscale.com/v1alpha1
kind: ProxyClass
metadata:
  name: resources
spec:
  statefulSet:
    pod:
      # Seccomp for tailscaled; privileged containers (the init below) ignore it
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # Unprivileged tailscaled: NET_ADMIN for routes and the firewall (plus the
      # runtime's default capabilities iptables uses); /dev/net/tun is mounted by
      # the Kyverno policy tailscale-proxy-tun. The operator's sysctler init container
      # stays privileged: it only sets ip_forward, which needs a writable /proc/sys.
      tailscaleContainer:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            add:
              - NET_ADMIN
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            cpu: 1
            memory: 256Mi
      tailscaleInitContainer:
        resources:
          requests:
            cpu: 1m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
