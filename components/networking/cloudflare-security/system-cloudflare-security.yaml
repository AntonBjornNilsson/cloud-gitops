apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-cloudflare-security
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./components/networking/cloudflare-security
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: secrets-kustomization
  retryInterval: 1m0s
  timeout: 3m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
      - kind: Secret
        name: cloudflare-substitutions
