apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cfgate-controller
  namespace: cfgate-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cfgate
  ingress:
    # Health probes (8081) and metrics (8080)
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Cloudflare API
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cloudflared
  namespace: cfgate-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/managed-by: cfgate
  ingress:
    # Probes on the shared metrics/health listener
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "44483"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Cloudflare edge (QUIC/HTTP2 on 7844) and API
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "7844"
              protocol: ANY
    # Origin: Traefik's "public" entrypoint only (Service traefik-public)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8444"
              protocol: TCP
