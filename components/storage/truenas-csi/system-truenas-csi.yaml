apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-truenas-csi
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./components/storage/truenas-csi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  # VolumeSnapshotClass CRD
  dependsOn:
    - name: system-snapshot-controller
  retryInterval: 1m0s
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
      - kind: Secret
        name: storage-substitutions
