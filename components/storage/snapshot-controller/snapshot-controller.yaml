apiVersion: v1
kind: Namespace
metadata:
  name: snapshot-controller
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: piraeus
  namespace: snapshot-controller
spec:
  interval: 24h
  url: https://piraeus.io/helm-charts/
---
# CSI VolumeSnapshot CRDs + the cluster-wide snapshot controller. The CSI drivers'
# csi-snapshotter sidecars (TrueNAS CSI) do the actual snapshots.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: snapshot-controller
  namespace: snapshot-controller
spec:
  interval: 12h
  chart:
    spec:
      chart: snapshot-controller
      version: "5.x"
      sourceRef:
        kind: HelmRepository
        name: piraeus
        namespace: snapshot-controller
      interval: 12h
  timeout: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    # A helm uninstall would otherwise delete the CRDs and with them every VolumeSnapshot
    keepCRDs: true
    controller:
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {cpu: 200m, memory: 128Mi}
