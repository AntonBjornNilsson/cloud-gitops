apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-snapshot-controller
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./components/storage/snapshot-controller
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
