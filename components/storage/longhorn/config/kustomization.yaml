apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ingress.yaml
  - backup-jobs.yaml
  - backup-credentials.yaml
  - backup-sync.yaml
  - restore/

configMapGenerator:
  - name: longhorn-backup-sync-script
    namespace: longhorn-system
    files:
      - sync.py=sync-longhorn-backups.py