---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-backup-sync
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-backup-sync
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["backups", "backupvolumes", "volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-backup-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-backup-sync
subjects:
  - kind: ServiceAccount
    name: longhorn-backup-sync
    namespace: longhorn-system
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: longhorn-backup-sync-script
  namespace: longhorn-system
data:
  sync.py: |
    import os
    import sys
    import json
    import base64
    import urllib.request
    import urllib.error
    import ssl
    import re
    from datetime import datetime, timezone

    TARGET_FILE_PATH = "components/storage/longhorn/config/restore/volumes.yaml"
    GITHUB_REPO = os.environ.get("GITHUB_REPO", "AntonBjornNilsson/cloud-gitops")
    GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
    GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN", "")

    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_API_URL = "https://kubernetes.default.svc"

    def get_k8s_resources(endpoint):
        with open(K8S_TOKEN_PATH, "r") as f:
            token = f.read().strip()

        ctx = ssl.create_default_context(cafile=K8S_CA_PATH)
        req = urllib.request.Request(
            f"{K8S_API_URL}{endpoint}",
            headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/json"
            }
        )
        with urllib.request.urlopen(req, context=ctx, timeout=30) as resp:
            return json.loads(resp.read().decode("utf-8")).get("items", [])

    def generate_restore_yaml(pvcs, pvs, backups):
        pv_map = {pv["metadata"]["name"]: pv for pv in pvs}

        vol_to_latest_backup = {}
        for bk in backups:
            st = bk.get("status", {})
            if st.get("state") != "Completed":
                continue
            vol_name = st.get("volumeName")
            created = st.get("backupCreatedAt", "")
            if not vol_name:
                continue
            if vol_name not in vol_to_latest_backup or created > vol_to_latest_backup[vol_name]["created"]:
                vol_to_latest_backup[vol_name] = {
                    "name": bk["metadata"]["name"],
                    "url": st.get("url"),
                    "size": str(st.get("volumeSize") or st.get("size")),
                    "created": created,
                    "accessMode": st.get("labels", {}).get("longhorn.io/volume-access-mode", "rwo")
                }

        manifests = []
        summary_lines = []

        for pvc in sorted(pvcs, key=lambda x: (x["metadata"]["namespace"], x["metadata"]["name"])):
            ns = pvc["metadata"]["namespace"]
            name = pvc["metadata"]["name"]
            vol = pvc["spec"].get("volumeName")

            if not vol:
                continue

            labels = pvc.get("metadata", {}).get("labels") or {}
            annotations = pvc.get("metadata", {}).get("annotations") or {}
            backup_enabled = (
                labels.get("recurring-job-group.longhorn.io/default") == "enabled"
                or labels.get("backup.longhorn.io/enabled") == "true"
                or labels.get("backup") == "true"
                or annotations.get("recurring-job-group.longhorn.io/default") == "enabled"
                or annotations.get("backup.longhorn.io/enabled") == "true"
                or annotations.get("backup") == "true"
            )
            if not backup_enabled:
                print(f"[-] Backup not enabled for PVC {ns}/{name} - skipping")
                continue

            if vol not in vol_to_latest_backup:
                print(f"[-] No completed backup found for PVC {ns}/{name} (Volume: {vol}) - skipping")
                continue

            backup = vol_to_latest_backup[vol]
            pv = pv_map.get(vol, {})

            storage = pvc["spec"].get("resources", {}).get("requests", {}).get("storage")
            if not storage and pv:
                storage = pv.get("spec", {}).get("capacity", {}).get("storage")
            if not storage:
                storage = "5Gi"

            access_modes = pvc["spec"].get("accessModes", ["ReadWriteOnce"])
            longhorn_access_mode = "rwx" if "ReadWriteMany" in access_modes else "rwo"

            backup_url = backup["url"]
            # Construct placeholder dynamically using chr(36) so Flux envsubst does not parse or substitute it
            s3_placeholder = chr(36) + "{s3_bucket_longhorn}"
            s3_url = re.sub(r"^s3://[^/]+/", s3_placeholder, backup_url)

            summary_lines.append(f"  - {ns}/{name}: backup {backup['name']} ({backup['created']})")

            csi_attrs = pv.get("spec", {}).get("csi", {}).get("volumeAttributes") or {"numberOfReplicas": "3"}
            formatted_attrs = "\n".join(f"      {k}: \"{v}\"" for k, v in sorted(csi_attrs.items()))
            modes_str = "\n".join(f"    - {mode}" for mode in access_modes)

            block = (
                f"# PVC: {ns}/{name}\n"
                f"# Volume: {vol}\n"
                f"# Backup: {backup['name']} ({backup['created']})\n"
                f"apiVersion: longhorn.io/v1beta2\n"
                f"kind: Volume\n"
                f"metadata:\n"
                f"  name: {vol}\n"
                f"  namespace: longhorn-system\n"
                f"  annotations:\n"
                f"    kustomize.toolkit.fluxcd.io/prune: disabled\n"
                f"  labels:\n"
                f"    longhornvolume: {vol}\n"
                f"    recurring-job-group.longhorn.io/default: enabled\n"
                f"spec:\n"
                f"  accessMode: {longhorn_access_mode}\n"
                f"  fromBackup: \"{s3_url}\"\n"
                f"  frontend: blockdev\n"
                f"  numberOfReplicas: 3\n"
                f"  size: \"{backup['size']}\"\n"
                f"---\n"
                f"apiVersion: v1\n"
                f"kind: PersistentVolume\n"
                f"metadata:\n"
                f"  name: {vol}\n"
                f"  annotations:\n"
                f"    kustomize.toolkit.fluxcd.io/prune: disabled\n"
                f"    pv.kubernetes.io/bound-by-controller: \"yes\"\n"
                f"spec:\n"
                f"  capacity:\n"
                f"    storage: {storage}\n"
                f"  accessModes:\n"
                f"{modes_str}\n"
                f"  persistentVolumeReclaimPolicy: Retain\n"
                f"  storageClassName: longhorn\n"
                f"  volumeMode: Filesystem\n"
                f"  csi:\n"
                f"    driver: driver.longhorn.io\n"
                f"    fsType: ext4\n"
                f"    volumeHandle: {vol}\n"
                f"    volumeAttributes:\n"
                f"{formatted_attrs}\n"
                f"  claimRef:\n"
                f"    apiVersion: v1\n"
                f"    kind: PersistentVolumeClaim\n"
                f"    namespace: {ns}\n"
                f"    name: {name}"
            )
            manifests.append(block)

        if not manifests:
            return "", summary_lines

        timestamp = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
        header = (
            "# ==============================================================================\n"
            "# AUTOMATICALLY GENERATED BY longhorn-backup-sync\n"
            f"# Generated At: {timestamp}\n"
            "#\n"
            "# These declarative Volume and PersistentVolume resources are pre-provisioned\n"
            "# during cluster bootstrap or disaster recovery to restore Longhorn volumes\n"
            "# from the latest S3 backups and bind them directly to the workload PVCs.\n"
            "# ==============================================================================\n"
        )
        return header + "---\n" + "\n---\n".join(manifests) + "\n", summary_lines

    def get_github_file(repo, branch, token, path):
        url = f"https://api.github.com/repos/{repo}/contents/{path}?ref={branch}"
        req = urllib.request.Request(
            url,
            headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "User-Agent": "Longhorn-Backup-Sync"
            }
        )
        try:
            with urllib.request.urlopen(req, timeout=15) as resp:
                data = json.loads(resp.read().decode("utf-8"))
                content = base64.b64decode(data.get("content", "")).decode("utf-8")
                return data.get("sha"), content
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return None, None
            raise

    def push_github_file(repo, branch, token, path, content, message, sha=None):
        url = f"https://api.github.com/repos/{repo}/contents/{path}"
        payload = {
            "message": message,
            "content": base64.b64encode(content.encode("utf-8")).decode("utf-8"),
            "branch": branch
        }
        if sha:
            payload["sha"] = sha

        req = urllib.request.Request(
            url,
            data=json.dumps(payload).encode("utf-8"),
            headers={
                "Authorization": f"Bearer {token}",
                "Accept": "application/vnd.github+json",
                "Content-Type": "application/json",
                "User-Agent": "Longhorn-Backup-Sync"
            },
            method="PUT"
        )
        with urllib.request.urlopen(req, timeout=20) as resp:
            data = json.loads(resp.read().decode("utf-8"))
            return data.get("commit", {}).get("sha")

    def strip_volatile_headers(yaml_str):
        lines = [l for l in yaml_str.splitlines() if not l.strip().startswith("# Generated At:")]
        return "\n".join(lines).strip()

    def main():
        if not GITHUB_TOKEN:
            print("[-] GITHUB_TOKEN environment variable is missing.")
            sys.exit(1)

        print("[*] Querying Kubernetes API for PVCs, PVs, and Longhorn Backups...")
        pvcs = get_k8s_resources("/api/v1/persistentvolumeclaims")
        pvs = get_k8s_resources("/api/v1/persistentvolumes")
        backups = get_k8s_resources("/apis/longhorn.io/v1beta2/namespaces/longhorn-system/backups")

        generated_content, summary = generate_restore_yaml(pvcs, pvs, backups)
        if not generated_content:
            print("[!] No volumes with completed backups found.")
            return

        print(f"[+] Found {len(summary)} PVC(s) with completed backups:")
        for s in summary:
            print(s)

        print(f"[*] Checking existing GitOps manifest at {TARGET_FILE_PATH} in {GITHUB_REPO} ({GITHUB_BRANCH})...")
        sha, remote_content = get_github_file(GITHUB_REPO, GITHUB_BRANCH, GITHUB_TOKEN, TARGET_FILE_PATH)

        if remote_content and strip_volatile_headers(remote_content) == strip_volatile_headers(generated_content):
            print("[✓] GitOps backup manifests are already up to date. No commit needed.")
            return

        commit_msg = f"chore(longhorn): update latest PVC backup tags ({datetime.now(timezone.utc).strftime('%Y-%m-%d %H:%M:%S')} UTC) [skip ci]"
        print(f"[*] Pushing updated backup tags to {GITHUB_REPO}...")
        commit_sha = push_github_file(GITHUB_REPO, GITHUB_BRANCH, GITHUB_TOKEN, TARGET_FILE_PATH, generated_content, commit_msg, sha)
        print(f"[✓] Successfully committed to GitOps! Commit: {commit_sha}")

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-backup-sync
  namespace: longhorn-system
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-backup-sync
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.11-alpine
              command:
                - python3
                - /app/sync.py
              env:
                - name: GITHUB_REPO
                  value: "${github_repo}"
                - name: GITHUB_BRANCH
                  value: "main"
                - name: GITHUB_TOKEN
                  value: "${github_pat_token}"
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: longhorn-backup-sync-script
