---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: longhorn-backup-sync
  namespace: longhorn-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: longhorn-backup-sync
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list"]
  - apiGroups: ["longhorn.io"]
    resources: ["backups", "backupvolumes", "volumes"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: longhorn-backup-sync
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: longhorn-backup-sync
subjects:
  - kind: ServiceAccount
    name: longhorn-backup-sync
    namespace: longhorn-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: longhorn-backup-sync
  namespace: longhorn-system
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: longhorn-backup-sync
          restartPolicy: OnFailure
          containers:
            - name: sync
              image: python:3.11-alpine
              command:
                - python3
                - /app/sync.py
              env:
                - name: GITHUB_REPO
                  value: "${github_repo}"
                - name: GITHUB_BRANCH
                  value: "main"
                - name: GITHUB_TOKEN
                  value: "${github_pat_token}"
              volumeMounts:
                - name: script
                  mountPath: /app
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
          volumes:
            - name: script
              configMap:
                name: longhorn-backup-sync-script
