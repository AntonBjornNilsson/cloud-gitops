apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 10m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      # Upgrade one minor version at a time (Longhorn only supports
      # upgrading from the previous minor).
      version: v1.11.3
  interval: 10m0s
  # Pre-upgrade checker job + manager/driver rollout
  timeout: 15m
  values:
    persistence:
      # defaultClassReplicaCount: 1
      reclaimPolicy: Delete
      migratable: true
    # csi:
    #   attacherReplicaCount: 1
    #   provisionerReplicaCount: 1
    #   resizerReplicaCount: 1
    #   snapshotterReplicaCount: 1
    defaultSettings:
      # defaultReplicaCount: 1
      # Volumes are thin-provisioned and mostly empty; at 100% the full size
      # of every volume counts against each disk, so new replicas could not be
      # scheduled on node-sized disks. storageMinimalAvailablePercentage still
      # keeps real usage from filling a disk.
      storageOverProvisioningPercentage: 200
      storageMinimalAvailablePercentage: 10
      taintToleration: "GPU=true:NoSchedule;node-role.kubernetes.io/control-plane:NoSchedule"
      # Live-upgrade volume engines after a Longhorn upgrade, one volume per
      # node at a time. With 0 the volumes keep running the old engine and
      # instance-manager images (and their CVEs) until upgraded by hand.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1

    defaultBackupStore:
      backupTarget: ${s3_bucket_longhorn}
      backupTargetCredentialSecret: longhorn-backup-target-secret
      pollInterval: 500

    longhornManager:
      tolerations:
      - key: "GPU"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
    longhornDriver:
      tolerations:
      - key: "GPU"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
    # longhornUI:
    #   replicas: 1
---
