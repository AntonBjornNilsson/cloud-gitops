apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: longhorn-repo
  namespace: longhorn-system
spec:
  interval: 10m0s
  url: https://charts.longhorn.io
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
  namespace: longhorn-system
spec:
  chart:
    spec:
      chart: longhorn
      reconcileStrategy: ChartVersion
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
      # Upgrade one minor version at a time (Longhorn only supports
      # upgrading from the previous minor).
      version: v1.11.3
  interval: 10m0s
  # Pre-upgrade checker job + manager/driver rollout
  timeout: 15m
  values:
    persistence:
      # defaultClassReplicaCount: 1
      # Keep the volume when its PVC is deleted (also enforced on every Longhorn PV by
      # Kyverno add-pvc-annotations/retain-longhorn-pv)
      reclaimPolicy: Retain
      migratable: true
    # csi:
    #   attacherReplicaCount: 1
    #   provisionerReplicaCount: 1
    #   resizerReplicaCount: 1
    #   snapshotterReplicaCount: 1
    defaultSettings:
      # defaultReplicaCount: 1
      # Volumes are thin-provisioned and mostly empty; at 100% the full size
      # of every volume counts against each disk, so new replicas could not be
      # scheduled on node-sized disks. storageMinimalAvailablePercentage still
      # keeps real usage from filling a disk.
      storageOverProvisioningPercentage: 200
      storageMinimalAvailablePercentage: 10
      taintToleration: "GPU=true:NoSchedule;node-role.kubernetes.io/control-plane:NoSchedule"
      # Live-upgrade volume engines after a Longhorn upgrade, one volume per
      # node at a time. With 0 the volumes keep running the old engine and
      # instance-manager images (and their CVEs) until upgraded by hand.
      concurrentAutomaticEngineUpgradePerNodeLimit: 1
      # Delete replica data and instances that no volume references any more
      # (after the default 5 min grace period) instead of letting them fill disks.
      orphanResourceAutoDeletion: "replica-data;instance"

    defaultBackupStore:
      backupTarget: ${s3_bucket_longhorn}
      backupTargetCredentialSecret: longhorn-backup-target-secret
      pollInterval: 500

    longhornManager:
      tolerations:
      - key: "GPU"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
    longhornDriver:
      tolerations:
      - key: "GPU"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        effect: "NoSchedule"
    # longhornUI:
    #   replicas: 1
  # The chart has no resources values. Longhorn creates the CSI sidecars, engine-image,
  # instance-manager and share-manager pods itself; those can't be given limits
  # (instance-manager CPU is reserved via the guaranteedInstanceManagerCPU setting).
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: DaemonSet
              name: longhorn-manager
            patch: |
              apiVersion: apps/v1
              kind: DaemonSet
              metadata:
                name: longhorn-manager
              spec:
                template:
                  spec:
                    containers:
                    - name: longhorn-manager
                      resources:
                        requests: {cpu: 50m, memory: 384Mi}
                        limits: {cpu: 2, memory: 1Gi}
                    - name: pre-pull-share-manager-image
                      resources:
                        requests: {cpu: 1m, memory: 8Mi}
                        limits: {cpu: 100m, memory: 32Mi}
          - target:
              kind: Deployment
              name: longhorn-driver-deployer
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-driver-deployer
              spec:
                template:
                  spec:
                    initContainers:
                    - name: wait-longhorn-manager
                      resources:
                        requests: {cpu: 1m, memory: 8Mi}
                        limits: {cpu: 100m, memory: 32Mi}
                    containers:
                    - name: longhorn-driver-deployer
                      resources:
                        requests: {cpu: 5m, memory: 16Mi}
                        limits: {cpu: 100m, memory: 64Mi}
          - target:
              kind: Deployment
              name: longhorn-ui
            patch: |
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: longhorn-ui
              spec:
                template:
                  spec:
                    containers:
                    - name: longhorn-ui
                      resources:
                        requests: {cpu: 5m, memory: 16Mi}
                        limits: {cpu: 100m, memory: 64Mi}
---
