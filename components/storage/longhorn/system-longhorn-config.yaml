apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-longhorn-config
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/storage/longhorn/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-longhorn
    - name: system-traefik
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions