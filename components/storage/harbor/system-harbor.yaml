apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-harbor
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/storage/harbor
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-traefik
    - name: system-longhorn-config
    - name: system-cert-manager-config
  retryInterval: 1m0s
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
      - kind: Secret
        name: storage-substitutions
