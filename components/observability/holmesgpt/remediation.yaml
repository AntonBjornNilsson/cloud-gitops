apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-remediation-script
  namespace: holmesgpt
data:
  controller.py: |
    import os
    import sys
    import json
    import time
    import uuid
    import secrets
    import re
    import base64
    import ssl
    import threading
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import urllib.request
    import urllib.error

    NTFY_TOPIC    = os.environ.get("NTFY_TOPIC", "homelab-alerts")
    NTFY_SERVER   = os.environ.get("NTFY_SERVER", "http://ntfy.ntfy.svc.cluster.local").rstrip("/")
    NTFY_TOKEN    = os.environ.get("NTFY_TOKEN", "")
    NTFY_WEB_URL  = os.environ.get("NTFY_WEB_URL", "").rstrip("/")
    BASE_URL      = os.environ.get("BASE_URL", "").rstrip("/")
    # GitHub App installation token, kept fresh by the github-app-token-refresh CronJob
    GITHUB_TOKEN_FILE = os.environ.get("GITHUB_TOKEN_FILE", "/var/run/github/token")
    GITHUB_REPO   = os.environ.get("GITHUB_REPO", "")
    GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_API        = "https://kubernetes.default.svc"

    # In-memory store: token -> remediation item
    remediations   = {}
    processed_checks = set()

    # ─── ntfy ────────────────────────────────────────────────────────────────

    def _post_ntfy(payload):
        try:
            req = urllib.request.Request(
                f"{NTFY_SERVER}/{NTFY_TOPIC}",
                data=json.dumps(payload).encode("utf-8"),
                headers={"Content-Type": "application/json", "Authorization": f"Bearer {NTFY_TOKEN}"},
                method="POST"
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                print(f"[ntfy] Sent '{payload.get('title','?')}', status {resp.status}")
        except Exception as e:
            print(f"[ntfy] Failed: {e}", file=sys.stderr)

    def send_ntfy_pr_notification(title, message, token, pr_number, pr_url):
        """Notification with Merge PR / Reject PR action buttons."""
        _post_ntfy({
            "topic":   NTFY_TOPIC,
            "title":   f"🔧 HolmesGPT Fix Ready: {title[:80]}",
            "message": f"{message[:3000]}\n\n🔗 PR #{pr_number}: {pr_url}",
            "tags":    ["warning", "robot"],
            "actions": [
                {"action": "http",  "label": "✅ Merge PR",  "url": f"{BASE_URL}/merge/{token}",  "method": "POST"},
                {"action": "http",  "label": "❌ Reject PR", "url": f"{BASE_URL}/reject/{token}", "method": "POST"},
                {"action": "view",  "label": "👁 View PR",   "url": pr_url}
            ]
        })

    def send_ntfy_failure(title, message):
        """Plain high-priority alert — no actionable fix was found."""
        _post_ntfy({
            "topic":    NTFY_TOPIC,
            "title":    f"🚨 HolmesGPT Alert: {title[:80]}",
            "message":  message[:4000],
            "tags":     ["rotating_light", "robot"],
            "priority": "high"
        })

    def send_ntfy_followup(title, message, tags=None):
        _post_ntfy({
            "topic":   NTFY_TOPIC,
            "title":   title,
            "message": message[:2000],
            "tags":    tags or ["white_check_mark"]
        })

    # ─── Fix extraction ───────────────────────────────────────────────────────

    def extract_remediation_fixes(text):
        """
        Parses code blocks in the format:
          ```yaml:path/to/file.yaml ... ```
        or explicit JSON blocks.
        """
        fixes = []
        if not text:
            return fixes

        # 1. JSON block
        json_match = re.search(r'```json\s*(\{.*?\})\s*```', text, re.DOTALL)
        if json_match:
            try:
                data = json.loads(json_match.group(1))
                if "files" in data and isinstance(data["files"], list):
                    for f in data["files"]:
                        if "path" in f and "content" in f:
                            fixes.append({"path": f["path"].strip("/"), "content": f["content"]})
                elif "path" in data and "content" in data:
                    fixes.append({"path": data["path"].strip("/"), "content": data["content"]})
            except Exception:
                pass
        if fixes:
            return fixes

        # 2. Filename-annotated code fence: ```yaml:services/foo/bar.yaml
        for m in re.finditer(r'```(?:yaml|yml)?:([a-zA-Z0-9_\-\.\/]+)\n(.*?)```', text, re.DOTALL):
            fixes.append({"path": m.group(1).strip().strip("/"), "content": m.group(2)})

        # 3. File:/Path: prefix then ```yaml block
        for m in re.finditer(
            r'(?:File|Path):\s*`?([a-zA-Z0-9_\-\.\/]+)`?\s*\n```(?:yaml|yml)?\n(.*?)```',
            text, re.DOTALL | re.IGNORECASE
        ):
            fixes.append({"path": m.group(1).strip().strip("/"), "content": m.group(2)})

        return fixes

    # ─── GitHub API helpers ───────────────────────────────────────────────────

    def _github_token():
        with open(GITHUB_TOKEN_FILE) as f:
            return f.read().strip()

    def _github(method, path, payload=None):
        url  = f"https://api.github.com/repos/{GITHUB_REPO}{path}"
        data = json.dumps(payload).encode("utf-8") if payload else None
        req  = urllib.request.Request(
            url, data=data,
            headers={
                "Authorization": f"Bearer {_github_token()}",
                "Accept":        "application/vnd.github+json",
                "Content-Type":  "application/json",
                "User-Agent":    "HolmesGPT-Remediation"
            },
            method=method
        )
        with urllib.request.urlopen(req, timeout=15) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def get_github_file(path, ref=None):
        qs = f"?ref={ref or GITHUB_BRANCH}"
        try:
            d = _github("GET", f"/contents/{path}{qs}")
            return d.get("sha"), base64.b64decode(d.get("content", "")).decode("utf-8")
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return None, None
            raise

    def get_branch_sha(branch):
        return _github("GET", f"/git/ref/heads/{branch}")["object"]["sha"]

    def create_branch(name, sha):
        _github("POST", "/git/refs", {"ref": f"refs/heads/{name}", "sha": sha})

    def push_file(path, content, branch, message, sha=None):
        payload = {
            "message": message,
            "content": base64.b64encode(content.encode("utf-8")).decode("utf-8"),
            "branch":  branch
        }
        if sha:
            payload["sha"] = sha
        _github("PUT", f"/contents/{path}", payload)

    def create_pr(branch, title, body):
        d = _github("POST", "/pulls", {
            "title": title, "body": body,
            "head": branch, "base": GITHUB_BRANCH
        })
        return d["number"], d["html_url"]

    def merge_pr(number):
        _github("PUT", f"/pulls/{number}/merge", {
            "merge_method":  "squash",
            "commit_title":  f"fix(holmesgpt): auto-merge remediation PR #{number}"
        })

    def close_pr(number):
        _github("PATCH", f"/pulls/{number}", {"state": "closed"})

    # ─── Remediation flow ─────────────────────────────────────────────────────

    def open_remediation_pr(item):
        """Creates a branch, pushes fix files, opens a PR. Returns (pr_number, pr_url)."""
        fixes = item.get("fixes", [])
        if not fixes:
            return None, None

        branch = f"holmesgpt/fix-{item['id']}"
        create_branch(branch, get_branch_sha(GITHUB_BRANCH))

        msg = f"fix(holmesgpt): {item['title']}\n\nAuto-generated by HolmesGPT. Ref: {item['id']}"
        for fix in fixes:
            sha, _ = get_github_file(fix["path"])
            push_file(fix["path"], fix["content"], branch, msg, sha=sha)

        body = (
            f"## HolmesGPT Automated Remediation\n\n"
            f"**Check:** {item['title']}\n\n"
            f"<details><summary>Holmes findings</summary>\n\n"
            f"```\n{item['description'][:3000]}\n```\n</details>\n\n"
            f"**Files changed:** {', '.join(f['path'] for f in fixes)}\n\n"
            f"_Auto-generated. Approve via ntfy or review manually._"
        )
        return create_pr(branch, f"fix(holmesgpt): {item['title'][:72]}", body)

    def _handle_result(item):
        """Shared logic: open PR if fixes exist, else plain failure ntfy."""
        if item["fixes"]:
            try:
                pr_num, pr_url = open_remediation_pr(item)
                item["pr_number"] = pr_num
                item["pr_url"]    = pr_url
                send_ntfy_pr_notification(item["title"], item["description"], item["token"], pr_num, pr_url)
            except Exception as e:
                print(f"[pr] Failed: {e}", file=sys.stderr)
                send_ntfy_failure(item["title"], f"{item['description'][:2000]}\n\n⚠️ PR creation failed: {e}")
        else:
            send_ntfy_failure(item["title"], item["description"] or "No details available.")

    # ─── HTTP handler ─────────────────────────────────────────────────────────

    class RequestHandler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(f"[http] {self.address_string()} {fmt % args}")

        def _json(self, code, obj):
            body = json.dumps(obj).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def _text(self, code, text):
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(text.encode("utf-8"))

        def do_GET(self):
            if self.path in ("/healthz", "/readyz"):
                self._json(200, {"status": "ok"})
            elif self.path == "/remediations":
                self._json(200, remediations)
            else:
                self.send_response(404); self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body   = self.rfile.read(length) if length > 0 else b""

            # /merge/<token>
            if self.path.startswith("/merge/"):
                token = self.path[7:].split("?")[0]
                item  = remediations.get(token)
                if not item:
                    self._text(404, "Not found.\n"); return
                if not item.get("pr_number"):
                    self._text(400, "No PR for this token.\n"); return
                if item["status"] in ("merged", "rejected"):
                    self._text(200, f"Already {item['status']}.\n"); return
                try:
                    merge_pr(item["pr_number"])
                    item["status"] = "merged"
                    send_ntfy_followup("✅ PR Merged",
                        f"PR #{item['pr_number']} for '{item['title']}' merged into {GITHUB_BRANCH}.\n{item.get('pr_url','')}",
                        tags=["white_check_mark"])
                    self._text(200, f"PR #{item['pr_number']} merged.\n")
                except Exception as e:
                    detail = e.read().decode("utf-8", "replace")[:300] if isinstance(e, urllib.error.HTTPError) else str(e)
                    send_ntfy_followup("⚠️ Merge failed",
                        f"PR #{item['pr_number']} could not be merged (checks pending or failing?):\n{detail}\n{item.get('pr_url','')}",
                        tags=["warning"])
                    self._text(500, f"Merge failed: {e}\n")
                return

            # /reject/<token>
            if self.path.startswith("/reject/"):
                token = self.path[8:].split("?")[0]
                item  = remediations.get(token)
                if not item:
                    self._text(404, "Not found.\n"); return
                if not item.get("pr_number"):
                    self._text(400, "No PR for this token.\n"); return
                if item["status"] in ("merged", "rejected"):
                    self._text(200, f"Already {item['status']}.\n"); return
                try:
                    close_pr(item["pr_number"])
                    item["status"] = "rejected"
                    send_ntfy_followup("❌ PR Rejected",
                        f"PR #{item['pr_number']} for '{item['title']}' closed without merging.",
                        tags=["x"])
                    self._text(200, f"PR #{item['pr_number']} closed.\n")
                except Exception as e:
                    self._text(500, f"Reject failed: {e}\n")
                return

            # /register — PR already opened by an external agent (claude-agent CronJob)
            if self.path == "/register":
                try:
                    data = json.loads(body.decode("utf-8")) if body else {}
                except Exception:
                    self._text(400, "Invalid JSON.\n"); return
                title       = data.get("title") or "Cluster finding"
                description = data.get("summary") or ""
                pr_number   = data.get("pr_number")
                if not pr_number:
                    send_ntfy_failure(title, description or "No details available.")
                    self._json(200, {"status": "notified_no_pr"}); return
                token_id = secrets.token_urlsafe(24)
                remediations[token_id] = {
                    "id":          str(uuid.uuid4())[:8],
                    "token":       token_id,
                    "title":       title,
                    "description": description,
                    "fixes":       [],
                    "pr_number":   int(pr_number),
                    "pr_url":      data.get("pr_url"),
                    "created_at":  time.time(),
                    "status":      "pending"
                }
                send_ntfy_pr_notification(title, description, token_id, pr_number, data.get("pr_url", ""))
                self._json(200, {"status": "registered", "pr_number": pr_number}); return

            # /webhook — Holmes result receiver
            if self.path == "/webhook":
                try:
                    data = json.loads(body.decode("utf-8")) if body else {}
                except Exception:
                    data = {}

                text  = ""
                title = "Incident Detected"
                if "attachments" in data and data["attachments"]:
                    att   = data["attachments"][0]
                    title = att.get("title", title)
                    text  = att.get("text", "")
                elif "text" in data:
                    text = data["text"]
                elif "message" in data:
                    text  = data["message"]
                    title = data.get("name", title)

                token_id = secrets.token_urlsafe(24)
                fixes    = extract_remediation_fixes(text)
                item = {
                    "id":          str(uuid.uuid4())[:8],
                    "token":       token_id,
                    "title":       title,
                    "description": text,
                    "fixes":       fixes,
                    "pr_number":   None,
                    "pr_url":      None,
                    "created_at":  time.time(),
                    "status":      "pending"
                }
                remediations[token_id] = item
                _handle_result(item)

                self._json(200, {
                    "status":     "pr_created" if item.get("pr_number") else "notified_no_fixes",
                    "id":         item["id"],
                    "fixes":      len(fixes),
                    "pr_number":  item.get("pr_number"),
                    "pr_url":     item.get("pr_url")
                })
                return

            self.send_response(404); self.end_headers()

    # ─── K8s HealthCheck watcher ──────────────────────────────────────────────

    def k8s_healthcheck_watcher():
        if not os.path.exists(K8S_TOKEN_PATH):
            print("[watcher] No serviceaccount token — inactive.")
            return
        with open(K8S_TOKEN_PATH) as f:
            k8s_token = f.read().strip()
        ssl_ctx = ssl.create_default_context(cafile=K8S_CA_PATH)

        while True:
            try:
                req = urllib.request.Request(
                    f"{K8S_API}/apis/holmesgpt.dev/v1alpha1/namespaces/holmesgpt/healthchecks",
                    headers={"Authorization": f"Bearer {k8s_token}", "Accept": "application/json"}
                )
                with urllib.request.urlopen(req, context=ssl_ctx, timeout=10) as resp:
                    for hc in json.loads(resp.read().decode("utf-8")).get("items", []):
                        name   = hc.get("metadata", {}).get("name", "unknown")
                        status = hc.get("status", {})
                        if status.get("result") == "fail" and name not in processed_checks:
                            processed_checks.add(name)
                            message  = status.get("message") or status.get("rationale") or "Health check failure."
                            token_id = secrets.token_urlsafe(24)
                            item = {
                                "id":          str(uuid.uuid4())[:8],
                                "token":       token_id,
                                "title":       f"HealthCheck Failed: {name}",
                                "description": message,
                                "fixes":       extract_remediation_fixes(message),
                                "pr_number":   None,
                                "pr_url":      None,
                                "created_at":  time.time(),
                                "status":      "pending"
                            }
                            remediations[token_id] = item
                            print(f"[watcher] '{name}' failed — fixes: {len(item['fixes'])}")
                            _handle_result(item)
            except Exception as e:
                print(f"[watcher] Error: {e}", file=sys.stderr)
            time.sleep(15)

    # ─── Entrypoint ───────────────────────────────────────────────────────────

    def main():
        print(f"[startup] Holmes Remediation :8080  repo={GITHUB_REPO}  branch={GITHUB_BRANCH}")
        print(f"[startup] ntfy={NTFY_SERVER}/{NTFY_TOPIC}  base_url={BASE_URL}")
        threading.Thread(target=k8s_healthcheck_watcher, daemon=True).start()
        HTTPServer(("0.0.0.0", 8080), RequestHandler).serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Secret
metadata:
  name: holmes-ntfy-token
  namespace: holmesgpt
type: Opaque
stringData:
  token: "${ntfy_alertmanager_token}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmes-remediation
  namespace: holmesgpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holmes-remediation-role
  namespace: holmesgpt
rules:
  - apiGroups: ["holmesgpt.dev"]
    resources: ["healthchecks", "scheduledhealthchecks"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: holmes-remediation-binding
  namespace: holmesgpt
subjects:
  - kind: ServiceAccount
    name: holmes-remediation
    namespace: holmesgpt
roleRef:
  kind: Role
  name: holmes-remediation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-remediation
  namespace: holmesgpt
  labels:
    app: holmes-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-remediation
  template:
    metadata:
      labels:
        app: holmes-remediation
    spec:
      serviceAccountName: holmes-remediation
      containers:
        - name: remediation-controller
          image: python:3.11-alpine
          command: ["python3", "-u", "/app/controller.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            # ntfy is deny-all; the alertmanager token is write-only on this topic
            - name: NTFY_TOPIC
              value: "homelab-alerts"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: holmes-ntfy-token
                  key: token
            - name: NTFY_SERVER
              value: "http://ntfy.ntfy.svc.cluster.local"
            - name: NTFY_WEB_URL
              value: "https://ntfy.${domain}"
            - name: BASE_URL
              value: "https://holmes-remediation.${domain}"
            - name: GITHUB_REPO
              value: "${github_repo}"
            - name: GITHUB_BRANCH
              value: "main"
            - name: GITHUB_TOKEN_FILE
              value: /var/run/github/token
          volumeMounts:
            - name: script
              mountPath: /app
            - name: github-token
              mountPath: /var/run/github
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
      volumes:
        - name: script
          configMap:
            name: holmes-remediation-script
        # Optional so the pod starts before the first token refresh has run
        - name: github-token
          secret:
            secretName: github-app-token
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-remediation
  namespace: holmesgpt
  labels:
    app: holmes-remediation
spec:
  selector:
    app: holmes-remediation
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  # Renamed so it is recreated without the Authelia annotation Kyverno added to the old one
  name: holmes-remediation-actions
  namespace: holmesgpt
  labels:
    # ntfy action buttons can't pass Authelia; the unguessable per-PR token is the auth.
    # Only /merge and /reject are exposed, /remediations (lists tokens) stays cluster-internal.
    enable-oauth: "false"
spec:
  rules:
    - host: holmes-remediation.${domain}
      http:
        paths:
          - path: /merge/
            pathType: Prefix
            backend:
              service:
                name: holmes-remediation
                port:
                  number: 8080
          - path: /reject/
            pathType: Prefix
            backend:
              service:
                name: holmes-remediation
                port:
                  number: 8080
