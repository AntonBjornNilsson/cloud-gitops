---
apiVersion: v1
kind: Namespace
metadata:
  name: holmesgpt
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: holmes-remediation-script
  namespace: holmesgpt
data:
  controller.py: |
    import os
    import sys
    import json
    import time
    import uuid
    import secrets
    import hashlib
    import re
    import base64
    import ssl
    import threading
    from http.server import HTTPServer, BaseHTTPRequestHandler
    import urllib.request
    import urllib.error

    NTFY_TOPIC    = os.environ.get("NTFY_TOPIC", "homelab-alerts")
    NTFY_SERVER   = os.environ.get("NTFY_SERVER", "http://ntfy.ntfy.svc.cluster.local").rstrip("/")
    NTFY_TOKEN    = os.environ.get("NTFY_TOKEN", "")
    NTFY_WEB_URL  = os.environ.get("NTFY_WEB_URL", "").rstrip("/")
    BASE_URL      = os.environ.get("BASE_URL", "").rstrip("/")
    GITHUB_TOKEN_FILE = os.environ.get("GITHUB_TOKEN_FILE", "/var/run/github/token")
    GITHUB_REPO   = os.environ.get("GITHUB_REPO", "")
    GITHUB_BRANCH = os.environ.get("GITHUB_BRANCH", "main")
    K8S_TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    K8S_CA_PATH    = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"
    K8S_API        = "https://kubernetes.default.svc"
    NAMESPACE      = "holmesgpt"
    STATE_CONFIGMAP = "holmes-remediation-state"
    STATE_MAX_AGE   = 30 * 86400

    remediations = {}
    state_lock   = threading.RLock()
    state_ready  = threading.Event()

    def token_key(token):
        return hashlib.sha256(token.encode("utf-8")).hexdigest()

    def new_item(title, description, pr_number=None, pr_url=None):
        token = secrets.token_urlsafe(24)
        item = {
            "id":          str(uuid.uuid4())[:8],
            "title":       title,
            "description": description,
            "pr_number":   pr_number,
            "pr_url":      pr_url,
            "created_at":  time.time(),
            "status":      "pending"
        }
        with state_lock:
            remediations[token_key(token)] = item
        return token, item

    _k8s_ssl = None

    def _k8s(method, path, payload=None):
        global _k8s_ssl
        if _k8s_ssl is None:
            _k8s_ssl = ssl.create_default_context(cafile=K8S_CA_PATH)
        with open(K8S_TOKEN_PATH) as f:
            k8s_token = f.read().strip()
        req = urllib.request.Request(
            f"{K8S_API}{path}",
            data=json.dumps(payload).encode("utf-8") if payload is not None else None,
            headers={"Authorization": f"Bearer {k8s_token}", "Accept": "application/json",
                     "Content-Type": "application/json"},
            method=method
        )
        with urllib.request.urlopen(req, context=_k8s_ssl, timeout=10) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def load_state():
        try:
            cm = _k8s("GET", f"/api/v1/namespaces/{NAMESPACE}/configmaps/{STATE_CONFIGMAP}")
        except urllib.error.HTTPError as e:
            if e.code == 404:
                return False
            raise
        data = cm.get("data") or {}
        with state_lock:
            remediations.update(json.loads(data.get("remediations.json") or "{}"))
        return True

    def save_state():
        if not state_ready.is_set():
            return
        with state_lock:
            now = time.time()
            for key in [k for k, i in remediations.items() if now - i.get("created_at", now) > STATE_MAX_AGE]:
                del remediations[key]
            keep = {
                k: dict(i, description=(i.get("description") or "")[:2000])
                for k, i in remediations.items() if i.get("pr_number")
            }
            body = {
                "apiVersion": "v1",
                "kind":       "ConfigMap",
                "metadata":   {"name": STATE_CONFIGMAP, "namespace": NAMESPACE,
                               "labels": {"app": "holmes-remediation"}},
                "data": {
                    "remediations.json": json.dumps(keep)
                }
            }
            base = f"/api/v1/namespaces/{NAMESPACE}/configmaps"
            try:
                try:
                    _k8s("PUT", f"{base}/{STATE_CONFIGMAP}", body)
                except urllib.error.HTTPError as e:
                    if e.code != 404:
                        raise
                    _k8s("POST", base, body)
            except Exception as e:
                print(f"[state] Save failed: {e}", file=sys.stderr)

    def _post_ntfy(payload):
        headers = {"Content-Type": "application/json"}
        if NTFY_TOKEN:
            headers["Authorization"] = f"Bearer {NTFY_TOKEN}"
        try:
            req = urllib.request.Request(
                f"{NTFY_SERVER}/",
                data=json.dumps(payload).encode("utf-8"),
                headers=headers,
                method="POST"
            )
            with urllib.request.urlopen(req, timeout=10) as resp:
                print(f"[ntfy] Sent '{payload.get('title','?')}', status {resp.status}")
        except Exception as e:
            print(f"[ntfy] Failed: {e}", file=sys.stderr)

    def send_ntfy_pr_notification(title, message, token, pr_number, pr_url):
        _post_ntfy({
            "topic":   NTFY_TOPIC,
            "title":    f"🔧 PR #{pr_number} ready: {title[:80]}",
            "message":  f"{message[:3000]}\n\n🔗 PR #{pr_number}: {pr_url}",
            "markdown": True,
            "tags":     ["warning", "robot"],
            "actions": [
                {"action": "http",  "label": "✅ Merge PR",  "url": f"{BASE_URL}/merge/{token}",  "method": "POST"},
                {"action": "http",  "label": "❌ Reject PR", "url": f"{BASE_URL}/reject/{token}", "method": "POST"},
                {"action": "view",  "label": "👁 View PR",   "url": pr_url}
            ]
        })

    def send_ntfy_failure(title, message):
        _post_ntfy({
            "topic":    NTFY_TOPIC,
            "title":    f"🚨 Claude Agent Alert: {title[:80]}",
            "message":  message[:4000],
            "tags":     ["rotating_light", "robot"],
            "priority": "high"
        })

    def send_ntfy_followup(title, message, tags=None):
        _post_ntfy({
            "topic":   NTFY_TOPIC,
            "title":   title,
            "message": message[:2000],
            "tags":    tags or ["white_check_mark"]
        })

    def _github_token():
        with open(GITHUB_TOKEN_FILE) as f:
            return f.read().strip()

    def _github(method, path, payload=None):
        url  = f"https://api.github.com/repos/{GITHUB_REPO}{path}"
        data = json.dumps(payload).encode("utf-8") if payload else None
        req  = urllib.request.Request(
            url, data=data,
            headers={
                "Authorization": f"Bearer {_github_token()}",
                "Accept":        "application/vnd.github+json",
                "Content-Type":  "application/json",
                "User-Agent":    "Claude-Agent-Remediation"
            },
            method=method
        )
        with urllib.request.urlopen(req, timeout=15) as resp:
            return json.loads(resp.read().decode("utf-8"))

    def merge_pr(number):
        _github("PUT", f"/pulls/{number}/merge", {
            "merge_method":  "squash",
            "commit_title":  f"fix(claude-agent): auto-merge remediation PR #{number}"
        })

    def close_pr(number):
        _github("PATCH", f"/pulls/{number}", {"state": "closed"})

    class RequestHandler(BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            msg = re.sub(r"(/(?:merge|reject)/)[^\s?]+", r"\1<redacted>", fmt % args)
            print(f"[http] {self.address_string()} {msg}")

        def _json(self, code, obj):
            body = json.dumps(obj).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(body)

        def _text(self, code, text):
            self.send_response(code)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(text.encode("utf-8"))

        def do_GET(self):
            if self.path in ("/healthz", "/readyz"):
                self._json(200, {"status": "ok"})
            elif self.path == "/remediations":
                with state_lock:
                    self._json(200, remediations)
            else:
                self.send_response(404); self.end_headers()

        def do_POST(self):
            length = int(self.headers.get("Content-Length", 0))
            body   = self.rfile.read(length) if length > 0 else b""

            if self.path.startswith("/merge/"):
                if not state_ready.is_set():
                    self._text(503, "Starting up, try again shortly.\n"); return
                token = self.path[7:].split("?")[0]
                with state_lock:
                    item = remediations.get(token_key(token))
                if not item:
                    self._text(404, "Not found.\n"); return
                if not item.get("pr_number"):
                    self._text(400, "No PR for this token.\n"); return
                if item["status"] in ("merged", "rejected"):
                    self._text(200, f"Already {item['status']}.\n"); return
                try:
                    merge_pr(item["pr_number"])
                    item["status"] = "merged"
                    save_state()
                    send_ntfy_followup("✅ PR Merged",
                        f"PR #{item['pr_number']} for '{item['title']}' merged into {GITHUB_BRANCH}.\n{item.get('pr_url','')}",
                        tags=["white_check_mark"])
                    self._text(200, f"PR #{item['pr_number']} merged.\n")
                except Exception as e:
                    detail = e.read().decode("utf-8", "replace")[:300] if isinstance(e, urllib.error.HTTPError) else str(e)
                    send_ntfy_followup("⚠️ Merge failed",
                        f"PR #{item['pr_number']} could not be merged (checks pending or failing?):\n{detail}\n{item.get('pr_url','')}",
                        tags=["warning"])
                    self._text(500, f"Merge failed: {e}\n")
                return

            if self.path.startswith("/reject/"):
                if not state_ready.is_set():
                    self._text(503, "Starting up, try again shortly.\n"); return
                token = self.path[8:].split("?")[0]
                with state_lock:
                    item = remediations.get(token_key(token))
                if not item:
                    self._text(404, "Not found.\n"); return
                if not item.get("pr_number"):
                    self._text(400, "No PR for this token.\n"); return
                if item["status"] in ("merged", "rejected"):
                    self._text(200, f"Already {item['status']}.\n"); return
                try:
                    close_pr(item["pr_number"])
                    item["status"] = "rejected"
                    save_state()
                    send_ntfy_followup("❌ PR Rejected",
                        f"PR #{item['pr_number']} for '{item['title']}' closed without merging.",
                        tags=["x"])
                    self._text(200, f"PR #{item['pr_number']} closed.\n")
                except Exception as e:
                    self._text(500, f"Reject failed: {e}\n")
                return

            if self.path == "/register":
                try:
                    data = json.loads(body.decode("utf-8")) if body else {}
                except Exception:
                    self._text(400, "Invalid JSON.\n"); return
                title       = data.get("title") or "Cluster finding"
                description = data.get("summary") or ""
                pr_number   = data.get("pr_number")
                if not pr_number:
                    send_ntfy_failure(title, description or "No details available.")
                    self._json(200, {"status": "notified_no_pr"}); return
                token_id, _ = new_item(title, description, pr_number=int(pr_number), pr_url=data.get("pr_url"))
                save_state()
                send_ntfy_pr_notification(title, description, token_id, pr_number, data.get("pr_url", ""))
                self._json(200, {"status": "registered", "pr_number": pr_number}); return

            self.send_response(404); self.end_headers()

    def init_state():
        if not os.path.exists(K8S_TOKEN_PATH):
            print("[init] No serviceaccount token — running local, state kept in memory only.")
            state_ready.set()
            return

        while True:
            try:
                restored = load_state()
                print(f"[state] restored={restored} remediations={len(remediations)}")
                break
            except Exception as e:
                print(f"[state] Load failed, retrying: {e}", file=sys.stderr)
                time.sleep(5)
        state_ready.set()
        save_state()

    def main():
        print(f"[startup] Claude Agent Remediation :8080  repo={GITHUB_REPO}  branch={GITHUB_BRANCH}")
        print(f"[startup] ntfy={NTFY_SERVER}/{NTFY_TOPIC}  base_url={BASE_URL}")
        threading.Thread(target=init_state, daemon=True).start()
        HTTPServer(("0.0.0.0", 8080), RequestHandler).serve_forever()

    if __name__ == "__main__":
        main()
---
apiVersion: v1
kind: Secret
metadata:
  name: holmes-ntfy-token
  namespace: holmesgpt
type: Opaque
stringData:
  token: "${ntfy_alertmanager_token}"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: holmes-remediation
  namespace: holmesgpt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: holmes-remediation-role
  namespace: holmesgpt
rules:
  # Persisted button tokens (hashed)
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["holmes-remediation-state"]
    verbs: ["get", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: holmes-remediation-binding
  namespace: holmesgpt
subjects:
  - kind: ServiceAccount
    name: holmes-remediation
    namespace: holmesgpt
roleRef:
  kind: Role
  name: holmes-remediation-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: holmes-remediation
  namespace: holmesgpt
  labels:
    app: holmes-remediation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: holmes-remediation
  template:
    metadata:
      labels:
        app: holmes-remediation
      annotations:
        holmes-remediation/script-revision: "6"
    spec:
      serviceAccountName: holmes-remediation
      containers:
        - name: remediation-controller
          image: python:3.11-alpine
          command: ["python3", "-u", "/app/controller.py"]
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: NTFY_TOPIC
              value: "homelab-alerts"
            - name: NTFY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: holmes-ntfy-token
                  key: token
            - name: NTFY_SERVER
              value: "http://ntfy.ntfy.svc.cluster.local"
            - name: NTFY_WEB_URL
              value: "https://ntfy.${domain}"
            - name: BASE_URL
              value: "https://holmes-remediation.${domain}"
            - name: GITHUB_REPO
              value: "${github_repo}"
            - name: GITHUB_BRANCH
              value: "main"
            - name: GITHUB_TOKEN_FILE
              value: /var/run/github/token
          volumeMounts:
            - name: script
              mountPath: /app
            - name: github-token
              mountPath: /var/run/github
              readOnly: true
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
      volumes:
        - name: script
          configMap:
            name: holmes-remediation-script
        - name: github-token
          secret:
            secretName: github-app-token
---
apiVersion: v1
kind: Service
metadata:
  name: holmes-remediation
  namespace: holmesgpt
  labels:
    app: holmes-remediation
spec:
  selector:
    app: holmes-remediation
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: holmes-remediation-actions
  namespace: holmesgpt
  labels:
    enable-oauth: "false"
spec:
  ingressClassName: traefik
  rules:
    - host: holmes-remediation.${domain}
      http:
        paths:
          - path: /merge/
            pathType: Prefix
            backend:
              service:
                name: holmes-remediation
                port:
                  number: 8080
          - path: /reject/
            pathType: Prefix
            backend:
              service:
                name: holmes-remediation
                port:
                  number: 8080
