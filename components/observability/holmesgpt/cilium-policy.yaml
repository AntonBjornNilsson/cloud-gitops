apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  endpointSelector: {}
  ingress:
    # Internal communication among holmes, holmes-operator, and github-mcp-server
    - fromEndpoints:
        - {}
    # Internal cluster communication to Holmes API & Remediation Service
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "8080"
              protocol: TCP
    # Web ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server for cluster discovery, logs, and events
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Google AI (Gemini) and GitHub APIs
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # Internal communication between pods in holmesgpt namespace
    - toEndpoints:
        - {}
    # VictoriaMetrics cluster metrics access
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    # ntfy notifications (remediation controller)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Ollama LLM access
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ollama
      toPorts:
        - ports:
            - port: "11434"
              protocol: TCP
