---
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cluster-health-investigation
  namespace: holmesgpt
spec:
  schedule: "0 */6 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Investigate the entire Kubernetes cluster across all namespaces for active issues,
    crashlooping pods, warning events, degraded volumes, and failing jobs.
    If you detect any issues:
    1. Detail the exact problem, affected resources, and root cause.
    2. Propose a specific fix. If a Kubernetes manifest or configuration in cloud-gitops can resolve it,
       specify the exact file path and complete updated content in a code fence formatted as:
       ```yaml:path/to/file.yaml
       <updated content>
       ```
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: trigger-holmesgpt-investigation
  namespace: holmesgpt
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trigger
              image: curlimages/curl:latest
              command:
                - /bin/sh
                - -c
                - |
                  echo "Requesting health check execution via Holmes API..."
                  curl -s -X POST http://holmesgpt-holmes:80/api/checks/execute \
                    -H "Content-Type: application/json" \
                    -d '{
                      "name": "cluster-scheduled-check",
                      "query": "Check all pods and nodes across all namespaces. Report any failing, CrashLoopBackOff, or unhealthy resources. If a fix can be made to manifests, provide the relative file path and new file content in a code block ```yaml:path/to/file.yaml.",
                      "mode": "alert",
                      "timeout": 180,
                      "destinations": [
                        {
                          "type": "slack",
                          "config": {
                            "webhook_url": "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
                          }
                        }
                      ]
                    }'
