---
# ─────────────────────────────────────────────────────────────────────────────
# 1. General cluster health (every 6 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cluster-health-investigation
  namespace: holmesgpt
spec:
  schedule: "0 */6 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Investigate the entire Kubernetes cluster across all namespaces for active issues,
    crashlooping pods, warning events, degraded volumes, and failing jobs.
    If you detect any issues:
    1. Detail the exact problem, affected resources, and root cause.
    2. Propose a specific fix. If a Kubernetes manifest or configuration in cloud-gitops can resolve it,
       specify the exact file path and complete updated content in a code fence formatted as:
       ```yaml:path/to/file.yaml
       <updated content>
       ```
---
# ─────────────────────────────────────────────────────────────────────────────
# 2. Security audit (daily at 03:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: security-audit
  namespace: holmesgpt
spec:
  schedule: "0 3 * * *"
  mode: alert
  timeout: 300
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Perform a comprehensive security audit of the Kubernetes cluster.
    Check for:
    - Pods running as root or with privileged security contexts
    - Containers with dangerous capabilities (NET_ADMIN, SYS_PTRACE, etc.)
    - Pods with hostNetwork, hostPID, or hostIPC enabled
    - Writable root filesystems (readOnlyRootFilesystem: false)
    - Images pulled from unverified or public registries without digest pinning
    - Secrets exposed as environment variables instead of mounted volumes
    - ServiceAccounts with auto-mounted tokens that should have automountServiceAccountToken: false
    - Containers running as UID 0 without explicit securityContext.runAsNonRoot: true
    For each finding: report the resource, namespace, severity, and a concrete remediation
    with the corrected manifest in a code fence ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 3. RBAC & permissions review (daily at 03:30)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: rbac-permissions-review
  namespace: holmesgpt
spec:
  schedule: "30 3 * * *"
  mode: alert
  timeout: 240
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Audit RBAC configuration across all namespaces for over-permissive roles.
    Look for:
    - ClusterRoles or Roles that grant wildcard (*) verbs or resources
    - ServiceAccounts bound to cluster-admin or overly broad ClusterRoles
    - Unused RoleBindings or ClusterRoleBindings (subjects that no longer exist)
    - ServiceAccounts that have no workloads but still have role bindings
    - Any role that grants access to secrets cluster-wide
    Report each violation with the exact resource name, namespace, bound subjects,
    and a least-privilege replacement manifest in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 4. Log error mining (every 2 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: log-error-mining
  namespace: holmesgpt
spec:
  schedule: "0 */2 * * *"
  mode: alert
  timeout: 240
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Scan recent pod logs (last 2 hours) across all namespaces for error patterns.
    Focus on:
    - Lines containing ERROR, FATAL, CRITICAL, panic, or stack traces
    - OOMKilled events and memory pressure signals
    - Connection refused / timeout errors indicating downstream service failures
    - Database connection pool exhaustion or query failures
    - Authentication or authorisation failure bursts
    Group findings by service, count occurrences, and assess whether the error rate
    is increasing. For recurring errors suggest root-cause fixes including manifest
    changes in ```yaml:path/to/file.yaml where applicable.
---
# ─────────────────────────────────────────────────────────────────────────────
# 5. Ingress & endpoint reachability (every 30 min)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: ingress-reachability
  namespace: holmesgpt
spec:
  schedule: "*/30 * * * *"
  mode: alert
  timeout: 120
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Check all Ingress resources across every namespace for reachability issues.
    For each Ingress:
    - Verify the Ingress has an assigned address/IP from the controller
    - Confirm the backend Service and Endpoints exist and have ready pods
    - Detect misconfigured host rules, missing TLS secrets, or wrong service port references
    - Identify Ingresses pointing to Services with no matching pods (selector mismatch)
    - Flag any Ingresses whose TLS secret is absent or expired
    Report unreachable or misconfigured ingresses with exact resource paths and
    corrective YAML in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 6. TLS certificate expiry (daily at 04:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: tls-certificate-expiry
  namespace: holmesgpt
spec:
  schedule: "0 4 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Audit all TLS certificates managed by cert-manager across the cluster.
    Check every Certificate and CertificateRequest resource for:
    - Certificates expiring within the next 14 days (urgent)
    - Certificates expiring within the next 30 days (warning)
    - Certificates in a failed or pending renewal state
    - Certificates whose issuer is reporting errors (ACME challenges failing, etc.)
    - Secrets of type kubernetes.io/tls that are not managed by cert-manager but may be stale
    For each at-risk certificate, provide the namespace, secret name, expiry date,
    issuer details, and any renewal action needed including updated Certificate manifests.
---
# ─────────────────────────────────────────────────────────────────────────────
# 7. Network policy gaps (daily at 04:30)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: network-policy-gaps
  namespace: holmesgpt
spec:
  schedule: "30 4 * * *"
  mode: alert
  timeout: 240
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Analyse NetworkPolicy coverage across all namespaces.
    Identify:
    - Namespaces with no NetworkPolicies at all (fully open east-west traffic)
    - Pods not selected by any NetworkPolicy (implicitly allow-all)
    - NetworkPolicies with overly broad selectors (e.g., empty podSelector selecting all pods)
    - Missing default-deny ingress or egress policies in sensitive namespaces
    - Policies that accidentally allow traffic from all namespaces
    For each gap, explain the blast radius and provide a default-deny policy
    plus targeted allow rules as corrective manifests in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 8. Resource requests/limits & HPA review (every 6 h, offset 3 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: resource-limits-review
  namespace: holmesgpt
spec:
  schedule: "0 1,7,13,19 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Review resource requests and limits across all workloads in the cluster.
    Flag:
    - Containers missing resource requests or limits entirely
    - Containers where limits are set but requests are not (scheduling risk)
    - Containers with requests equal to limits (no burstable headroom)
      that appear undersized based on actual usage vs requests
    - Containers with very high memory limits relative to node capacity (OOM risk)
    - HorizontalPodAutoscalers that have no corresponding resource requests
    - HPAs where minReplicas equals maxReplicas (effectively disabled autoscaling)
    - Deployments with no PodDisruptionBudget (risky during node drains)
    Propose corrected resource manifests in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 9. Storage & PVC health (every 6 h, offset 1.5 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: storage-pvc-health
  namespace: holmesgpt
spec:
  schedule: "30 0,6,12,18 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Inspect persistent storage health across the cluster.
    Check:
    - PersistentVolumeClaims in Pending state (unbound volumes)
    - PersistentVolumes in Released or Failed state
    - PVCs with no owning pod (orphaned storage, potential cost waste)
    - StorageClasses where no default is set or multiple defaults conflict
    - Volumes approaching capacity (if metrics are available)
    - StatefulSets whose PVC templates are mismatched with actual PVCs
    Report each issue with the PVC/PV name, namespace, storage class, size, and
    corrective action or cleanup manifest.
---
# ─────────────────────────────────────────────────────────────────────────────
# 10. Node health & capacity (every 1 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: node-health-capacity
  namespace: holmesgpt
spec:
  schedule: "5 * * * *"
  mode: alert
  timeout: 120
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Check the health and capacity of all cluster nodes.
    Report:
    - Nodes in NotReady, MemoryPressure, DiskPressure, or PIDPressure conditions
    - Nodes with high pod density (>85% of max pods allocated)
    - Nodes that are cordoned or tainted unexpectedly
    - Nodes that have not had kubelet heartbeats recently
    - Any node eviction events in the last hour
    - System pods (kube-proxy, CNI, etc.) missing or not running on specific nodes
    Summarise node resource utilisation and flag nodes approaching CPU or memory saturation.
---
# ─────────────────────────────────────────────────────────────────────────────
# 11. Flux GitOps reconciliation health (every 15 min)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: flux-reconciliation-health
  namespace: holmesgpt
spec:
  schedule: "*/15 * * * *"
  mode: alert
  timeout: 120
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Check the health of all Flux GitOps resources: GitRepository, Kustomization,
    HelmRelease, HelmRepository, and ImageUpdateAutomation objects.
    Identify:
    - Any resource in a Failed or stalled reconciliation state
    - Resources that have not successfully reconciled within their expected interval times 2
    - HelmReleases with upgrade or install failures
    - GitRepositories that cannot reach their remote (auth errors, connection timeouts)
    - Kustomizations with dependency (dependsOn) cycles or blocking failed dependencies
    - ImageUpdateAutomation objects that have stopped committing
    For each failure, provide the resource name, namespace, last error message, and
    recommended fix (e.g., corrected Secret, updated source URL, patched manifest).
---
# ─────────────────────────────────────────────────────────────────────────────
# 12. CronJob & Job failure sweep (every 1 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cronjob-job-failures
  namespace: holmesgpt
spec:
  schedule: "10 * * * *"
  mode: alert
  timeout: 120
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Scan all CronJobs and Jobs across every namespace for failures.
    Flag:
    - Jobs in a Failed state (backoffLimit exceeded)
    - CronJobs that have missed more than 3 consecutive scheduled runs
    - CronJobs suspended unexpectedly (suspend: true without a known reason)
    - Jobs that have been running longer than their expected duration (potential hangs)
    - Completed Jobs older than 7 days cluttering the namespace (cleanup candidates)
    For each issue, provide the job name, namespace, failure reason from pod logs,
    and any corrective manifest or configuration change needed.
---
# ─────────────────────────────────────────────────────────────────────────────
# 13. Image vulnerability & deprecation scan (daily at 05:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: image-vulnerability-scan
  namespace: holmesgpt
spec:
  schedule: "0 5 * * *"
  mode: alert
  timeout: 300
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Review all container images currently running in the cluster for vulnerability and
    freshness concerns.
    Check for:
    - Images using the 'latest' tag (non-deterministic deployments)
    - Images from deprecated or archived base images
    - Images that have not been updated in over 90 days (potential unpatched CVEs)
    - Images pulled from Docker Hub public registry without rate-limit consideration
    - Trivy or other in-cluster scan results showing CRITICAL or HIGH CVEs if available
    For each finding, list the workload, namespace, image reference, and recommend
    a pinned digest or updated image tag with the corrected manifest in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 14. Service mesh & DNS resolution check (every 2 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: service-dns-resolution
  namespace: holmesgpt
spec:
  schedule: "20 */2 * * *"
  mode: alert
  timeout: 180
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Investigate DNS and inter-service connectivity health inside the cluster.
    Check:
    - CoreDNS pod health, readiness, and recent error logs
    - Services with no ready endpoints (all pods behind Service are not ready)
    - ExternalName Services pointing to stale or unreachable external hosts
    - Services whose selector matches no pods in the namespace
    - Headless services that should have endpoints but do not
    - DNS lookup failures visible in pod logs (NXDOMAIN, connection refused)
    - Lingering Endpoints objects for deleted Services
    Report each issue with affected namespace, service name, and corrective YAML.
---
# ─────────────────────────────────────────────────────────────────────────────
# 15. Cost & waste optimisation (daily at 06:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: cost-waste-optimisation
  namespace: holmesgpt
spec:
  schedule: "0 6 * * *"
  mode: alert
  timeout: 300
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Identify resource waste and cost optimisation opportunities in the cluster.
    Look for:
    - Deployments scaled to 0 replicas with no apparent reason (forgotten test workloads)
    - Namespaces with no running workloads but still consuming config objects
    - Requests significantly over-provisioned compared to actual usage (if metrics available)
    - LoadBalancer Services that have no traffic (idle external IPs, potential cost)
    - Unattached or Released PersistentVolumes still provisioned
    - ConfigMaps or Secrets not referenced by any workload in the namespace
    - Duplicate or redundant Deployments serving the same purpose
    Summarise estimated waste, prioritise by impact, and suggest decommission or
    right-sizing manifests in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 16. Observability stack health (every 1 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: observability-stack-health
  namespace: holmesgpt
spec:
  schedule: "15 */1 * * *"
  mode: alert
  timeout: 150
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Verify the health of the observability stack (Prometheus, Grafana, Alertmanager,
    Loki, Jaeger/Tempo, OpenTelemetry collectors).
    Check:
    - All observability pods are Running and Ready
    - Prometheus targets: look for targets in DOWN state or with scrape errors
    - Alertmanager is reachable and not silencing everything globally by accident
    - Loki ingestion: any backpressure, disk full, or ingestion errors in logs
    - OpenTelemetry Collector pipelines processing spans/metrics without dropping
    - Grafana datasource health (failed datasource connections)
    - Any firing alerts silenced for more than 24 h without acknowledgement
    Report each problem with component, namespace, and recommended remediation.
---
# ─────────────────────────────────────────────────────────────────────────────
# 17. Improvement & best-practice suggestions (weekly, Monday 07:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: best-practice-improvement-suggestions
  namespace: holmesgpt
spec:
  schedule: "0 7 * * 1"
  mode: alert
  timeout: 300
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Conduct a weekly best-practice review and suggest concrete improvements.
    Evaluate:
    - Workloads missing liveness or readiness probes
    - Deployments without a RollingUpdate strategy defined
    - Services using NodePort where ClusterIP plus Ingress would be safer
    - Namespaces without ResourceQuota or LimitRange objects
    - Pods without topologySpreadConstraints or podAntiAffinity (single-node SPOF risk)
    - Workloads not following 12-factor principles (config in env vars vs ConfigMaps)
    - Helm releases with default values that should be customised for production
    - Any deprecated API versions in manifests (e.g., extensions/v1beta1)
    For each suggestion, rate it Low/Medium/High impact and provide an improved
    manifest snippet in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 18. Admission webhook & policy engine health (every 6 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: admission-webhook-health
  namespace: holmesgpt
spec:
  schedule: "0 2,8,14,20 * * *"
  mode: alert
  timeout: 150
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Check the health of all admission webhooks (MutatingWebhookConfiguration and
    ValidatingWebhookConfiguration) and policy engines (OPA/Gatekeeper, Kyverno).
    Detect:
    - Webhooks whose service endpoints are unreachable (will block pod creation)
    - Webhooks with failurePolicy: Fail pointing to unhealthy or missing services
    - Expired or soon-to-expire TLS certs used by webhook services
    - Kyverno or Gatekeeper policies in a failed or error state
    - Policy violations currently blocking resources from being created
    - Webhooks with very broad scope (matching all resources/namespaces) unnecessarily
    Report each finding with the webhook name, backend service, failure mode, and fix.
---
# ─────────────────────────────────────────────────────────────────────────────
# 19. Secret hygiene & rotation check (daily at 02:00)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: secret-hygiene
  namespace: holmesgpt
spec:
  schedule: "0 2 * * *"
  mode: alert
  timeout: 240
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Audit Secrets across all namespaces for hygiene and rotation concerns.
    Look for:
    - Secrets of type Opaque that appear to contain plaintext passwords or tokens
      (keys named password, token, key, secret, api_key, etc.)
    - Secrets not referenced by any workload (orphaned secrets)
    - ImagePullSecrets pointing to registries no longer in use
    - Secrets last modified more than 90 days ago (likely stale credentials)
    - ExternalSecrets (if ESO is installed) in a failed sync state
    - Secrets duplicated across namespaces that should be centralised
    Summarise findings and suggest rotation actions or ESO / Sealed Secrets adoption
    with example manifests in ```yaml:path/to/file.yaml.
---
# ─────────────────────────────────────────────────────────────────────────────
# 20. Proactive trouble-hunting (every 4 h)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: holmesgpt.dev/v1alpha1
kind: ScheduledHealthCheck
metadata:
  name: proactive-trouble-hunting
  namespace: holmesgpt
spec:
  schedule: "0 */4 * * *"
  mode: alert
  timeout: 300
  destinations:
    - type: slack
      config:
        webhook_url: "http://holmes-remediation.holmesgpt.svc.cluster.local:8080/webhook"
  query: >-
    Proactively hunt for early warning signs of trouble across the entire cluster
    before they escalate into incidents.
    Investigate:
    - Pods that have restarted more than 3 times in the last 4 hours (pre-crashloop signals)
    - Events of type Warning accumulated in any namespace in the last 4 hours
    - Nodes whose resource utilisation has grown more than 20% compared to the previous period
    - Deployments where the desired replica count has not been achieved for more than 10 minutes
    - StatefulSets with pods not in Running state or ordinal gaps
    - Resources in Terminating state for more than 10 minutes (stuck finalizers)
    - Pending pods that have been unschedulable for more than 5 minutes
    - Endpoints that have dropped below minimum ready threshold
    Correlate signals to identify systemic issues and provide a risk summary with
    recommended pre-emptive actions and manifests in ```yaml:path/to/file.yaml.
