---
apiVersion: v1
kind: Namespace
metadata:
  name: holmesgpt
---
apiVersion: v1
kind: Secret
metadata:
  name: holmes-secrets
  namespace: holmesgpt
type: Opaque
stringData:
  gemini-api-key: "${google_ai_token}"
---
apiVersion: v1
kind: Secret
metadata:
  name: holmes-github-token
  namespace: holmesgpt
type: Opaque
stringData:
  token: "${github_pat_token}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: robusta
  namespace: holmesgpt
spec:
  interval: 24h
  url: https://robusta-charts.storage.googleapis.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  interval: 12h
  chart:
    spec:
      chart: holmes
      version: "0.42.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: holmesgpt
      interval: 12h
  timeout: 5m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    # Model configuration using Gemini
    modelList:
      gemini-2.5-flash:
        model: gemini/gemini-2.5-flash
        api_key: envRef:GEMINI_API_KEY

    # Supply Gemini API key to Holmes
    additionalEnvVars:
      - name: GEMINI_API_KEY
        valueFrom:
          secretKeyRef:
            name: holmes-secrets
            key: gemini-api-key
      - name: MODEL
        value: "gemini-2.5-flash"

    # Enable Holmes Operator for continuous investigations
    operator:
      enabled: true
      logLevel: INFO

    # GitHub MCP Addon for repository investigation, issue creation, and opening PRs
    mcpAddons:
      github:
        enabled: true
        auth:
          secretName: holmes-github-token
          secretKey: token
        config:
          toolsets: "repos,issues,pull_requests,actions,context"
