---
apiVersion: v1
kind: Namespace
metadata:
  name: holmesgpt
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: v1
kind: Secret
metadata:
  name: holmes-github-token
  namespace: holmesgpt
type: Opaque
stringData:
  token: "${github_pat_token}"
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: robusta
  namespace: holmesgpt
spec:
  interval: 24h
  url: https://robusta-charts.storage.googleapis.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: holmesgpt
  namespace: holmesgpt
spec:
  interval: 12h
  chart:
    spec:
      chart: holmes
      version: "0.42.0"
      sourceRef:
        kind: HelmRepository
        name: robusta
        namespace: holmesgpt
      interval: 12h
  timeout: 5m
  install:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    crds: CreateReplace
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    # Model configuration using self-hosted Ollama inside cluster
    modelList:
      llama2-13b:
        model: ollama_chat/llama2:13b
        api_base: "http://ollama.ollama.svc.cluster.local:11434"
        api_key: "not-needed"
      "llama2:13b":
        model: ollama_chat/llama2:13b
        api_base: "http://ollama.ollama.svc.cluster.local:11434"
        api_key: "not-needed"

    additionalEnvVars:
      - name: MODEL
        value: "llama2-13b"

    # Enable Holmes Operator for continuous investigations
    operator:
      enabled: true
      logLevel: INFO

    # GitHub MCP Addon for repository investigation, issue creation, and opening PRs
    mcpAddons:
      github:
        enabled: true
        auth:
          secretName: holmes-github-token
          secretKey: token
        config:
          toolsets: "repos,issues,pull_requests,actions,context"
