apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: holmesgpt
resources:
  - secret.yaml
  - serviceaccount.yaml
  - clusterrole.yaml
  - clusterrolebinding.yaml
  - role.yaml
  - rolebinding.yaml
  - cronjob-agent.yaml
  - cronjob-updates.yaml
  - cronjob-token-refresh.yaml
# Scripts as real files; the hash suffix rolls the CronJobs when they change
configMapGenerator:
  - name: claude-agent-scripts
    files:
      - scripts/prompt.md
      - scripts/prompt-updates.md
      - scripts/check-updates.sh
      - scripts/common.sh
      - scripts/investigate.sh
      - scripts/publish.sh
      - scripts/refresh-token.sh
