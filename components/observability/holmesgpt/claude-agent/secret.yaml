apiVersion: v1
kind: Secret
metadata:
  name: claude-agent
  namespace: holmesgpt
type: Opaque
stringData:
  # Long-lived Claude subscription token from `claude setup-token`
  oauth-token: "${claude_code_oauth_token}"
---
# GitHub App the agent and holmes-remediation act as. It is not in the main ruleset's bypass
# list, so its PRs can only be merged once the required checks pass.
apiVersion: v1
kind: Secret
metadata:
  name: claude-agent-github-app
  namespace: holmesgpt
type: Opaque
stringData:
  app-id: "${github_app_id}"
  installation-id: "${github_app_installation_id}"
data:
  private-key: "${github_app_private_key_b64}"
