# Cluster-admin, matching the admin context the cloud-gitops skill uses.
# The prompts keep the agent to GitOps: imperative commands only for transient unblocking.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: claude-agent-admin
subjects:
  - kind: ServiceAccount
    name: claude-agent
    namespace: holmesgpt
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
