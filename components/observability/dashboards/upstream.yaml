# Community dashboards, downloaded by the grafana-operator at reconcile time.
# Pinned to a grafana.com revision; DS_* inputs are mapped to our datasources.
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-agent
  namespace: grafana
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  folder: "Networking"
  grafanaCom:
    id: 16611
    revision: 1
  datasources:
    - inputName: DS_PROMETHEUS
      datasourceName: VictoriaMetrics
---
