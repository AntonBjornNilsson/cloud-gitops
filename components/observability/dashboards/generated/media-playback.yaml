apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: media-playback
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Media"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Jellyfin: who is watching what, transcodes, libraries, users, scheduled tasks and storage; Tracearr.",
       "graphTooltip": 1,
       "links": [
          {
             "asDropdown": true,
             "includeVars": false,
             "keepTime": true,
             "tags": [
                "media"
             ],
             "title": "Media dashboards",
             "type": "dashboards"
          },
          {
             "icon": "dashboard",
             "keepTime": true,
             "title": "Services overview",
             "type": "link",
             "url": "/d/services-overview"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Overview",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "noValue": "down"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "none",
                "graphMode": "none",
                "text": {
                   "titleSize": 12,
                   "valueSize": 16
                },
                "textMode": "name"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (version) (jellyfin_system_info)",
                   "legendFormat": "v{{version}}"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (version) (jellyfin_exporter_build_info)",
                   "legendFormat": "exporter {{version}}"
                }
             ],
             "title": "Jellyfin",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "mappings": [
                      {
                         "options": {
                            "0": {
                               "color": "red",
                               "index": 0,
                               "text": "DOWN"
                            },
                            "1": {
                               "color": "green",
                               "index": 1,
                               "text": "UP"
                            }
                         },
                         "type": "value"
                      }
                   ],
                   "noValue": "exporter down",
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 3,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_up)",
                   "legendFormat": ""
                }
             ],
             "title": "Server",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "text",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 6,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count(jellyfin_now_playing_state) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Watching now",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Sessions re-encoding video or audio (remuxes are not counted).",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "text",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 9,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_transcoding_active)",
                   "legendFormat": ""
                }
             ],
             "title": "Transcoding",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 12,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_media_count{type=\"Movie\"})",
                   "legendFormat": ""
                }
             ],
             "title": "Movies",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 15,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_media_count{type=\"Series\"})",
                   "legendFormat": ""
                }
             ],
             "title": "Series",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 18,
                "y": 1
             },
             "id": 8,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_media_count{type=\"Episode\"})",
                   "legendFormat": ""
                }
             ],
             "title": "Episodes",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "mappings": [
                      {
                         "options": {
                            "0": {
                               "text": "no"
                            },
                            "1": {
                               "text": "yes"
                            }
                         },
                         "type": "value"
                      }
                   ],
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 21,
                "y": 1
             },
             "id": 9,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(jellyfin_system_pending_restart)",
                   "legendFormat": ""
                }
             ],
             "title": "Pending restart",
             "type": "stat"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 10,
             "title": "Now playing",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "State"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "0": {
                                        "color": "orange",
                                        "index": 0,
                                        "text": "paused"
                                     },
                                     "1": {
                                        "color": "green",
                                        "index": 1,
                                        "text": "playing"
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Method"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 110
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "directplay": {
                                        "color": "green",
                                        "index": 0,
                                        "text": "direct play"
                                     },
                                     "directstream": {
                                        "color": "blue",
                                        "index": 1,
                                        "text": "direct stream"
                                     },
                                     "transcode": {
                                        "color": "orange",
                                        "index": 2,
                                        "text": "transcode"
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Progress"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "percentunit"
                         },
                         {
                            "id": "custom.width",
                            "value": 180
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "mode": "lcd",
                               "type": "gauge",
                               "valueDisplayMode": "text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "blue",
                                     "value": null
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Remaining"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "s"
                         },
                         {
                            "id": "custom.width",
                            "value": 100
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Season"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 70
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Ep"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 60
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 7,
                "w": 24,
                "x": 0,
                "y": 6
             },
             "id": 11,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id, username, device, type, title, series_title, series_season, series_episode, method) (jellyfin_now_playing_state)",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_now_playing_progress) / 100",
                   "format": "table",
                   "instant": true,
                   "refId": "B"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_now_playing_remaining)",
                   "format": "table",
                   "instant": true,
                   "refId": "C"
                }
             ],
             "title": "Sessions",
             "transformations": [
                {
                   "id": "joinByField",
                   "options": {
                      "byField": "session_id",
                      "mode": "outer"
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Time": true,
                         "Time 1": true,
                         "Time 2": true,
                         "Time 3": true,
                         "__name__": true,
                         "cluster": true,
                         "container": true,
                         "endpoint": true,
                         "instance": true,
                         "job": true,
                         "namespace": true,
                         "pod": true,
                         "prometheus": true,
                         "service": true,
                         "session_id": true,
                         "url": true,
                         "user_id": true
                      },
                      "indexByName": {
                         "Value #A": 8,
                         "Value #B": 9,
                         "Value #C": 10,
                         "device": 6,
                         "method": 7,
                         "series_episode": 3,
                         "series_season": 2,
                         "series_title": 1,
                         "title": 4,
                         "type": 5,
                         "username": 0
                      },
                      "renameByName": {
                         "Value #A": "State",
                         "Value #B": "Progress",
                         "Value #C": "Remaining",
                         "device": "Device",
                         "method": "Method",
                         "series_episode": "Ep",
                         "series_season": "Season",
                         "series_title": "Series",
                         "title": "Title",
                         "type": "Type",
                         "username": "User"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Only sessions that actually re-encode. \"copy\" = that track is passed through.",
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Bitrate"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "bps"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "FPS"
                      },
                      "properties": [
                         {
                            "id": "decimals",
                            "value": 0
                         },
                         {
                            "id": "custom.width",
                            "value": 60
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Height"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "none"
                         },
                         {
                            "id": "custom.width",
                            "value": 70
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Done"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "percentunit"
                         },
                         {
                            "id": "custom.width",
                            "value": 120
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "mode": "lcd",
                               "type": "gauge",
                               "valueDisplayMode": "text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "blue",
                                     "value": null
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Video"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 80
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "0": {
                                        "color": "orange",
                                        "index": 0,
                                        "text": "encode"
                                     },
                                     "1": {
                                        "color": "green",
                                        "index": 1,
                                        "text": "copy"
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Audio"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 80
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "0": {
                                        "color": "orange",
                                        "index": 0,
                                        "text": "encode"
                                     },
                                     "1": {
                                        "color": "green",
                                        "index": 1,
                                        "text": "copy"
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 7,
                "w": 16,
                "x": 0,
                "y": 13
             },
             "id": 12,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id, username, title, series_title, container, video_codec, audio_codec, hardware_acceleration) (jellyfin_transcoding_session_info)",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_height_pixels)",
                   "format": "table",
                   "instant": true,
                   "refId": "B"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_bitrate_bits_per_second)",
                   "format": "table",
                   "instant": true,
                   "refId": "C"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_framerate)",
                   "format": "table",
                   "instant": true,
                   "refId": "D"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_video_direct)",
                   "format": "table",
                   "instant": true,
                   "refId": "E"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_audio_direct)",
                   "format": "table",
                   "instant": true,
                   "refId": "F"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (session_id) (jellyfin_transcoding_session_completion_percentage) / 100",
                   "format": "table",
                   "instant": true,
                   "refId": "G"
                }
             ],
             "title": "Transcodes",
             "transformations": [
                {
                   "id": "joinByField",
                   "options": {
                      "byField": "session_id",
                      "mode": "outer"
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Time": true,
                         "Time 1": true,
                         "Time 2": true,
                         "Time 3": true,
                         "Time 4": true,
                         "Time 5": true,
                         "Time 6": true,
                         "Time 7": true,
                         "Value #A": true,
                         "__name__": true,
                         "cluster": true,
                         "container": true,
                         "endpoint": true,
                         "instance": true,
                         "job": true,
                         "namespace": true,
                         "pod": true,
                         "prometheus": true,
                         "service": true,
                         "session_id": true,
                         "url": true
                      },
                      "indexByName": { },
                      "renameByName": {
                         "Value #B": "Height",
                         "Value #C": "Bitrate",
