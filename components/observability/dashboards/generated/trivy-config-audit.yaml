apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: trivy-config-audit
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Security"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Failed Trivy config-audit checks grouped by check and resource, and RBAC assessment findings for Roles and ClusterRoles.",
       "links": [
          {
             "asDropdown": false,
             "includeVars": true,
             "keepTime": true,
             "tags": [
                "trivy"
             ],
             "title": "Trivy",
             "type": "dashboards"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Config audit",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Check x resource pairs.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count((trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Failed checks",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 6,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (config_audit_id) ((trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Distinct checks",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 12,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (namespace, resource_kind, resource_name) ((trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Resources affected",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 18,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(trivy_rbacassessments_info{namespace=~\"$namespace\", severity=~\"$severity\", rbac_assessment_success=\"false\"})) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Role findings",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "One row per check. Fixing it usually means one change in a shared pattern (securityContext, resources, probes) across many manifests.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "filterable": true
                   }
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Severity"
                      },
                      "properties": [
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "Critical": {
                                        "color": "dark-red",
                                        "index": 0
                                     },
                                     "High": {
                                        "color": "orange",
                                        "index": 1
                                     },
                                     "Low": {
                                        "color": "blue",
                                        "index": 3
                                     },
                                     "Medium": {
                                        "color": "yellow",
                                        "index": 2
                                     },
                                     "Unknown": {
                                        "color": "text",
                                        "index": 4
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Check"
                      },
                      "properties": [
                         {
                            "id": "links",
                            "value": [
                               {
                                  "targetBlank": false,
                                  "title": "Filter on this check",
                                  "url": "/d/trivy-config-audit/?${namespace:queryparam}&var-check=${__value.raw}&var-severity=All&${inactive:queryparam}&${__url_time_range}"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Description"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 600
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 12,
                "w": 16,
                "x": 0,
                "y": 5
             },
             "id": 6,
             "options": {
                "cellHeight": "sm",
                "footer": {
                   "enablePagination": true
                },
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Resources"
                   }
                ]
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count by (config_audit_id, severity, config_audit_title, config_audit_category, config_audit_description) ((trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                }
             ],
             "title": "Checks",
             "transformations": [
                {
                   "id": "filterFieldsByName",
                   "options": {
                      "include": {
                         "names": [
                            "config_audit_id",
                            "severity",
                            "Value",
                            "config_audit_title",
                            "config_audit_description",
                            "config_audit_category"
                         ]
                      }
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "indexByName": {
                         "Value": 2,
                         "config_audit_category": 5,
                         "config_audit_description": 4,
                         "config_audit_id": 0,
                         "config_audit_title": 3,
                         "severity": 1
                      },
                      "renameByName": {
                         "Value": "Resources",
                         "config_audit_category": "Category",
                         "config_audit_description": "Description",
                         "config_audit_id": "Check",
                         "config_audit_title": "Title",
                         "severity": "Severity"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "continuous-YlRd"
                   },
                   "links": [
                      {
                         "targetBlank": false,
                         "title": "Filter on this namespace",
                         "url": "/d/trivy-config-audit/?var-namespace=${__field.labels.namespace}&${check:queryparam}&${severity:queryparam}&${inactive:queryparam}&${__url_time_range}"
                      }
                   ]
                }
             },
             "gridPos": {
                "h": 12,
                "w": 8,
                "x": 16,
                "y": 5
             },
             "id": 7,
             "options": {
                "displayMode": "basic",
                "orientation": "horizontal",
                "reduceOptions": {
                   "calcs": [
                      "lastNotNull"
                   ]
                },
                "showUnfilled": true
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sort_desc(count by (namespace) ((trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))",
                   "format": "time_series",
                   "instant": true,
                   "legendFormat": "{{namespace}}",
                   "refId": "A"
                }
             ],
             "title": "Failed checks by namespace",
             "type": "bargauge"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Narrow with the Check variable or by clicking a check above.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "filterable": true
                   }
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Severity"
                      },
                      "properties": [
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "Critical": {
                                        "color": "dark-red",
                                        "index": 0
                                     },
                                     "High": {
                                        "color": "orange",
                                        "index": 1
                                     },
                                     "Low": {
                                        "color": "blue",
                                        "index": 3
                                     },
                                     "Medium": {
                                        "color": "yellow",
                                        "index": 2
                                     },
                                     "Unknown": {
                                        "color": "text",
                                        "index": 4
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Resource"
                      },
                      "properties": [
                         {
                            "id": "links",
                            "value": [
                               {
                                  "targetBlank": false,
                                  "title": "Workload drilldown",
                                  "url": "/d/trivy-workload/?var-namespace=${__data.fields.namespace}&var-workload=${__data.fields.resource_name}&var-container=All&var-severity=All&${inactive:queryparam}&${__url_time_range}"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Description"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 600
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 12,
                "w": 24,
                "x": 0,
                "y": 17
             },
             "id": 8,
             "options": {
                "cellHeight": "sm",
                "footer": {
                   "enablePagination": true
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(trivy_configaudits_info{namespace=~\"$namespace\", config_audit_id=~\"$check\", severity=~\"$severity\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                }
             ],
             "title": "Failing resources",
             "transformations": [
                {
                   "id": "filterFieldsByName",
                   "options": {
                      "include": {
                         "names": [
                            "namespace",
                            "resource_kind",
                            "resource_name",
                            "severity",
                            "config_audit_id",
                            "config_audit_title",
                            "config_audit_description"
                         ]
                      }
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "indexByName": {
                         "config_audit_description": 6,
                         "config_audit_id": 4,
                         "config_audit_title": 5,
                         "namespace": 0,
                         "resource_kind": 1,
                         "resource_name": 2,
                         "severity": 3
                      },
                      "renameByName": {
                         "config_audit_description": "Description",
                         "config_audit_id": "Check",
                         "config_audit_title": "Title",
                         "namespace": "Namespace",
                         "resource_kind": "Kind",
                         "resource_name": "Resource",
                         "severity": "Severity"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 29
             },
             "id": 9,
             "title": "RBAC assessment",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Report is \"role-<name>\", or \"role-<hash>\" for long names: `kubectl get rbacassessmentreport -n <namespace> <report> -o yaml` shows the role and the offending rules. Roles shipped by Helm charts are usually expected; look for our own.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "filterable": true
                   }
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Severity"
                      },
                      "properties": [
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "Critical": {
                                        "color": "dark-red",
                                        "index": 0
                                     },
                                     "High": {
                                        "color": "orange",
                                        "index": 1
                                     },
                                     "Low": {
                                        "color": "blue",
                                        "index": 3
                                     },
                                     "Medium": {
                                        "color": "yellow",
                                        "index": 2
                                     },
                                     "Unknown": {
                                        "color": "text",
                                        "index": 4
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Description"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 600
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
                "y": 30
             },
             "id": 10,
             "options": {
                "cellHeight": "sm",
                "footer": {
                   "enablePagination": true
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "trivy_rbacassessments_info{namespace=~\"$namespace\", severity=~\"$severity\", rbac_assessment_success=\"false\"}",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                }
             ],
             "title": "Role findings",
             "transformations": [
                {
                   "id": "filterFieldsByName",
                   "options": {
                      "include": {
                         "names": [
                            "namespace",
                            "name",
                            "severity",
                            "rbac_assessment_id",
                            "rbac_assessment_title",
                            "rbac_assessment_description"
                         ]
                      }
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "indexByName": {
                         "name": 1,
                         "namespace": 0,
                         "rbac_assessment_description": 5,
                         "rbac_assessment_id": 3,
                         "rbac_assessment_title": 4,
                         "severity": 2
                      },
                      "renameByName": {
                         "name": "Report",
                         "namespace": "Namespace",
                         "rbac_assessment_description": "Description",
                         "rbac_assessment_id": "Check",
                         "rbac_assessment_title": "Title",
                         "severity": "Severity"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "trivy-operator only exports counts for ClusterRoles. `kubectl get clusterrbacassessmentreport <report> -o yaml` shows the checks; the trivy-operator.resource.name label names the ClusterRole.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "filterable": true
                   }
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Critical"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "dark-red",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "High"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Medium"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "yellow",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Low"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "blue",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 10,
                "w": 24,
                "x": 0,
                "y": 40
             },
             "id": 11,
             "options": {
                "cellHeight": "sm",
                "footer": {
                   "enablePagination": true
                },
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Critical"
                   }
                ]
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (name) (trivy_clusterrole_clusterrbacassessments{severity=\"Critical\"}) or 0 * sum by (name) (trivy_clusterrole_clusterrbacassessments{severity=~\"$severity\"} > 0)",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                },
                {
                   "datasource": {
