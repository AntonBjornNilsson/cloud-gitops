apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: nas-storage
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Storage"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "TrueNAS CSI driver (NAS API, volume operations), VolumeSnapshots and volume usage.",
       "graphTooltip": 1,
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Overview",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "The CSI controller's WebSocket connection to the TrueNAS API.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "mappings": [
                      {
                         "options": {
                            "0": {
                               "color": "red",
                               "index": 0,
                               "text": "DOWN"
                            },
                            "1": {
                               "color": "green",
                               "index": 1,
                               "text": "UP"
                            }
                         },
                         "type": "value"
                      }
                   ],
                   "noValue": "no metrics",
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(truenas_csi_api_connected)",
                   "legendFormat": ""
                }
             ],
             "title": "NAS API",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 0,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         },
                         {
                            "color": "red",
                            "value": 4
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 4,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(truenas_csi_api_reconnects_total[24h])) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "API reconnects (24h)",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 0,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "red",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 8,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(truenas_csi_api_calls_total{status!=\"success\"}[24h])) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Failed API calls (24h)",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "CreateVolume, attach, resize, snapshot and delete calls that failed. Aborted (a retry while the operation is still running) is left out.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 0,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "red",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 12,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(csi_sidecar_operations_seconds_count{namespace=\"truenas-csi\", grpc_status_code!~\"OK|Aborted\"}[24h])) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Failed CSI operations (24h)",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Claims of the nas-iscsi and nas-nfs StorageClasses (the static media library PVs are not counted).",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 16,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count(kube_persistentvolumeclaim_info{storageclass=~\"nas-.*\"})",
                   "legendFormat": ""
                }
             ],
             "title": "PVCs on the NAS",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "noValue": "no metrics",
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 20,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(snapshot_controller_operations_in_flight)",
                   "legendFormat": ""
                }
             ],
             "title": "Snapshots in progress",
             "type": "stat"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 8,
             "title": "TrueNAS API",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no API calls (idle between volume operations)",
                   "unit": "ops"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 6
             },
             "id": 9,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (method) (rate(truenas_csi_api_calls_total[$__rate_interval])) > 0",
                   "legendFormat": "{{method}}"
                }
             ],
             "title": "API calls by method",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no API calls (idle between volume operations)",
                   "unit": "s"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 6
             },
             "id": 10,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "histogram_quantile(0.95, sum by (method, le) (rate(truenas_csi_api_call_duration_seconds_bucket[$__rate_interval])))",
                   "legendFormat": "{{method}}"
                }
             ],
             "title": "API call duration (p95)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no failed calls",
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 12,
                "x": 0,
                "y": 14
             },
             "id": 11,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (method, status) (increase(truenas_csi_api_calls_total{status!=\"success\"}[$__interval])) > 0",
                   "legendFormat": "{{method}} ({{status}})"
                }
             ],
             "title": "Failed API calls",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 14
             },
             "id": 12,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(truenas_csi_api_connected)",
                   "legendFormat": "connected"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(truenas_csi_api_reconnects_total[$__interval]))",
                   "legendFormat": "reconnects"
                }
             ],
             "title": "Connection",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 21
             },
             "id": 13,
             "title": "Volume operations (CSI)",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Calls from the CSI sidecars (provisioner, attacher, snapshotter, resizer) to the driver, by result.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no volume operations",
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 22
             },
             "id": 14,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (method_name, grpc_status_code) (increase(csi_sidecar_operations_seconds_count{namespace=\"truenas-csi\", method_name!~\".*/(Probe|GetPluginInfo|GetPluginCapabilities|ControllerGetCapabilities)\"}[$__interval])) > 0",
                   "legendFormat": "{{method_name}} {{grpc_status_code}}"
                }
             ],
             "title": "Operations by method",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no volume operations",
                   "unit": "s"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 22
             },
             "id": 15,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "histogram_quantile(0.95, sum by (method_name, le) (rate(csi_sidecar_operations_seconds_bucket{namespace=\"truenas-csi\", method_name!~\".*/(Probe|GetPluginInfo|GetPluginCapabilities|ControllerGetCapabilities)\"}[$__rate_interval])))",
                   "legendFormat": "{{method_name}}"
                }
             ],
             "title": "Operation duration (p95)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Empty = no failures. Details are in the controller log below and in `kubectl get events -A`.",
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Count"
                      },
                      "properties": [
                         {
                            "id": "decimals",
                            "value": 0
                         },
                         {
                            "id": "custom.width",
                            "value": 80
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 7,
                "w": 12,
                "x": 0,
                "y": 30
             },
             "id": 16,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (method_name, grpc_status_code) (increase(csi_sidecar_operations_seconds_count{namespace=\"truenas-csi\", grpc_status_code!=\"OK\"}[$__range])) > 0",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                }
             ],
             "title": "Failed operations (time range)",
             "transformations": [
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Time": true,
                         "__name__": true,
                         "cluster": true,
                         "container": true,
                         "endpoint": true,
                         "instance": true,
                         "job": true,
                         "namespace": true,
                         "pod": true,
                         "prometheus": true,
                         "service": true,
                         "url": true
                      },
                      "renameByName": {
                         "Value": "Count",
                         "grpc_status_code": "Code",
                         "method_name": "Method"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Driver-side count of finished volume operations (no data until the first one after the controller started).",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no volume operations yet",
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 12,
                "x": 12,
                "y": 30
             },
             "id": 17,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (operation, protocol, status) (increase(truenas_csi_volume_operations_total[$__interval])) > 0",
                   "legendFormat": "{{operation}} {{protocol}} {{status}}"
                }
             ],
             "title": "Volumes created, expanded, snapshotted, deleted",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 37
             },
             "id": 18,
             "title": "VolumeSnapshots (snapshot-controller)",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Status \"unknown\" is how the controller records a failure.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no snapshot operations yet",
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 0,
                "y": 38
             },
             "id": 19,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (operation_name, operation_status) (increase(snapshot_controller_operation_total_seconds_count[$__interval])) > 0",
                   "legendFormat": "{{operation_name}} {{operation_status}}"
                }
             ],
             "title": "Snapshot operations",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "noValue": "no snapshot operations yet",
                   "unit": "s"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 8,
                "y": 38
             },
             "id": 20,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "histogram_quantile(0.95, sum by (operation_name, le) (rate(snapshot_controller_operation_total_seconds_bucket[$__rate_interval])))",
                   "legendFormat": "{{operation_name}}"
                }
             ],
             "title": "Snapshot operation duration (p95)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 16,
                "y": 38
             },
             "id": 21,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
