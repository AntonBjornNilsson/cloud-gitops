apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cluster-overview
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Production cluster metrics, hardware utilization, service health, and Traefik ingress performance.",
       "panels": [
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "options": {
                "colorMode": "value"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"} == 1)",
                   "legendFormat": "Ready Nodes"
                }
             ],
             "title": "Ready Nodes",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "palette-classic"
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 6,
                "y": 0
             },
             "id": 2,
             "options": {
                "colorMode": "value"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(kube_pod_status_phase{phase=\"Running\"})",
                   "legendFormat": "Running Pods"
                }
             ],
             "title": "Running Pods",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "red",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 12,
                "y": 0
             },
             "id": 3,
             "options": {
                "colorMode": "value"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(kube_pod_container_status_waiting_reason{reason=~\"CrashLoopBackOff|Error\"}) or vector(0)",
                   "legendFormat": "Failing Pods"
                }
             ],
             "title": "Failing / CrashLooping Pods",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "unit": "reqps"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 6,
                "x": 18,
                "y": 0
             },
             "id": 4,
             "options": {
                "colorMode": "value"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "round(sum(rate(traefik_service_requests_total[5m])) or sum(rate(traefik_entrypoint_requests_total[5m])) or vector(0), 0.1)",
                   "legendFormat": "req/s"
                }
             ],
             "title": "Traefik Total Request Rate",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "max": 100,
                   "min": 0,
                   "unit": "percent"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 4
             },
             "id": 5,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "100 - (avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)",
                   "legendFormat": "{{instance}}"
                }
             ],
             "title": "Node CPU Utilization (%)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "max": 100,
                   "min": 0,
                   "unit": "percent"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 4
             },
             "id": 6,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "100 * (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes))",
                   "legendFormat": "{{instance}}"
                }
             ],
             "title": "Node Memory Utilization (%)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "unit": "reqps"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 12
             },
             "id": 7,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (exported_service) (rate(traefik_service_requests_total[5m]))",
                   "legendFormat": "{{exported_service}}"
                }
             ],
             "title": "Traefik Requests by Service (req/s)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "unit": "reqps"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 12
             },
             "id": 8,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (code, exported_service) (rate(traefik_service_requests_total{code=~\"[45]..\"}[5m]))",
                   "legendFormat": "{{code}} - {{exported_service}}"
                }
             ],
             "title": "Traefik HTTP Error Codes (4xx / 5xx)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 20
             },
             "id": 9,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (volume) (longhorn_volume_actual_size_bytes)",
                   "legendFormat": "{{volume}}"
                }
             ],
             "title": "Longhorn Volume Storage Actual Usage",
             "type": "timeseries"
          }
       ],
       "refresh": "30s",
       "schemaVersion": 39,
       "tags": [
          "kubernetes",
          "gitops",
          "infrastructure",
          "services"
       ],
       "time": {
          "from": "now-1h",
          "to": "now"
       },
       "timezone": "browser",
       "title": "Kubernetes Cluster & Services Overview",
       "uid": "k8s-cluster-overview"
    }
