apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: services-overview
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Services"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Every app under services/: availability, traffic, resources, restarts, storage and alerts, plus a media summary.",
       "graphTooltip": 1,
       "links": [
          {
             "asDropdown": true,
             "includeVars": false,
             "keepTime": true,
             "tags": [
                "media"
             ],
             "title": "Media dashboards",
             "type": "dashboards"
          },
          {
             "icon": "dashboard",
             "keepTime": true,
             "title": "Homelab overview",
             "type": "link",
             "url": "/d/homelab-overview"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Status (18 services)",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Share of service Ingresses answering the blackbox probe.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 0.90000000000000002
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "percentunit"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count(probe_success{probe_group=\"ingress\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"} == 1) / count(probe_success{probe_group=\"ingress\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"})",
                   "legendFormat": ""
                }
             ],
             "title": "Endpoints up",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "red",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 3,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count(min by (namespace) (probe_success{probe_group=\"ingress\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"}) == 0) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Services down",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Running or pending pods that are not Ready (finished job pods are ignored).",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 6,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count((kube_pod_status_ready{condition=\"false\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"} == 1) * on(namespace, pod) group_left() (kube_pod_status_phase{phase=~\"Running|Pending\"} == 1)) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Pods not ready",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 0,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         },
                         {
                            "color": "red",
                            "value": 10
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 9,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"}[24h])) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Restarts (24h)",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Warning and critical alerts carrying a service namespace.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 12,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "count(ALERTS{alertstate=\"firing\", severity=~\"warning|critical\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"}) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Alerts firing",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "reqps"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 15,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(rate(traefik_service_requests_total{exported_service=~\"(nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy)-.*\"}[$__rate_interval]))",
                   "legendFormat": ""
                }
             ],
             "title": "Requests/s",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 2,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "cores"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 18,
                "y": 1
             },
             "id": 8,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(rate(container_cpu_usage_seconds_total{container!=\"\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"}[$__rate_interval]))",
                   "legendFormat": ""
                }
             ],
             "title": "CPU",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 21,
                "y": 1
             },
             "id": 9,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(container_memory_working_set_bytes{container!=\"\", namespace=~\"nginx-echo-namespace|homeassistant|qbittorrent|dispatcharr|vaultwarden|jellyseerr|cleanuparr|recyclarr|prowlarr|jellyfin|tracearr|headlamp|homepage|radarr|sonarr|bazarr|unifi|ntfy\"})",
                   "legendFormat": ""
                }
             ],
             "title": "Memory",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "One row per enabled service. Status/Response/Uptime come from the blackbox probe through Traefik; services without an Ingress show \"no ingress\".",
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Category"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 150
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Service"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 170
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Status"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 80
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-background"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "0": {
                                        "color": "red",
                                        "index": 0,
                                        "text": "DOWN"
                                     },
                                     "1": {
                                        "color": "green",
                                        "index": 1,
                                        "text": "UP"
                                     }
                                  },
                                  "type": "value"
                               },
                               {
                                  "options": {
                                     "match": "null",
                                     "result": {
                                        "color": "transparent",
                                        "index": 2,
                                        "text": "no ingress"
                                     }
                                  },
                                  "type": "special"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Response"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "s"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 0.5
                                  },
                                  {
                                     "color": "red",
                                     "value": 2
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Uptime 24h"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "percentunit"
                         },
                         {
                            "id": "decimals",
                            "value": 2
                         },
                         {
                            "id": "custom.width",
                            "value": 100
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "red",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 0.98999999999999999
                                  },
                                  {
                                     "color": "green",
                                     "value": 0.999
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Req/s"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "reqps"
                         },
                         {
                            "id": "decimals",
                            "value": 2
                         },
                         {
                            "id": "custom.width",
                            "value": 80
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "5xx/s"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "reqps"
                         },
                         {
                            "id": "decimals",
                            "value": 2
                         },
                         {
                            "id": "custom.width",
                            "value": 80
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "red",
                                     "value": 0.01
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "CPU"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "cores"
                         },
                         {
                            "id": "decimals",
                            "value": 2
                         },
                         {
                            "id": "custom.width",
                            "value": 80
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Memory"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "bytes"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Restarts 24h"
                      },
                      "properties": [
                         {
                            "id": "decimals",
                            "value": 0
                         },
                         {
                            "id": "custom.width",
                            "value": 100
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-background"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "transparent",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 1
                                  },
                                  {
                                     "color": "red",
                                     "value": 5
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Fullest PVC"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "percentunit"
                         },
                         {
                            "id": "custom.width",
                            "value": 130
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "mode": "lcd",
                               "type": "gauge",
                               "valueDisplayMode": "text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "green",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 0.80000000000000004
                                  },
                                  {
                                     "color": "red",
                                     "value": 0.90000000000000002
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Alerts"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 70
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-background"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "transparent",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 16,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 10,
             "options": {
                "sortBy": [
                   {
                      "desc": false,
                      "displayName": "Category"
                   }
                ]
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "label_replace(label_replace(vector(1), \"namespace\", \"nginx-echo-namespace\", \"\", \"\"), \"category\", \"Demo\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"qbittorrent\", \"\", \"\"), \"category\", \"Media · Downloads\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"prowlarr\", \"\", \"\"), \"category\", \"Media · Downloads\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"jellyseerr\", \"\", \"\"), \"category\", \"Media · Downloads\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"dispatcharr\", \"\", \"\"), \"category\", \"Media · Downloads\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"cleanuparr\", \"\", \"\"), \"category\", \"Media · Downloads\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"radarr\", \"\", \"\"), \"category\", \"Media · Library\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"sonarr\", \"\", \"\"), \"category\", \"Media · Library\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"bazarr\", \"\", \"\"), \"category\", \"Media · Library\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"recyclarr\", \"\", \"\"), \"category\", \"Media · Library\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"jellyfin\", \"\", \"\"), \"category\", \"Media · Playback\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"tracearr\", \"\", \"\"), \"category\", \"Media · Playback\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"homeassistant\", \"\", \"\"), \"category\", \"Home automation\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"headlamp\", \"\", \"\"), \"category\", \"Management\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"homepage\", \"\", \"\"), \"category\", \"Management\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"ntfy\", \"\", \"\"), \"category\", \"Management\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"unifi\", \"\", \"\"), \"category\", \"Management\", \"\", \"\") or label_replace(label_replace(vector(1), \"namespace\", \"vaultwarden\", \"\", \"\"), \"category\", \"Security\", \"\", \"\")",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
