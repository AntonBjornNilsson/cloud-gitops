                   },
                   "expr": "max(radarr_movie_total)",
                   "legendFormat": "total"
                }
             ],
             "title": "Movies",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
