apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: media-library
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Media"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Sonarr, Radarr, Bazarr and Recyclarr: library size, what is missing, quality, subtitles and health.",
       "graphTooltip": 1,
       "links": [
          {
             "asDropdown": true,
             "includeVars": false,
             "keepTime": true,
             "tags": [
                "media"
             ],
             "title": "Media dashboards",
             "type": "dashboards"
          },
          {
             "icon": "dashboard",
             "keepTime": true,
             "title": "Services overview",
             "type": "link",
             "url": "/d/services-overview"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Overview",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Series",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Downloaded episodes as a share of monitored episodes.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 1,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 0.80000000000000004
                         },
                         {
                            "color": "green",
                            "value": 0.94999999999999996
                         }
                      ]
                   },
                   "unit": "percentunit"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 3,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_downloaded_total) / max(sonarr_episode_monitored_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Episodes on disk",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Monitored, aired episodes without a file.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 6,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_missing_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Missing episodes",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 9,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(radarr_movie_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Movies",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Monitored movies without a file.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 12,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(radarr_movie_missing_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Missing movies",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 15,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_filesize_bytes) + max(radarr_movie_filesize_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Library size",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Free space on the media disk (smallest root folder).",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 100000000000
                         },
                         {
                            "color": "green",
                            "value": 500000000000
                         }
                      ]
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 18,
                "y": 1
             },
             "id": 8,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "min(sonarr_rootfolder_freespace_bytes or radarr_rootfolder_freespace_bytes)",
                   "legendFormat": ""
                }
             ],
             "title": "Free space",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 21,
                "y": 1
             },
             "id": 9,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(bazarr_subtitles_missing_total)",
                   "legendFormat": ""
                }
             ],
             "title": "Missing subtitles",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Same as System > Status in each app. Empty = healthy.",
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "App"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 100
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Level"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "mappings",
                            "value": [
                               {
                                  "options": {
                                     "error": {
                                        "color": "red",
                                        "index": 1
                                     },
                                     "notice": {
                                        "color": "blue",
                                        "index": 2
                                     },
                                     "warning": {
                                        "color": "orange",
                                        "index": 0
                                     }
                                  },
                                  "type": "value"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Check"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 280
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 6,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 10,
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "{__name__=~\"(sonarr|radarr|bazarr)_system_health_issues\"} > 0",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                }
             ],
             "title": "Health checks (sonarr, radarr, bazarr)",
             "transformations": [
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Time": true,
                         "Value": true,
                         "__name__": true,
                         "cluster": true,
                         "container": true,
                         "endpoint": true,
                         "instance": true,
                         "job": true,
                         "namespace": true,
                         "pod": true,
                         "prometheus": true,
                         "service": true,
                         "url": true,
                         "wikiurl": true
                      },
                      "renameByName": {
                         "app": "App",
                         "message": "Message",
                         "source": "Check",
                         "type": "Level"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 11
             },
             "id": 11,
             "title": "Sonarr (series)",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 8,
                "x": 0,
                "y": 12
             },
             "id": 12,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_downloaded_total)",
                   "legendFormat": "on disk"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_monitored_total)",
                   "legendFormat": "monitored"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_total)",
                   "legendFormat": "total"
                }
             ],
             "title": "Episodes",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 8,
                "x": 8,
                "y": 12
             },
             "id": 13,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_missing_total)",
                   "legendFormat": "missing"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_episode_cutoff_unmet_total)",
                   "legendFormat": "cutoff unmet (upgrade wanted)"
                }
             ],
             "title": "Wanted",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "min": 0,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 8,
                "x": 16,
                "y": 12
             },
             "id": 14,
             "options": {
                "displayMode": "gradient",
                "orientation": "horizontal",
                "showUnfilled": true
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sort_desc(max by (quality) (sonarr_episode_quality_total))",
                   "legendFormat": "{{quality}}"
                }
             ],
             "title": "Episodes by quality",
             "type": "bargauge"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Grabs, imports, upgrades and deletions recorded in each app's history.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "min": 0,
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 0,
                "y": 20
             },
             "id": 15,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(rate(sonarr_history_total[$__rate_interval])) * 3600",
                   "legendFormat": "Sonarr"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(rate(radarr_history_total[$__rate_interval])) * 3600",
                   "legendFormat": "Radarr"
                }
             ],
             "title": "Activity (history events per hour)",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 8,
                "y": 20
             },
             "id": 16,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_total)",
                   "legendFormat": "total"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_monitored_total)",
                   "legendFormat": "monitored"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_downloaded_total)",
                   "legendFormat": "complete"
                }
             ],
             "title": "Series",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "min": 0,
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 7,
                "w": 8,
                "x": 16,
                "y": 20
             },
             "id": 17,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(sonarr_series_filesize_bytes)",
                   "legendFormat": "series"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(radarr_movie_filesize_total)",
                   "legendFormat": "movies"
                }
             ],
             "title": "Library size",
             "type": "timeseries"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
