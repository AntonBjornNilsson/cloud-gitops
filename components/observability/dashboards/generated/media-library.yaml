             },
             "gridPos": {
                "h": 8,
                "w": 8,
                "x": 0,
                "y": 28
             },
             "id": 19,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(radarr_movie_downloaded_total)",
                   "legendFormat": "on disk"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(radarr_movie_monitored_total)",
                   "legendFormat": "monitored"
                },
                {
                   "datasource": {
                      "type": "prometheus",
