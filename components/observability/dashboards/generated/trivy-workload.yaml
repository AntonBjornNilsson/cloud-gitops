apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: trivy-workload
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Security"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Per-workload Trivy findings: images, packages to upgrade, CVEs, exposed secrets and failed config checks.",
       "links": [
          {
             "asDropdown": false,
             "includeVars": true,
             "keepTime": true,
             "tags": [
                "trivy"
             ],
             "title": "Trivy",
             "type": "dashboards"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Summary",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "dark-red",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (vuln_id) ((trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Critical\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Critical CVEs",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 4,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (vuln_id) ((trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"High\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "High CVEs",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "yellow",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 8,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (vuln_id) ((trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Medium\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Medium CVEs",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "CVEs without a vendor severity yet (usually very recent ones). Check the score column.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "text",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 12,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count(count by (vuln_id) ((trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Unknown\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Unknown CVEs",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "purple",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 16,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count((trivy_exposedsecrets_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Exposed secrets",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "green",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 1
                         }
                      ]
                   }
                }
             },
             "gridPos": {
                "h": 4,
                "w": 4,
                "x": 20,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(count((trivy_configaudits_info{namespace=~\"$namespace\", resource_name=~\"$workload\", config_audit_success=\"false\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) or vector(0)",
                   "instant": true
                }
             ],
             "title": "Failed config checks",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "One row per container image. Click a workload to narrow the dashboard to it.",
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "filterable": true
                   }
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Critical"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "dark-red",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "High"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "orange",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Medium"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "yellow",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Packages to bump"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "blue",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Secrets"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "text",
                                     "value": null
                                  },
                                  {
                                     "color": "purple",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Workload"
                      },
                      "properties": [
                         {
                            "id": "links",
                            "value": [
                               {
                                  "targetBlank": false,
                                  "title": "Workload drilldown",
                                  "url": "/d/trivy-workload/?var-namespace=${__data.fields.namespace}&var-workload=${__data.fields.resource_name}&var-container=All&var-severity=All&${inactive:queryparam}&${__url_time_range}"
                               }
                            ]
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Kind"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Critical"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "High"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Medium"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Unknown"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Secrets"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "OS"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "OS version"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 8,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 8,
             "options": {
                "cellHeight": "sm",
                "footer": {
                   "enablePagination": true
                },
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Critical"
                   }
                ]
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, vuln_id) (trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Critical\"})) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")) or 0 * count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) * on (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) group_left (image_os_family, image_os_name) max by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, image_os_family, image_os_name) (trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"})",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, vuln_id) (trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"High\"})) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")) or 0 * count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) * on (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) group_left (image_os_family, image_os_name) max by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, image_os_family, image_os_name) (trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"})",
                   "format": "table",
                   "instant": true,
                   "refId": "B"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, vuln_id) (trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Medium\"})) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")) or 0 * count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) * on (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) group_left (image_os_family, image_os_name) max by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, image_os_family, image_os_name) (trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"})",
                   "format": "table",
                   "instant": true,
                   "refId": "C"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, vuln_id) (trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=\"Unknown\"})) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")) or 0 * count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) * on (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) group_left (image_os_family, image_os_name) max by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, image_os_family, image_os_name) (trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"})",
                   "format": "table",
                   "instant": true,
                   "refId": "D"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "(count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, resource) (trivy_vulnerability_id{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\", severity=~\"$severity\"})) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\")) or 0 * count by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) ((trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"}) unless on (namespace, resource_name) label_replace(kube_replicaset_spec_replicas <= $inactive, \"resource_name\", \"$1\", \"replicaset\", \"(.*)\"))) * on (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag) group_left (image_os_family, image_os_name) max by (namespace, resource_kind, resource_name, container_name, image_registry, image_repository, image_tag, image_os_family, image_os_name) (trivy_image_info{namespace=~\"$namespace\", resource_name=~\"$workload\", container_name=~\"$container\"})",
                   "format": "table",
                   "instant": true,
                   "refId": "E"
                },
                {
                   "datasource": {
                      "type": "prometheus",
