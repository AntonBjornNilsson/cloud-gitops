apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: media-downloads
  namespace: grafana
  labels:
    app.kubernetes.io/managed-by: grafonnet
  annotations:
    # Grafana data links use ${...}; keep Flux from substituting them.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  allowCrossNamespaceImport: true
  folder: "Media"
  instanceSelector:
    matchLabels:
      dashboards: "grafana"
  json: |
    {
       "description": "Seerr requests, Prowlarr indexers, qBittorrent downloads and Cleanuparr.",
       "graphTooltip": 1,
       "links": [
          {
             "asDropdown": true,
             "includeVars": false,
             "keepTime": true,
             "tags": [
                "media"
             ],
             "title": "Media dashboards",
             "type": "dashboards"
          },
          {
             "icon": "dashboard",
             "keepTime": true,
             "title": "Services overview",
             "type": "link",
             "url": "/d/services-overview"
          }
       ],
       "panels": [
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 0
             },
             "id": 1,
             "title": "Overview",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "text",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "Bps"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 0,
                "y": 1
             },
             "id": 2,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(qbittorrent_global_download_speed_bytes)",
                   "legendFormat": ""
                }
             ],
             "title": "Download",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "text",
                            "value": null
                         },
                         {
                            "color": "blue",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "Bps"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 3,
                "y": 1
             },
             "id": 3,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(qbittorrent_global_upload_speed_bytes)",
                   "legendFormat": ""
                }
             ],
             "title": "Upload",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 6,
                "y": 1
             },
             "id": 4,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(qbittorrent_global_torrents)",
                   "legendFormat": ""
                }
             ],
             "title": "Torrents",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "text",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 9,
                "y": 1
             },
             "id": 5,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(qbittorrent_torrent_states{name=~\"downloading|forcedDL|metaDL|stalledDL|queuedDL|checkingDL\"}) or vector(0)",
                   "legendFormat": ""
                }
             ],
             "title": "Downloading",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "decimals": 2,
                   "thresholds": {
                      "steps": [
                         {
                            "color": "orange",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 12,
                "y": 1
             },
             "id": 6,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(qbittorrent_global_ratio)",
                   "legendFormat": ""
                }
             ],
             "title": "Global ratio",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "connected = incoming peers reach the VPN-forwarded port; firewalled = port forwarding is broken; disconnected = no tunnel.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "blue",
                            "value": null
                         }
                      ]
                   },
                   "unit": "short"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "connected"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "green",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "firewalled"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "orange",
                               "mode": "fixed"
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "disconnected"
                      },
                      "properties": [
                         {
                            "id": "color",
                            "value": {
                               "fixedColor": "red",
                               "mode": "fixed"
                            }
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 15,
                "y": 1
             },
             "id": 7,
             "options": {
                "colorMode": "background",
                "graphMode": "none",
                "textMode": "name"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (connection_status) (qbittorrent_transfer_connection_status) == 1",
                   "legendFormat": "{{connection_status}}"
                }
             ],
             "title": "Connection",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "orange",
                            "value": 100000000000
                         },
                         {
                            "color": "green",
                            "value": 500000000000
                         }
                      ]
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 18,
                "y": 1
             },
             "id": 8,
             "options": {
                "colorMode": "background",
                "graphMode": "area"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "min(qbittorrent_global_free_space_on_disk_bytes)",
                   "legendFormat": ""
                }
             ],
             "title": "Free disk",
             "type": "stat"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "Enabled Prowlarr indexers minus the ones Prowlarr has disabled after failures.",
             "fieldConfig": {
                "defaults": {
                   "color": {
                      "mode": "thresholds"
                   },
                   "thresholds": {
                      "steps": [
                         {
                            "color": "red",
                            "value": null
                         },
                         {
                            "color": "green",
                            "value": 1
                         }
                      ]
                   },
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 4,
                "w": 3,
                "x": 21,
                "y": 1
             },
             "id": 9,
             "options": {
                "colorMode": "background",
                "graphMode": "none"
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max(prowlarr_indexer_enabled_total) - (count(prowlarr_indexer_unavailable == 1) or vector(0))",
                   "legendFormat": ""
                }
             ],
             "title": "Indexers up",
             "type": "stat"
          },
          {
             "collapsed": false,
             "gridPos": {
                "h": 1,
                "w": 24,
                "x": 0,
                "y": 5
             },
             "id": 10,
             "title": "qBittorrent",
             "type": "row"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 10,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "unit": "Bps"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 0,
                "y": 6
             },
             "id": 11,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(qbittorrent_global_download_speed_bytes)",
                   "legendFormat": "download"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "-sum(qbittorrent_global_upload_speed_bytes)",
                   "legendFormat": "upload"
                }
             ],
             "title": "Transfer speed",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never",
                      "stacking": {
                         "mode": "normal"
                      }
                   },
                   "min": 0,
                   "unit": "short"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 12,
                "x": 12,
                "y": 6
             },
             "id": 12,
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "right"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum by (name) (qbittorrent_torrent_states) > 0",
                   "legendFormat": "{{name}}"
                }
             ],
             "title": "Torrents by state",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "description": "ETA is time to completion while downloading, or to the seeding limit (1 day / ratio 1.0) while seeding.",
             "fieldConfig": {
                "defaults": {
                   "noValue": "-"
                },
                "overrides": [
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Progress"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "percentunit"
                         },
                         {
                            "id": "custom.width",
                            "value": 160
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "mode": "lcd",
                               "type": "gauge",
                               "valueDisplayMode": "text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "blue",
                                     "value": null
                                  },
                                  {
                                     "color": "green",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Size"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "bytes"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Down"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "Bps"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Up"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "Bps"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Ratio"
                      },
                      "properties": [
                         {
                            "id": "decimals",
                            "value": 2
                         },
                         {
                            "id": "custom.width",
                            "value": 70
                         },
                         {
                            "id": "custom.cellOptions",
                            "value": {
                               "type": "color-text"
                            }
                         },
                         {
                            "id": "color",
                            "value": {
                               "mode": "thresholds"
                            }
                         },
                         {
                            "id": "thresholds",
                            "value": {
                               "mode": "absolute",
                               "steps": [
                                  {
                                     "color": "orange",
                                     "value": null
                                  },
                                  {
                                     "color": "green",
                                     "value": 1
                                  }
                               ]
                            }
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Seeds"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 70
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Peers"
                      },
                      "properties": [
                         {
                            "id": "custom.width",
                            "value": 70
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "ETA"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "s"
                         },
                         {
                            "id": "custom.width",
                            "value": 90
                         }
                      ]
                   },
                   {
                      "matcher": {
                         "id": "byName",
                         "options": "Added"
                      },
                      "properties": [
                         {
                            "id": "unit",
                            "value": "dateTimeFromNow"
                         },
                         {
                            "id": "custom.width",
                            "value": 110
                         }
                      ]
                   }
                ]
             },
             "gridPos": {
                "h": 9,
                "w": 24,
                "x": 0,
                "y": 14
             },
             "id": 13,
             "options": {
                "sortBy": [
                   {
                      "desc": true,
                      "displayName": "Added"
                   }
                ]
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_progress)",
                   "format": "table",
                   "instant": true,
                   "refId": "A"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_size_bytes)",
                   "format": "table",
                   "instant": true,
                   "refId": "B"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_download_speed_bytes)",
                   "format": "table",
                   "instant": true,
                   "refId": "C"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_upload_speed_bytes)",
                   "format": "table",
                   "instant": true,
                   "refId": "D"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_ratio)",
                   "format": "table",
                   "instant": true,
                   "refId": "E"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_seeders)",
                   "format": "table",
                   "instant": true,
                   "refId": "F"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_leechers)",
                   "format": "table",
                   "instant": true,
                   "refId": "G"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_eta) < 8640000",
                   "format": "table",
                   "instant": true,
                   "refId": "H"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "max by (name) (qbittorrent_torrent_added_on) * 1000",
                   "format": "table",
                   "instant": true,
                   "refId": "I"
                }
             ],
             "title": "Torrents",
             "transformations": [
                {
                   "id": "joinByField",
                   "options": {
                      "byField": "name",
                      "mode": "outer"
                   }
                },
                {
                   "id": "organize",
                   "options": {
                      "excludeByName": {
                         "Time": true,
                         "Time 1": true,
                         "Time 2": true,
                         "Time 3": true,
                         "Time 4": true,
                         "Time 5": true,
                         "Time 6": true,
                         "Time 7": true,
                         "Time 8": true,
                         "Time 9": true,
                         "__name__": true,
                         "cluster": true,
                         "container": true,
                         "endpoint": true,
                         "instance": true,
                         "job": true,
                         "namespace": true,
                         "pod": true,
                         "prometheus": true,
                         "service": true,
                         "url": true
                      },
                      "indexByName": { },
                      "renameByName": {
                         "Value #A": "Progress",
                         "Value #B": "Size",
                         "Value #C": "Down",
                         "Value #D": "Up",
                         "Value #E": "Ratio",
                         "Value #F": "Seeds",
                         "Value #G": "Peers",
                         "Value #H": "ETA",
                         "Value #I": "Added",
                         "name": "Name"
                      }
                   }
                }
             ],
             "type": "table"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
                   "custom": {
                      "drawStyle": "bars",
                      "fillOpacity": 60,
                      "gradientMode": "opacity",
                      "showPoints": "never"
                   },
                   "unit": "bytes"
                }
             },
             "gridPos": {
                "h": 8,
                "w": 8,
                "x": 0,
                "y": 23
             },
             "id": 14,
             "interval": "1d",
             "options": {
                "legend": {
                   "calcs": [
                      "lastNotNull",
                      "max"
                   ],
                   "displayMode": "table",
                   "placement": "bottom"
                },
                "tooltip": {
                   "mode": "multi",
                   "sort": "descending"
                }
             },
             "pluginVersion": "v11.0.0",
             "targets": [
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(qbittorrent_global_alltime_downloaded_bytes[1d]))",
                   "legendFormat": "downloaded"
                },
                {
                   "datasource": {
                      "type": "prometheus",
                      "uid": "VictoriaMetrics"
                   },
                   "expr": "sum(increase(qbittorrent_global_alltime_uploaded_bytes[1d]))",
                   "legendFormat": "uploaded"
                }
             ],
             "title": "Transferred per day",
             "type": "timeseries"
          },
          {
             "datasource": {
                "type": "datasource",
                "uid": "-- Mixed --"
             },
             "fieldConfig": {
                "defaults": {
