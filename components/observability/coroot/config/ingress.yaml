# Not the operator's spec.ingress: Kyverno adds TLS and Authelia to this one,
# and the operator would delete an Ingress named like the CR ("coroot").
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: coroot-web
  namespace: coroot
spec:
  rules:
    - host: coroot.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: coroot-coroot
                port:
                  number: 8080
