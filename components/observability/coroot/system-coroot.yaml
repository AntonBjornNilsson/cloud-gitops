apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-coroot
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/observability/coroot
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-kyverno-config
    - name: system-truenas-csi
  retryInterval: 1m0s
  timeout: 5m0s
  # Not wait: this Kustomization also creates system-coroot-config, which
  # depends on it. The health check still holds the config back until the
  # operator (and its CRD) is installed.
  wait: false
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: coroot-operator
      namespace: coroot
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
