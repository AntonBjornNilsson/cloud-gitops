apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-coroot-config
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/observability/coroot/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-coroot
    - name: system-traefik
  retryInterval: 1m0s
  timeout: 5m0s
  # The Coroot CR has no Ready condition; check pods instead
  wait: false
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
