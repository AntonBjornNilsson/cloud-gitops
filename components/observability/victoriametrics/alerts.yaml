apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: homelab-alerts
  namespace: victoriametrics
spec:
  groups:
    - name: node-health
      rules:
        - alert: NodeNotReady
          expr: kube_node_status_condition{condition="Ready",status="true"} == 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Node {{ $labels.node }} is not ready"
            description: "Node {{ $labels.node }} has been in unready state for more than 5 minutes."

        - alert: NodeDiskRunningFull
          expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Node root filesystem low on disk space"
            description: "Node {{ $labels.instance }} has less than 15% free disk space on root."

        - alert: NodeHighMemoryUsage
          expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "High memory utilization on {{ $labels.instance }}"
            description: "Memory usage has been above 90% for more than 15 minutes."

    - name: workload-health
      rules:
        - alert: PodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total[10m]) > 2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash looping"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} has restarted {{ $value }} times in 10 minutes."

        - alert: PodNotReady
          expr: kube_pod_status_phase{phase=~"Pending|Unknown"} == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} not ready"
            description: "Pod has been in Pending or Unknown state for over 15 minutes."

    - name: storage-and-ingress
      rules:
        - alert: LonghornVolumeDegraded
          expr: longhorn_volume_robustness{robustness="degraded"} == 1
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Longhorn volume {{ $labels.volume }} degraded"
            description: "Volume {{ $labels.volume }} robustness is degraded."

        - alert: TraefikHigh5xxErrorRate
          expr: sum(rate(traefik_service_requests_total{code=~"5.."}[5m])) / sum(rate(traefik_service_requests_total[5m])) * 100 > 5
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Traefik high 5xx error rate"
            description: "Traefik HTTP 5xx error rate exceeds 5% of total traffic over the past 5 minutes."
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMAlertmanagerConfig
metadata:
  name: ntfy-notifications
  namespace: victoriametrics
spec:
  route:
    receiver: ntfy
    group_by:
      - alertname
      - cluster
      - namespace
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
  receivers:
    - name: ntfy
      webhook_configs:
        - url: http://alertmanager-ntfy.victoriametrics.svc.cluster.local:8080
          send_resolved: true
