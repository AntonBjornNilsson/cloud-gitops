---
# Disk S.M.A.R.T. data from the smartctl-exporter DaemonSet (smartctl-exporter.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: smartctl-exporter
  namespace: victoriametrics
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prometheus-smartctl-exporter
  podMetricsEndpoints:
    - port: http
      interval: 60s
      scrapeTimeout: 30s
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
