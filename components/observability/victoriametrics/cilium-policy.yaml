apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoriametrics
  namespace: victoriametrics
spec:
  endpointSelector: {}
  ingress:
    # Query endpoints (Grafana) and OTLP trace ingestion (Traefik, apps):
    # 8428 VictoriaMetrics, 9428 VictoriaLogs, 10428 VictoriaTraces,
    # 9093 Alertmanager
    - fromEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "8428"
              protocol: TCP
            - port: "9090"
              protocol: TCP
            - port: "9093"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "10428"
              protocol: TCP
    # VictoriaMetrics operator admission webhook, called by the API server
    # (reaches the pod via konnectivity-agent on k0s)
    - fromEntities:
        - kube-apiserver
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Intra-namespace component traffic (vmagent, vmalert, vmalertmanager, grafana, node-exporter)
    - fromEndpoints:
        - {}
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server (operator, kube-state-metrics)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Intra-namespace communication
    - toEndpoints:
        - {}
    # Scraping metrics across cluster workloads and nodes
    - toEntities:
        - cluster
        - host
        - remote-node
    # External alertmanager webhooks, notifications, or OIDC auth
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # Blackbox DNS probes against public resolvers
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Blackbox ICMP probes (internet latency / packet loss)
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
