---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: hardware
  namespace: victoriametrics
spec:
  groups:
    - name: temperatures
      rules:
        - alert: HardwareTemperatureHigh
          expr: |
            node_hwmon_temp_celsius
            > on(instance, chip, sensor) group_left()
            (node_hwmon_temp_crit_celsius > 0) - 10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.instance }} is {{ $value }}°C"
            description: "Within 10°C of the sensor's critical threshold for 10 minutes. Check cooling."
        - alert: HardwareTemperatureCritical
          expr: node_hwmon_temp_crit_alarm_celsius == 1
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.chip }}/{{ $labels.sensor }} on {{ $labels.instance }} raised its critical temperature alarm"

    - name: gpu
      rules:
        - alert: GPUNotAllocatable
          expr: (sum(kube_node_status_allocatable{resource="amd_com_gpu"}) or vector(0)) < 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "No AMD GPU is advertised to Kubernetes"
            description: "The amdgpu device plugin is down or the GPU disappeared; GPU workloads (Ollama, Jellyfin transcoding) cannot schedule."

    # S.M.A.R.T. (smartctl-exporter)
    - name: disks
      rules:
        - alert: DiskSmartStatusFailed
          expr: smartctl_device_smart_status != 1
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} failed its SMART self-assessment"
            description: "Replace the disk; move data off it."
        - alert: DiskMediaErrors
          expr: smartctl_device_media_errors != 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} reports {{ $value }} media errors"
        - alert: DiskCriticalWarning
          expr: smartctl_device_critical_warning != 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} has a controller critical warning"
        - alert: DiskSpareLow
          expr: smartctl_device_available_spare < smartctl_device_available_spare_threshold
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} is below its available-spare threshold"
        - alert: DiskWearHigh
          expr: smartctl_device_percentage_used > 80
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} has used {{ $value }}% of its rated endurance"
        - alert: DiskTemperatureHigh
          expr: smartctl_device_temperature{temperature_type="current"} > 65
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Disk {{ $labels.device }} on {{ $labels.node }} is {{ $value }}°C"
        - alert: SmartctlExporterNoDevices
          expr: (count(smartctl_device) or vector(0)) == 0
          for: 30m
          labels:
            severity: info
          annotations:
            summary: "smartctl-exporter sees no disks"
            description: "Disk health is not being monitored."
