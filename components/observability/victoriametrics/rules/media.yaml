---
# Media apps with their own exporters (Dispatcharr: dispatcharr-exporter plugin).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: media
  namespace: victoriametrics
spec:
  groups:
    - name: dispatcharr
      rules:
        - alert: DispatcharrExporterDown
          expr: absent_over_time(dispatcharr_info[15m])
          labels:
            severity: warning
          annotations:
            summary: "No Dispatcharr metrics for 15 minutes"
            description: "The dispatcharr-exporter plugin is not serving on port 9192. Check that the plugin is enabled with Auto-start Server in the Dispatcharr UI, and that the dispatcharr-web pod is Ready."
        - alert: DispatcharrProviderExpiring
          expr: dispatcharr_profile_days_to_expiry >= 0 and dispatcharr_profile_days_to_expiry < 14
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "IPTV provider {{ $labels.account_name }} expires in {{ $value }} days"
            description: "M3U profile {{ $labels.profile_name }} of account {{ $labels.account_name }} expires soon. Renew the subscription."
        - alert: DispatcharrM3UAccountError
          expr: dispatcharr_m3u_account_status{status="error"} > 0
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "{{ $value }} Dispatcharr M3U account(s) in error state"
            description: "An M3U refresh failed and has not recovered for 30 minutes. Check the account in Dispatcharr (M3U & EPG Manager) and the celery container logs."
        - alert: DispatcharrStreamOnFallback
          expr: dispatcharr_stream_index{type="live"} > 0
          for: 10m
          labels:
            severity: info
          annotations:
            summary: "Channel {{ $labels.channel_number }} is playing a fallback stream"
            description: "The primary stream of channel {{ $labels.channel_number }} failed and Dispatcharr switched to backup stream #{{ $value }}."
        - alert: DispatcharrProviderConnectionsExhausted
          expr: dispatcharr_profile_max_connections > 0 and dispatcharr_profile_connections >= dispatcharr_profile_max_connections
          for: 5m
          labels:
            severity: info
          annotations:
            summary: "Provider {{ $labels.account_name }} has no free connections"
            description: "Profile {{ $labels.profile_name }} uses all of its {{ $value }} connections; new channels on this provider cannot start."
    - name: media-exporters
      rules:
        - alert: MediaExporterDown
          expr: up{job="victoriametrics/media-exporters"} == 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app }} exporter is down"
            description: "The {{ $labels.app }}-exporter Deployment in namespace {{ $labels.namespace }} has not answered scrapes for 15 minutes; its dashboard panels are stale."
        - alert: ArrHealthError
          expr: '{__name__=~"(sonarr|radarr|prowlarr|bazarr)_system_health_issues", type="error"} > 0'
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.app }} health check failing: {{ $labels.source }}"
            description: "{{ $labels.message }}"
        - alert: ProwlarrIndexerDisabled
          expr: prowlarr_indexer_unavailable == 1
          for: 12h
          labels:
            severity: info
          annotations:
            summary: "Prowlarr indexer {{ $labels.indexer }} is disabled after failures"
            description: "Prowlarr stopped using {{ $labels.indexer }} because it kept failing. Test it in Prowlarr (Indexers) or replace it."
        - alert: QBittorrentNotConnected
          expr: max by (connection_status) (qbittorrent_transfer_connection_status{connection_status!="connected"}) == 1
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "qBittorrent is {{ $labels.connection_status }}"
            description: "firewalled = peers cannot reach the VPN-forwarded port (check the port-forward-sync container); disconnected = no network through the tunnel (check gluetun)."
        - alert: JellyfinScheduledTaskFailed
          expr: jellyfin_tasks_last_run_status{status="Failed"} == 1
          labels:
            severity: info
          annotations:
            summary: "Jellyfin task \"{{ $labels.task_name }}\" failed"
            description: "The last run of the scheduled task {{ $labels.task_name }} ({{ $labels.category }}) failed. See Dashboard > Scheduled Tasks in Jellyfin."
