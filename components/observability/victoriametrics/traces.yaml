---
# VictoriaTraces: persistent trace store. Ingests OTLP/HTTP at
# :10428/insert/opentelemetry/v1/traces (Traefik sends here) and serves the
# Jaeger query API at :10428/select/jaeger (Grafana "VictoriaTraces" datasource).
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces
  namespace: victoriametrics
spec:
  retentionPeriod: "7d"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 1Gi
