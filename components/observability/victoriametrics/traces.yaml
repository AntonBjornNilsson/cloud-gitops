---
# VictoriaTraces: persistent trace store. Ingests OTLP/HTTP at
# :10428/insert/opentelemetry/v1/traces (Traefik sends here) and serves the
# Jaeger query API at :10428/select/jaeger (Grafana "VictoriaTraces" datasource).
apiVersion: operator.victoriametrics.com/v1
kind: VTSingle
metadata:
  name: traces
  namespace: victoriametrics
spec:
  # Operator's restricted profile: 65534, fsGroup, seccomp, drop ALL, read-only root
  useStrictSecurity: true
  retentionPeriod: "7d"
  # Data on the NAS PVC vtsingle-traces-nas. With storageDataPath set the operator ignores
  # `storage`; the PVC it made from it (vtsingle-traces, Longhorn) is the rollback
  # until Longhorn is removed, then drop `storage` and delete that PVC.
  storageDataPath: /victoria-traces-data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: vtsingle-traces-nas
  volumeMounts:
    - name: data
      mountPath: /victoria-traces-data
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 10Gi
  resources:
    requests:
      cpu: 20m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 1Gi
---
# VictoriaTraces data on the NAS (truenas-csi), mounted at storageDataPath
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vtsingle-traces-nas
  namespace: victoriametrics
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: nas-iscsi
  resources:
    requests:
      storage: 10Gi
