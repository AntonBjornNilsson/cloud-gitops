---
# VictoriaLogs: central log store, queried from Grafana (VictoriaLogs datasource)
# and by vmalert for log-based alert rules.
apiVersion: operator.victoriametrics.com/v1
kind: VLSingle
metadata:
  name: logs
  namespace: victoriametrics
spec:
  # Operator's restricted profile: 65534, fsGroup, seccomp, drop ALL, read-only root
  useStrictSecurity: true
  retentionPeriod: "14d"
  storage:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 20Gi
  resources:
    requests:
      cpu: 50m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 2Gi
---
# Per-node collector shipping every container's logs (with pod/namespace/
# container metadata) to VictoriaLogs.
apiVersion: operator.victoriametrics.com/v1
kind: VLAgent
metadata:
  name: logs
  namespace: victoriametrics
spec:
  k8sCollector:
    enabled: true
  remoteWrite:
    - url: http://vlsingle-logs.victoriametrics.svc.cluster.local:9428/insert/native
  # Run on every node, including tainted ones (e.g. the GPU node)
  tolerations:
    - operator: Exists
  # Root: reads the node's root-owned container logs and keeps its position in a
  # hostPath (allowlisted in the Kyverno restricted policies). Root needs no
  # capabilities for its own files, so all are dropped.
  securityContext:
    runAsNonRoot: false
    runAsUser: 0
    seccompProfile:
      type: RuntimeDefault
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
  resources:
    requests:
      cpu: 20m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 512Mi
