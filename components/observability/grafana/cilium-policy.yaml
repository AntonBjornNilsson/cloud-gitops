apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
  namespace: grafana
spec:
  endpointSelector: {}
  ingress:
    # Web UI traffic from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
          rules:
            http: [{}]
    # Metrics scraping by vmagent (Grafana 3000, operator 9090)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
            - port: "9090"
              protocol: TCP
    # Intra-namespace traffic (operator talking to grafana, etc.)
    - fromEndpoints:
        - {}
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API Server (operator)
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Intra-namespace communication
    - toEndpoints:
        - {}
    # Datasources: VictoriaMetrics, VictoriaLogs, VictoriaTraces, Alertmanager
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "10428"
              protocol: TCP
            - port: "9093"
              protocol: TCP
          rules:
            http: [{}]
    # OIDC token exchange with Authelia via the public auth hostname. It
    # resolves to the Traefik LoadBalancer IP, which Cilium translates to the
    # Traefik pod, so the policy sees the container ports, not 80/443.
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
            app.kubernetes.io/name: traefik
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
            - port: "8443"
              protocol: TCP
    # External resources (plugins, grafana.com dashboards)
    - toEntities:
        - world
        - cluster
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
