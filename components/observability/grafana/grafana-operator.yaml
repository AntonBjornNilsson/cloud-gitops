---
apiVersion: v1
kind: Namespace
metadata:
  name: grafana
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana-operator
  namespace: grafana
spec:
  type: oci
  interval: 24h
  url: oci://ghcr.io/grafana/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana-operator
  namespace: grafana
spec:
  interval: 12h
  chart:
    spec:
      chart: grafana-operator
      version: "5.25.0"
      sourceRef:
        kind: HelmRepository
        name: grafana-operator
        namespace: grafana
      interval: 12h
  timeout: 5m
