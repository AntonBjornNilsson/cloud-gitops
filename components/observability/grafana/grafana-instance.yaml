---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: "grafana"
spec:
  persistentVolumeClaim:
    metadata:
      labels:
        backup.longhorn.io/enabled: "true"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  # The operator only creates the PVC; mount it in place of the default
  # emptyDir "grafana-data" volume. Recreate avoids RWO multi-attach on
  # rollout, fsGroup matches the operator's runAsGroup so Grafana can write.
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 10001
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  preferences:
    homeDashboardUid: homelab-overview
  config:
    server:
      root_url: "https://grafana.${domain}"
    plugins:
      preinstall_sync: "victoriametrics-logs-datasource@0.32.0"
      # Don't auto-update bundled plugins (zipkin, elasticsearch, ...); their
      # directory is read-only in the image, so every update attempt fails.
      preinstall_auto_update: "false"
    auth:
      signout_redirect_url: "${victoriametrics_auth_redirect_url}"
      # Link logins to existing accounts by email (Authelia is the only IdP and
      # manage_users.py in the secrets repo refuses duplicate emails)
      oauth_allow_insecure_email_lookup: "true"
    "auth.generic_oauth":
      name: "authelia"
      enabled: "true"
      auto_login: "true"
      client_id: "${victoriametrics_client_id}"
      client_secret: "${victoriametrics_client_secret}"
      scopes: "openid profile email groups"
      auth_url: "${victoriametrics_auth_url}"
      token_url: "${victoriametrics_token_url}"
      api_url: "${victoriametrics_api_url}"
      # admin -> Admin, grafana-edit -> Editor, grafana-read -> Viewer; anyone else is refused
      role_attribute_path: "contains(groups, 'admin') && 'Admin' || contains(groups, 'grafana-edit') && 'Editor' || contains(groups, 'grafana-read') && 'Viewer'"
      role_attribute_strict: "true"
  ingress:
    metadata:
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: "Grafana"
        gethomepage.dev/description: "Monitoring & Metrics"
        gethomepage.dev/group: "Observability"
        gethomepage.dev/icon: "grafana.png"
        # Homepage looks for app.kubernetes.io/name=<ingress> by default
        gethomepage.dev/pod-selector: "app=grafana"
        # admin/stats needs a Grafana server admin (service accounts can't be);
        # alerts live in Alertmanager (Cluster Health card), so stats only
        gethomepage.dev/widget.type: "grafana"
        gethomepage.dev/widget.version: "2"
        gethomepage.dev/widget.url: "http://grafana-service.grafana.svc.cluster.local:3000"
        gethomepage.dev/widget.username: "{{HOMEPAGE_VAR_GRAFANA_USER}}"
        gethomepage.dev/widget.password: "{{HOMEPAGE_VAR_GRAFANA_PASSWORD}}"
        gethomepage.dev/widget.fields: '["dashboards", "datasources"]'
    spec:
      ingressClassName: traefik
      rules:
        - host: grafana.${domain}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
