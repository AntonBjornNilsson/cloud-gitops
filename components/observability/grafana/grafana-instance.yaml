---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    dashboards: "grafana"
spec:
  persistentVolumeClaim:
    metadata:
      labels:
        backup.longhorn.io/enabled: "true"
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 5Gi
  # The operator only creates the PVC; mount it in place of the default
  # emptyDir "grafana-data" volume. Recreate avoids RWO multi-attach on
  # rollout, fsGroup matches the operator's runAsGroup so Grafana can write.
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          securityContext:
            fsGroup: 10001
          volumes:
            - name: grafana-data
              persistentVolumeClaim:
                claimName: grafana-pvc
  preferences:
    homeDashboardUid: homelab-overview
  config:
    server:
      root_url: "https://grafana.${domain}"
    auth:
      signout_redirect_url: "${victoriametrics_auth_redirect_url}"
      oauth_auto_login: "true"
    "auth.generic_oauth":
      name: "authelia"
      enabled: "true"
      client_id: "${victoriametrics_client_id}"
      client_secret: "${victoriametrics_client_secret}"
      scopes: "openid profile email groups"
      auth_url: "${victoriametrics_auth_url}"
      token_url: "${victoriametrics_token_url}"
      api_url: "${victoriametrics_api_url}"
      role_attribute_path: "contains(groups, 'Grafana Admins') && 'Admin' || contains(groups, 'Grafana Editors') && 'Editor' || 'Viewer'"
  ingress:
    metadata:
      annotations:
        kubernetes.io/ingress.class: traefik
    spec:
      ingressClassName: traefik
      rules:
        - host: grafana.${domain}
          http:
            paths:
              - path: /
                pathType: Prefix
                backend:
                  service:
                    name: grafana-service
                    port:
                      number: 3000
