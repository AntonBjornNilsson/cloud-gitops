apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-pyroscope
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/observability/pyroscope
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    # Alloy's privileged/hostPID exceptions must exist before the DaemonSet
    - name: system-kyverno-config
    - name: system-truenas-csi
  retryInterval: 1m0s
  timeout: 10m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
