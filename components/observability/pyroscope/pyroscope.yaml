# Grafana Pyroscope: continuous profiling. Single binary (monolithic mode),
# data on a NAS volume, 14 days retention. No UI of its own: browse profiles in
# Grafana (Drilldown -> Profiles, datasource "Pyroscope").
#
# Profiles come from the Alloy DaemonSet in alloy.yaml:
# - eBPF CPU profiles of every container on every node (no app changes);
# - pprof pull (memory, goroutines, mutex, block) from pods that opt in with
#   annotations, see alloy.yaml.
---
apiVersion: v1
kind: Namespace
metadata:
  name: pyroscope
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: pyroscope
spec:
  interval: 12h
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pyroscope
  namespace: pyroscope
spec:
  interval: 30m
  chart:
    spec:
      chart: pyroscope
      version: "2.x"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: pyroscope
      interval: 12h
  timeout: 10m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
    remediation:
      retries: 3
  values:
    # The bundled Alloy is a StatefulSet that only pulls pprof; ours (alloy.yaml)
    # is a DaemonSet that also does eBPF.
    alloy:
      enabled: false
    pyroscope:
      extraArgs:
        log.level: info
        # Egress to the internet is denied; the reports only produced drops
        usage-stats.enabled: "false"
      structuredConfig:
        limits:
          retention_period: 14d
      # Opt in to Alloy's pprof pull (alloy.yaml); CPU comes from eBPF. The
      # chart's per-profile-type annotations are for its bundled Alloy.
      podAnnotations:
        profiles.grafana.com/scrape: "true"
        profiles.grafana.com/port_name: http2
        profiles.grafana.com/memory.scrape: null
        profiles.grafana.com/memory.port_name: null
        profiles.grafana.com/cpu.scrape: null
        profiles.grafana.com/cpu.port_name: null
        profiles.grafana.com/goroutine.scrape: null
        profiles.grafana.com/goroutine.port_name: null
      # Root filesystem is read-only; data and metastore are on the PVC
      extraVolumes:
        - name: tmp
          emptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: /tmp
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          cpu: "1"
          memory: 1Gi
      persistence:
        enabled: true
        storageClassName: nas-iscsi
        size: 20Gi
