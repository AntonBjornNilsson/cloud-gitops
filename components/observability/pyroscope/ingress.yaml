# Pyroscope's own UI (flame graphs, diff view). It has no login: Authelia
# forward-auth (added by Kyverno) guards it, and only group:admin can reach
# the host (no access_control rule of its own).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pyroscope
  namespace: pyroscope
spec:
  rules:
    - host: pyroscope.${domain}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pyroscope
                port:
                  number: 4040
