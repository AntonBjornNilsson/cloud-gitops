apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: jaeger
  namespace: jaeger
spec:
  endpointSelector: {}
  ingress:
    # Query UI from Traefik and cluster clients
    - fromEntities:
        - cluster
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "16686"
              protocol: TCP
    # Trace ingestion from cluster services (OTLP gRPC/HTTP, Jaeger Thrift, Zipkin)
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "4317"
              protocol: TCP
            - port: "4318"
              protocol: TCP
            - port: "14268"
              protocol: TCP
            - port: "6831"
              protocol: UDP
    # Intra-namespace communication (Cassandra cluster, Collector -> Cassandra, Query -> Cassandra)
    - fromEndpoints:
        - {}
    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Intra-namespace communication
    - toEndpoints:
        - {}
