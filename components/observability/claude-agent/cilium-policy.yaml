apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: claude-agent
  namespace: claude-agent
spec:
  endpointSelector: {}
  ingress:
    # Intra-namespace
    - fromEndpoints:
        - {}
    # In-cluster probes (blackbox exporter) to the service
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Web ingress from Traefik
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: traefik
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP

    # Health checks and probes
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server for cluster discovery, logs, and events
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Anthropic, GitHub and GHCR APIs
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
            - port: "80"
              protocol: TCP
    # Intra-namespace
    - toEndpoints:
        - {}
    # VictoriaMetrics cluster metrics access
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
    # ntfy notifications and questions
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: ntfy
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP

