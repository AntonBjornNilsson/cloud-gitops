apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: claude-agent
resources:
  - deployment.yaml
  - cilium-policy.yaml
  - secret.yaml
  - serviceaccount.yaml
  - clusterrolebinding.yaml
# Service code as real files; the hash suffix rolls the Deployment when they change.
# Flux substitution is off for it: TypeScript template literals look like ${vars}.
configMapGenerator:
  - name: claude-agent-app
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - app/server.ts
      - app/agent.ts
      - app/publisher.ts
      - app/policy.ts
      - app/questions.ts
      - app/store.ts
      - app/ntfy.ts
      - app/cron.ts
      - app/meta.ts
      - app/updater.ts
      - app/rules.md
      - app/health.md
      - app/index.html
      - app/app.js
      - app/app.css
      - app/favicon.svg
      - app/manifest.webmanifest
