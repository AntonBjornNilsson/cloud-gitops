apiVersion: v1
kind: Secret
metadata:
  name: claude-agent
  namespace: claude-agent
type: Opaque
stringData:
  # Long-lived Claude subscription token from `claude setup-token`
  oauth-token: "${claude_code_oauth_token}"
---
# GitHub App the publisher sidecar acts as (mounted only there, never in the Claude container).
# It is not in the main ruleset's bypass list, so its PRs can only be merged once the required checks pass.
apiVersion: v1
kind: Secret
metadata:
  name: claude-agent-github-app
  namespace: claude-agent
type: Opaque
# All base64 in "data": Flux substitution would turn the numeric IDs into numbers, which stringData rejects
data:
  app-id: "${github_app_id_b64}"
  installation-id: "${github_app_installation_id_b64}"
  private-key: "${github_app_private_key_b64}"
---
# Write-only ntfy token for the claude-agent topic (see ntfy server.yml)
apiVersion: v1
kind: Secret
metadata:
  name: claude-agent-ntfy-token
  namespace: claude-agent
type: Opaque
stringData:
  token: "${ntfy_alertmanager_token}"
