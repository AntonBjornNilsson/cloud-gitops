apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-node-sysctls
  namespace: flux-system
spec:
  interval: 12h
  path: ./components/hardware/node-sysctls
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions