# ==============================================================================
# AWS Secret Template (Reference for cloud-gitops-secrets)
# ==============================================================================
# Place these secrets into the cloud-gitops-secrets repository or SOPS-encrypted
# Secret manifests in the cluster under the respective namespaces.
# ==============================================================================
#
# 1. AWS Credentials for ACK Controllers (ack-iam-controller & ack-s3-controller)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: ack-aws-credentials
#   namespace: ack-system
# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "your-ack-controller-aws-access-key-id"
#   AWS_SECRET_ACCESS_KEY: "your-ack-controller-aws-secret-access-key"
# ---
# 2. Longhorn Backup S3 Secret (when Longhorn uses static AWS credentials)
# apiVersion: v1
# kind: Secret
# metadata:
#   name: longhorn-aws-s3-credentials
#   namespace: longhorn-system
# type: Opaque
# stringData:
#   AWS_ACCESS_KEY_ID: "your-longhorn-backup-user-access-key-id"
#   AWS_SECRET_ACCESS_KEY: "your-longhorn-backup-user-secret-access-key"
#   AWS_ENDPOINTS: "https://s3.${aws_region}.amazonaws.com"
