---
apiVersion: v1
kind: Namespace
metadata:
  name: ack-system
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    app.kubernetes.io/part-of: ack
---
# ==============================================================================
# AWS IAM Controller (ACK)
# ==============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ack-iam-chart
  namespace: ack-system
spec:
  interval: 24h
  url: oci://public.ecr.aws/aws-controllers-k8s/iam-chart
  ref:
    semver: "1.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-iam-controller
  namespace: ack-system
spec:
  interval: 1h
  timeout: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: ack-iam-chart
  values:
    aws:
      region: ${aws_region}
      credentials:
        secretName: ack-aws-credentials
    installScope: cluster
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
---
# ==============================================================================
# AWS S3 Controller (ACK)
# ==============================================================================
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: ack-s3-chart
  namespace: ack-system
spec:
  interval: 24h
  url: oci://public.ecr.aws/aws-controllers-k8s/s3-chart
  ref:
    semver: "1.x"
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ack-s3-controller
  namespace: ack-system
spec:
  interval: 1h
  timeout: 5m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  chartRef:
    kind: OCIRepository
    name: ack-s3-chart
  values:
    aws:
      region: ${aws_region}
      credentials:
        secretName: ack-aws-credentials
    installScope: cluster
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi
