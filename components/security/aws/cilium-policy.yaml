apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ack-controllers
  namespace: ack-system
spec:
  endpointSelector: {}
  ingress:
    # Health checks and Prometheus metrics scraping
    - fromEntities:
        - host
        - remote-node
        - health
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # 1. Cluster DNS resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # 2. Kubernetes API Server communication
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # 3. AWS Global and Regional API Endpoints (STS, IAM, S3 via HTTPS)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
