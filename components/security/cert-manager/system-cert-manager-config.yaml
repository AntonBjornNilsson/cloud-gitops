apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-cert-manager-config
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/security/cert-manager/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-cert-manager
    - name: secrets-kustomization
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions