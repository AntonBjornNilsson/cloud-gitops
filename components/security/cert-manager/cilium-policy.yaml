apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cert-manager
  namespace: cert-manager
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  ingress:
    # Webhook server called by kube-apiserver and internal cert-manager controller
    - fromEntities:
        - kube-apiserver
        - host
        - remote-node
        - cluster
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
    # Health checks and metrics
    - fromEntities:
        - host
        - remote-node
        - health
        - cluster
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
            - port: "6080"
              protocol: TCP
  egress:
    # DNS resolution (internal CoreDNS and external DNS01 recursive servers like 8.8.8.8, 1.1.1.1)
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # ACME validation and CA endpoints (Let's Encrypt, Cloudflare, etc.)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
            - port: "443"
              protocol: TCP
    # Internal communication to webhook
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: webhook
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
