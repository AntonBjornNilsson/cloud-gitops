---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 24h
  url: https://charts.authelia.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 12h
  chart:
    spec:
      chart: authelia
      version: "0.11.22"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia
      interval: 12h
  timeout: 3m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      extraVolumes:
        - name: users-database
          secret:
            secretName: authelia-users
            items:
              - key: users_database.yml
                path: users_database.yml
      extraVolumeMounts:
        - name: users-database
          mountPath: /etc/authelia
          readOnly: true
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi
      annotations:
        backup.longhorn.io/enabled: "true"
    secret:
      additionalSecrets:
        authelia-jwks:
          path: jwks
          items:
            - key: key.pem
              path: key.pem
    ingress:
      enabled: true
      className: traefik
      labels:
        enable-oauth: "false"
      annotations:
        cert-manager.io/cluster-issuer: cloudflare-wildcard-issuer
        traefik.ingress.kubernetes.io/router.middlewares: ""
        # Internet-facing: also served on the tunnel entrypoint
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
    configMap:
      theme: dark
      # Prometheus metrics on :9959 (scraped by vmagent, see
      # observability/victoriametrics/scrapes/authelia.yaml)
      telemetry:
        metrics:
          enabled: true
      totp:
        issuer: "Authelia"
      ntp:
        disable_startup_check: true
        disable_failure: true
      notifier:
        filesystem:
          enabled: true
          filename: "/config/notification.txt"
      authentication_backend:
        file:
          enabled: true
          path: "/etc/authelia/users_database.yml"
          # Reload users when the authelia-users Secret changes
          watch: true
      access_control:
        default_policy: "one_factor"
      session:
        name: authelia_session
        same_site: "lax"
        expiration: "8 hour"
        inactivity: "5 minutes"
        remember_me: "1 month"
        encryption_key:
          value: "${authelia_session_secret}"
        cookies:
          - domain: "${domain}"
            subdomain: "auth"
          - domain: "${auth_domain}"
            subdomain: "auth"
      storage:
        encryption_key:
          value: "${authelia_storage_encryption_key}"
        local:
          enabled: true
          path: "/config/db.sqlite3"
      identity_validation:
        reset_password:
          secret:
            value: "${authelia_jwt_secret}"
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            value: "${authelia_oidc_hmac_secret}"
          cors:
            allowed_origins_from_client_redirect_uris: true
          jwks:
            - key_id: default
              algorithm: RS256
              use: sig
              key:
                path: "/secrets/jwks/key.pem"
          claims_policies:
            k8s:
              id_token:
                - groups
                - preferred_username
                - email
              id_token_audience_mode: 'experimental-merged'
          clients:
            - client_id: grafana
              client_name: Grafana
              client_secret:
                value: "${authelia_victoriametrics_client_secret_hash}"
              public: false
              authorization_policy: one_factor
              consent_mode: implicit
              redirect_uris:
                - "https://grafana.${domain}/login/generic_oauth"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: headlamp
              client_name: Headlamp
              client_secret:
                value: "${authelia_headlamp_client_secret_hash}"
              public: false
              authorization_policy: one_factor
              consent_mode: implicit
              claims_policy: k8s
              audience:
                - k8s-cluster
              requested_audience_mode: implicit
              redirect_uris:
                - "https://headlamp.${domain}/oidc-callback"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: open-webui
              client_name: Open WebUI
              client_secret:
                value: "${authelia_open_webui_client_secret_hash}"
              public: false
              authorization_policy: one_factor
              consent_mode: implicit
              redirect_uris:
                - "https://ai.${domain}/oauth/oidc/callback"
              scopes:
                - openid
                - profile
                - email
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: homepage
              client_name: Homepage
              client_secret:
                value: "${authelia_homepage_client_secret_hash}"
              public: false
              authorization_policy: one_factor
              consent_mode: implicit
              redirect_uris:
                - "https://homepage.${domain}/api/auth/callback/homepage-oidc"
                - "https://homepage.${domain}/api/auth/callback/oidc"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            # Tailscale custom OIDC sign-in (WebFinger in webfinger.yaml)
            - client_id: tailscale
              client_name: Tailscale
              client_secret:
                value: "${authelia_tailscale_client_secret_hash}"
              public: false
              authorization_policy: one_factor
              consent_mode: implicit
              require_pkce: false
              redirect_uris:
                - "https://login.tailscale.com/a/oauth_response"
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              access_token_signed_response_alg: none
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_basic

            - client_id: k8s-cluster
              client_name: Kubernetes Cluster
              public: true
              authorization_policy: one_factor
              consent_mode: implicit
              claims_policy: k8s
              redirect_uris:
                - "http://localhost:8000"
                - "http://localhost:18000"
                - "http://127.0.0.1:8000"
                - "http://127.0.0.1:18000"
                - "https://headlamp.${domain}/oidc-callback"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forward-auth
  namespace: authelia
spec:
  forwardAuth:
    address: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    # Authelia answers with a few KB; cap it so a misbehaving backend can't exhaust memory
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forward-auth
  namespace: traefik
spec:
  forwardAuth:
    address: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    # Authelia answers with a few KB; cap it so a misbehaving backend can't exhaust memory
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
