---
apiVersion: v1
kind: Namespace
metadata:
  name: authelia
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 24h
  url: https://charts.authelia.com
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authelia
  namespace: authelia
spec:
  interval: 12h
  chart:
    spec:
      chart: authelia
      version: "0.11.22"
      sourceRef:
        kind: HelmRepository
        name: authelia
        namespace: authelia
      interval: 12h
  timeout: 3m
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 2m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 3m
  values:
    pod:
      kind: Deployment
      replicas: 1
      strategy:
        type: Recreate
      extraVolumes:
        - name: users-database
          secret:
            secretName: authelia-users
            items:
              - key: users_database.yml
                path: users_database.yml
        # Second factors (WebAuthn keys, TOTP) from the secrets repo
        # (authelia/authelia-2fa.yaml, written by manage_2fa.py)
        - name: second-factors
          secret:
            secretName: authelia-2fa
            optional: true
      extraVolumeMounts:
        - name: users-database
          mountPath: /etc/authelia
          readOnly: true
      # Git is the source of truth for second factors: this sidecar replaces
      # every WebAuthn key and TOTP config in the database with the ones in
      # the authelia-2fa Secret, at start and whenever the Secret changes.
      # Devices registered in the web UI are removed on the next sync.
      initContainers:
        - name: second-factor-sync
          image: '{{ include "authelia.image" . }}'
          restartPolicy: Always
          command: ["/bin/sh", "-c"]
          args:
            - |
              cfg="--config /configuration.yaml"
              src=/etc/authelia-2fa
              sync() {
                cd /tmp || return 1
                for kind in webauthn totp; do
                  rm -f current.yml
                  # "no data to export" also exits 1: nothing to delete then
                  if authelia storage user $kind export --file current.yml $cfg >/dev/null 2>&1; then
                    for user in $(sed -n 's/^ *username: *//p' current.yml | tr -d "'\"" | sort -u); do
                      if [ $kind = webauthn ]; then
                        authelia storage user webauthn delete "$user" --all $cfg || return 1
                      else
                        authelia storage user totp delete "$user" $cfg || return 1
                      fi
                    done
                  fi
                  rm -f current.yml
                  # Authelia refuses to import an empty list
                  if grep -q "username:" $src/$kind.yml 2>/dev/null; then
                    authelia storage user $kind import $cfg $src/$kind.yml || return 1
                  fi
                done
              }
              synced=""
              while true; do
                want=$(cat $src/webauthn.yml $src/totp.yml 2>/dev/null | sha256sum)
                if [ "$want" != "$synced" ]; then
                  if sync; then synced=$want; echo "second factors synced"; else echo "sync failed, retrying"; fi
                fi
                sleep 30
              done
          env:
            - name: AUTHELIA_STORAGE_ENCRYPTION_KEY_FILE
              value: /secrets/internal/storage.encryption.key
            - name: AUTHELIA_SESSION_SECRET_FILE
              value: /secrets/internal/session.encryption.key
            - name: AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET_FILE
              value: /secrets/internal/identity_validation.reset_password.jwt.hmac.key
            - name: AUTHELIA_IDENTITY_PROVIDERS_OIDC_HMAC_SECRET_FILE
              value: /secrets/internal/identity_providers.oidc.hmac.key
            - name: X_AUTHELIA_CONFIG_FILTERS
              value: template
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: authelia
              mountPath: /config
            - name: config
              mountPath: /configuration.yaml
              subPath: configuration.yaml
              readOnly: true
            - name: secrets
              mountPath: /secrets/internal
              readOnly: true
            - name: secret-authelia-jwks
              mountPath: /secrets/jwks
              readOnly: true
            - name: second-factors
              mountPath: /etc/authelia-2fa
              readOnly: true
    persistence:
      enabled: true
      storageClass: longhorn
      size: 1Gi
      annotations:
        backup.longhorn.io/enabled: "true"
    secret:
      additionalSecrets:
        authelia-jwks:
          path: jwks
          items:
            - key: key.pem
              path: key.pem
    ingress:
      enabled: true
      className: traefik
      labels:
        enable-oauth: "false"
      annotations:
        cert-manager.io/cluster-issuer: cloudflare-wildcard-issuer
        traefik.ingress.kubernetes.io/router.middlewares: ""
        # Internet-facing: also served on the tunnel entrypoint
        traefik.ingress.kubernetes.io/router.entrypoints: websecure,public
    configMap:
      theme: dark
      # Requests through Cloudflare Access carry its JWT twice (CF_Authorization
      # cookie and Cf-Access-Jwt-Assertion header), which overflows the default
      # 4 KiB header buffer: Authelia answered 431 on /api/oidc/authorization
      server:
        buffers:
          read: 16384
          write: 16384
      # Prometheus metrics on :9959 (scraped by vmagent, see
      # observability/victoriametrics/scrapes/authelia.yaml)
      telemetry:
        metrics:
          enabled: true
      totp:
        issuer: "Authelia"
      ntp:
        disable_startup_check: true
        disable_failure: true
      notifier:
        filesystem:
          enabled: true
          filename: "/config/notification.txt"
      authentication_backend:
        file:
          enabled: true
          path: "/etc/authelia/users_database.yml"
          # Reload users when the authelia-users Secret changes
          watch: true
      # Every app behind forward-auth needs a rule here: anything without one is denied.
      # Groups are listed in the users file (secrets repo, authelia/authelia-users.yaml).
      access_control:
        default_policy: "deny"
        rules:
          - domain: "*.${domain}"
            subject: "group:admin"
            policy: one_factor
          - domain: "grafana.${domain}"
            subject: ["group:grafana-read", "group:grafana-edit"]
            policy: one_factor
          - domain: ["bazarr.${domain}"]
            subject: "group:bazarr"
            policy: one_factor
          - domain: ["claude-agent.${domain}"]
            subject: "group:claude-agent"
            policy: one_factor
          - domain: ["cleanuparr.${domain}"]
            subject: "group:cleanuparr"
            policy: one_factor
          - domain: ["dispatcharr.${domain}"]
            subject: "group:dispatcharr"
            policy: one_factor
          - domain: ["hello.${domain}"]
            subject: "group:hello"
            policy: one_factor
          - domain: ["homepage.${domain}"]
            subject: "group:homepage"
            policy: one_factor
          - domain: ["hubble.${domain}"]
            subject: "group:hubble"
            policy: one_factor
          - domain: ["requests.${domain}", "seerr.${domain}"]
            subject: "group:jellyseerr"
            policy: one_factor
          - domain: ["longhorn.${domain}"]
            subject: "group:longhorn"
            policy: one_factor
          - domain: ["ai.${domain}"]
            subject: "group:open-webui"
            policy: one_factor
          - domain: ["prowlarr.${domain}"]
            subject: "group:prowlarr"
            policy: one_factor
          - domain: ["qbit.${domain}", "qbittorrent.${domain}"]
            subject: "group:qbittorrent"
            policy: one_factor
          - domain: ["radarr.${domain}"]
            subject: "group:radarr"
            policy: one_factor
          - domain: ["sonarr.${domain}"]
            subject: "group:sonarr"
            policy: one_factor
          - domain: ["tracearr.${domain}"]
            subject: "group:tracearr"
            policy: one_factor
          - domain: ["unifi.${domain}"]
            subject: "group:unifi"
            policy: one_factor
      session:
        name: authelia_session
        same_site: "lax"
        inactivity: '1h'
        expiration: '8h'
        remember_me: '1d'
        encryption_key:
          value: "${authelia_session_secret}"
        cookies:
          - domain: "${domain}"
            subdomain: "auth"
          - domain: "${auth_domain}"
            subdomain: "auth"     
      storage:
        encryption_key:
          value: "${authelia_storage_encryption_key}"
        local:
          enabled: true
          path: "/config/db.sqlite3"
      identity_validation:
        reset_password:
          secret:
            value: "${authelia_jwt_secret}"
      identity_providers:
        oidc:
          enabled: true
          hmac_secret:
            value: "${authelia_oidc_hmac_secret}"
          cors:
            allowed_origins_from_client_redirect_uris: true
          jwks:
            - key_id: default
              algorithm: RS256
              use: sig
              key:
                path: "/secrets/jwks/key.pem"
          # Group gate per client; admin is allowed everywhere
          authorization_policies:
            grafana:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:grafana-read", "group:grafana-edit"]
            kubernetes:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:kubernetes-read"]
            open-webui:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:open-webui"]
            homepage:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:homepage"]
            vaultwarden:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:vaultwarden"]
            jellyfin:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:jellyfin"]
            tailscale:
              default_policy: deny
              rules:
                - policy: one_factor
                  subject: ["group:admin", "group:tailscale"]
          claims_policies:
            k8s:
              id_token:
                - groups
                - preferred_username
                - email
              id_token_audience_mode: 'experimental-merged'
          clients:
            - client_id: grafana
              client_name: Grafana
              client_secret:
                value: "${authelia_victoriametrics_client_secret_hash}"
              public: false
              authorization_policy: grafana
              consent_mode: implicit
              redirect_uris:
                - "https://grafana.${domain}/login/generic_oauth"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: headlamp
              client_name: Headlamp
              client_secret:
                value: "${authelia_headlamp_client_secret_hash}"
              public: false
              authorization_policy: kubernetes
              consent_mode: implicit
              claims_policy: k8s
              audience:
                - k8s-cluster
              requested_audience_mode: implicit
              redirect_uris:
                - "https://headlamp.${domain}/oidc-callback"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: open-webui
              client_name: Open WebUI
              client_secret:
                value: "${authelia_open_webui_client_secret_hash}"
              public: false
              authorization_policy: open-webui
              consent_mode: implicit
              redirect_uris:
                - "https://ai.${domain}/oauth/oidc/callback"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            - client_id: homepage
              client_name: Homepage
              client_secret:
                value: "${authelia_homepage_client_secret_hash}"
              public: false
              authorization_policy: homepage
              consent_mode: implicit
              redirect_uris:
                - "https://homepage.${domain}/api/auth/callback/homepage-oidc"
                - "https://homepage.${domain}/api/auth/callback/oidc"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none

            # Vaultwarden SSO. Plain secret (vaultwarden_sso_client_secret) goes in
            # the vaultwarden-env Secret; the master password is still required.
            - client_id: vaultwarden
              client_name: Vaultwarden
              client_secret:
                value: "${authelia_vaultwarden_client_secret_hash}"
              public: false
              authorization_policy: vaultwarden
              consent_mode: implicit
              require_pkce: true
              pkce_challenge_method: S256
              token_endpoint_auth_method: client_secret_basic
              redirect_uris:
                - "https://vault.${domain}/identity/connect/oidc-signin"
              scopes:
                - openid
                - profile
                - email
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              access_token_signed_response_alg: none
              userinfo_signed_response_alg: none

            # Tailscale custom OIDC sign-in (WebFinger in webfinger.yaml)
            # ID and plain secret (tailscale_oidc_client_*) go in the Tailscale sign-up form
            - client_id: "${tailscale_oidc_client_id}"
              client_name: Tailscale
              client_secret:
                value: "${authelia_tailscale_client_secret_hash}"
              public: false
              authorization_policy: tailscale
              consent_mode: implicit
              require_pkce: false
              redirect_uris:
                - "https://login.tailscale.com/a/oauth_response"
              scopes:
                - openid
                - profile
                - email
              grant_types:
                - authorization_code
              response_types:
                - code
              access_token_signed_response_alg: none
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_basic

            # Jellyfin SSO plugin (configured in Jellyfin's plugin settings, provider name "authelia")
            - client_id: jellyfin
              client_name: Jellyfin
              client_secret:
                value: "${authelia_jellyfin_client_secret_hash}"
              public: false
              authorization_policy: jellyfin
              consent_mode: implicit
              require_pkce: true
              pkce_challenge_method: S256
              redirect_uris:
                - "https://stream.${domain}/sso/OID/redirect/authelia"
              scopes:
                - openid
                - profile
                - email
                - groups
              grant_types:
                - authorization_code
              response_types:
                - code
              access_token_signed_response_alg: none
              userinfo_signed_response_alg: none
              token_endpoint_auth_method: client_secret_post

            - client_id: k8s-cluster
              client_name: Kubernetes Cluster
              public: true
              authorization_policy: kubernetes
              consent_mode: implicit
              claims_policy: k8s
              redirect_uris:
                - "http://localhost:8000"
                - "http://localhost:18000"
                - "http://127.0.0.1:8000"
                - "http://127.0.0.1:18000"
                - "https://headlamp.${domain}/oidc-callback"
              scopes:
                - openid
                - profile
                - email
                - groups
                - offline_access
              grant_types:
                - authorization_code
                - refresh_token
              response_types:
                - code
              userinfo_signed_response_alg: none
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forward-auth
  namespace: authelia
spec:
  forwardAuth:
    address: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    # Authelia answers with a few KB; cap it so a misbehaving backend can't exhaust memory
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: authelia-forward-auth
  namespace: traefik
spec:
  forwardAuth:
    address: "http://authelia.authelia.svc.cluster.local/api/authz/forward-auth"
    trustForwardHeader: true
    # Authelia answers with a few KB; cap it so a misbehaving backend can't exhaust memory
    maxResponseBodySize: 1048576
    authResponseHeaders:
      - Remote-User
      - Remote-Groups
      - Remote-Name
      - Remote-Email
