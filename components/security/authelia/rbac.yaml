# Read-only access for oidc:view, without Secrets. RBAC cannot subtract, so this
# aggregates the built-in "view" role (no Secrets; Flux, cert-manager, Kyverno and
# VictoriaMetrics add their CRDs to it) plus oidc-read-only-cluster below.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-read-only
aggregationRule:
  clusterRoleSelectors:
    - matchLabels:
        rbac.authorization.k8s.io/aggregate-to-view: "true"
    - matchLabels:
        homelab/aggregate-to-oidc-read-only: "true"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: oidc-read-only-cluster
  labels:
    homelab/aggregate-to-oidc-read-only: "true"
rules:
  # Cluster-scoped and infrastructure objects that "view" leaves out
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumes", "componentstatuses", "podtemplates"]
    verbs: ["get", "list", "watch"]
  # Together with "view": every API group except Secrets and helm.k0sproject.io (k0s Chart CRs
  # carry raw Helm values). Not "*": that includes the core group and so Secrets.
  - apiGroups:
      - admissionregistration.k8s.io
      - apiextensions.k8s.io
      - apiregistration.k8s.io
      - aquasecurity.github.io
      - autopilot.k0sproject.io
      - cert-manager.io
      - certificates.k8s.io
      - cfgate.io
      - cilium.io
      - coordination.k8s.io
      - etcd.k0sproject.io
      - flowcontrol.apiserver.k8s.io
      - frrk8s.metallb.io
      - gateway.networking.k8s.io
      - grafana.integreatly.org
      - holmesgpt.dev
      - hub.traefik.io
      - k0s.k0sproject.io
      - kyverno.io
      - longhorn.io
      - metallb.io
      - monitoring.coreos.com
      - networking.k8s.io
      - node.k8s.io
      - policies.kyverno.io
      - rbac.authorization.k8s.io
      - resource.k8s.io
      - scheduling.k8s.io
      - storage.k8s.io
      - tailscale.com
      - traefik.io
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
  # Lets `flux reconcile` set its request annotation. Status subresources are not
  # included, and the oidc-read-only-flux-reconcile policy rejects any change
  # other than reconcile.fluxcd.io/* annotations (e.g. a new source URL).
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories", "helmrepositories", "helmcharts", "ocirepositories", "buckets"]
    verbs: ["patch", "update"]
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["patch", "update"]
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["patch", "update"]
  - apiGroups: ["notification.toolkit.fluxcd.io"]
    resources: ["receivers", "alerts", "providers"]
    verbs: ["patch", "update"]
  - apiGroups: ["image.toolkit.fluxcd.io"]
    resources: ["imagerepositories", "imagepolicies", "imageupdateautomations"]
    verbs: ["patch", "update"]
---
# kustomize-controller applies as cluster-admin, so any spec write on a Flux object
# (source URL, path, postBuild, ...) is a privilege escalation. Readers may only
# request reconciliation.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: oidc-read-only-flux-reconcile
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups:
          - source.toolkit.fluxcd.io
          - kustomize.toolkit.fluxcd.io
          - helm.toolkit.fluxcd.io
          - notification.toolkit.fluxcd.io
          - image.toolkit.fluxcd.io
        apiVersions: ["*"]
        operations: ["UPDATE"]
        resources: ["*/*"]
  matchConditions:
    - name: oidc-reader
      expression: >-
        (request.userInfo.username == 'oidc-user' || request.userInfo.groups.exists(g, g == 'oidc:view'))
        && !request.userInfo.groups.exists(g, g == 'oidc:admin')
  variables:
    - name: newAnnotations
      expression: "object.metadata.?annotations.orValue({})"
    - name: oldAnnotations
      expression: "oldObject.metadata.?annotations.orValue({})"
  validations:
    - expression: "request.?subResource.orValue('') == ''"
      message: "oidc:view may not write Flux subresources"
    - expression: "object.spec == oldObject.spec"
      message: "oidc:view may only request reconciliation; spec changes are not allowed"
    - expression: >-
        object.metadata.?labels.orValue({}) == oldObject.metadata.?labels.orValue({})
        && object.metadata.?finalizers.orValue([]) == oldObject.metadata.?finalizers.orValue([])
        && object.metadata.?ownerReferences.orValue([]) == oldObject.metadata.?ownerReferences.orValue([])
      message: "oidc:view may only request reconciliation; metadata changes are not allowed"
    - expression: >-
        variables.newAnnotations.all(k, k.startsWith('reconcile.fluxcd.io/')
          || (k in variables.oldAnnotations && variables.oldAnnotations[k] == variables.newAnnotations[k]))
        && variables.oldAnnotations.all(k, k.startsWith('reconcile.fluxcd.io/') || k in variables.newAnnotations)
      message: "oidc:view may only change reconcile.fluxcd.io/* annotations"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: oidc-read-only-flux-reconcile
spec:
  policyName: oidc-read-only-flux-reconcile
  validationActions: ["Deny"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-admin-binding
subjects:
  - kind: User
    name: oidc-admin
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: oidc:admin
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: oidc-user-binding
subjects:
  - kind: User
    name: oidc-user
    apiGroup: rbac.authorization.k8s.io
  - kind: Group
    name: oidc:view
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: oidc-read-only
  apiGroup: rbac.authorization.k8s.io
