# Covers the operator, the built-in Trivy server and the scan jobs (all run in
# trivy-system).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: trivy-operator
  namespace: trivy-system
spec:
  endpointSelector: {}
  ingress:
    # Scan jobs and operator -> Trivy server (4954)
    - fromEndpoints:
        - {}
    # Operator metrics (vmagent)
    - fromEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: victoriametrics
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Health checks and probes (operator 9090, server 4954)
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    # DNS Resolution
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
    # Kubernetes API Server
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Intra-namespace (scan jobs -> trivy-service)
    - toEndpoints:
        - {}
    # Vulnerability/Java DBs and checks bundle (mirror.gcr.io) and image
    # manifests/layers from the workloads' registries (Docker Hub, GHCR,
    # lscr.io, quay.io, registry.k8s.io)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
