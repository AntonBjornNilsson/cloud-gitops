apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-trivy-operator
  namespace: flux-system
spec:
  interval: 2m0s
  retryInterval: 1m0s
  timeout: 10m0s
  path: ./components/security/trivy-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  dependsOn:
    # Trivy server cache PVC
    - name: system-longhorn-config
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
