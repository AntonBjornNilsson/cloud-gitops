apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-pvc-annotations
spec:
  validationFailureAction: Audit
  background: true
  rules:
  # Keeps Flux from pruning PVCs. The Helm annotation does NOT stop a Helm
  # uninstall from deleting a chart's PVC (Helm only reads it from the rendered
  # chart, not the live object); the Retain rules below are what keep the data.
  - name: add-helm-resource-policy
    match:
      resources:
        kinds:
        - PersistentVolumeClaim
    mutate:
      patchStrategicMerge:
        metadata:
          annotations:
            +(helm.sh/resource-policy): keep
            +(kustomize.toolkit.fluxcd.io/prune): disabled
  # Opt-in PVCs join the Longhorn "backup" recurring-job group (daily-backup).
  # Not "default": Longhorn puts every volume without recurring-job labels in
  # the default group, so using it would back up everything.
  - name: enable-longhorn-pvc-backup
    match:
      any:
      - resources:
          kinds:
          - PersistentVolumeClaim
          selector:
            matchLabels:
              backup.longhorn.io/enabled: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          selector:
            matchLabels:
              backup: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          annotations:
            backup.longhorn.io/enabled: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          annotations:
            backup: "true"
    mutate:
      patchStrategicMerge:
        metadata:
          labels:
            +(recurring-job.longhorn.io/source): enabled
            +(recurring-job-group.longhorn.io/backup): enabled
  # Same as above for PVCs that already exist when the policy changes.
  - name: enable-longhorn-pvc-backup-existing
    match:
      any:
      - resources:
          kinds:
          - PersistentVolumeClaim
          selector:
            matchLabels:
              backup.longhorn.io/enabled: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          selector:
            matchLabels:
              backup: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          annotations:
            backup.longhorn.io/enabled: "true"
      - resources:
          kinds:
          - PersistentVolumeClaim
          annotations:
            backup: "true"
    mutate:
      mutateExistingOnPolicyUpdate: true
      targets:
      - apiVersion: v1
        kind: PersistentVolumeClaim
        name: "{{ request.object.metadata.name }}"
        namespace: "{{ request.object.metadata.namespace }}"
      patchStrategicMerge:
        metadata:
          labels:
            +(recurring-job.longhorn.io/source): enabled
            +(recurring-job-group.longhorn.io/backup): enabled
  # Longhorn volumes outlive their PVC: a deleted PVC (Helm uninstall when a
  # service is disabled, a removed manifest) leaves the PV Released and the
  # Longhorn volume intact instead of deleting the data. Deleting a volume for
  # good is a manual step (Longhorn UI, then the PV).
  - name: retain-longhorn-pv
    match:
      any:
      - resources:
          kinds:
          - PersistentVolume
    preconditions:
      all:
      - key: "{{ request.object.spec.csi.driver || '' }}"
        operator: Equals
        value: driver.longhorn.io
    mutate:
      patchStrategicMerge:
        spec:
          persistentVolumeReclaimPolicy: Retain
  # Same for PVs that already exist when the policy changes.
  - name: retain-longhorn-pv-existing
    match:
      any:
      - resources:
          kinds:
          - PersistentVolume
    preconditions:
      all:
      - key: "{{ request.object.spec.csi.driver || '' }}"
        operator: Equals
        value: driver.longhorn.io
    mutate:
      mutateExistingOnPolicyUpdate: true
      targets:
      - apiVersion: v1
        kind: PersistentVolume
        name: "{{ request.object.metadata.name }}"
      patchStrategicMerge:
        spec:
          persistentVolumeReclaimPolicy: Retain
