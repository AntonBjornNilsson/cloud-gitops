# Pod Security Standards as Kyverno ClusterPolicies: restricted profile (which
# includes baseline) enforced.
# Workloads that legitimately need more (CNI, CSI, GPU, node agents, host
# networking) are allowlisted per policy in policyExclude below. Violations
# show up in PolicyReports (kubectl get policyreports -A) and in admission errors.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      # Keep in step with the kyverno chart version
      version: "3.9.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno-repo
        namespace: kyverno
      interval: 12h
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # Chart 3.9 defaults to CEL ValidatingPolicies, which ignore policyExclude: every
    # exception below would be lost and those workloads denied. Keep the legacy kind
    # until the exceptions are migrated (vpolExclude).
    policyType: ClusterPolicy
    # restricted = the baseline policies plus the restricted-only ones below
    podSecurityStandard: restricted
    validationFailureAction: Enforce
    background: true
    # Allowlist, per policy. Each entry is the smallest scope that covers the
    # need: whole namespace for node-level infrastructure whose pods are
    # created by operators or CSI drivers (Cilium, Longhorn, TrueNAS CSI,
    # MetalLB, AMD GPU), name prefix elsewhere. Autogen applies these to Deployments/DaemonSets/... too.
    # A new workload that needs one of these: add it here, with the reason.
    policyExclude:
      disallow-capabilities:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb]
          # Tailscale proxy: tailscaled with NET_ADMIN and the node's /dev/net/tun
          # (mounted by the tailscale-proxy-tun policy)
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          # gluetun VPN sidecar needs NET_ADMIN for its tunnel and firewall
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
      disallow-host-namespaces:
        any:
          # Longhorn starts short-lived node helper pods on demand (e.g. the CSI
          # deployer's hostPID kubelet detection pod)
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb]
          - resources:
              namespaces: [victoriametrics]
              names: ["victoriametrics-prometheus-node-exporter*"]
          # Matter needs hostNetwork for IPv6 link-local / mDNS to devices
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
      disallow-host-path:
        any:
          # Writes the containerd registry mirror config (Harbor) on every node
          - resources:
              namespaces: [registry-mirror]
              names: ["registry-mirror*"]
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi]
          # Tailscale proxy: tailscaled with NET_ADMIN and the node's /dev/net/tun
          # (mounted by the tailscale-proxy-tun policy)
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names:
                - "victoriametrics-prometheus-node-exporter*"
                - "smartctl-exporter*"
                - "vlagent-logs*"
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          # gluetun VPN sidecars: the node's /dev/net/tun
          - resources:
              namespaces:
                - dispatcharr
                - prowlarr
                - qbittorrent
      disallow-host-ports:
        any:
          # Longhorn starts short-lived node helper pods on demand (e.g. the CSI
          # deployer's hostPID kubelet detection pod)
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb]
          - resources:
              namespaces: [victoriametrics]
              names: ["victoriametrics-prometheus-node-exporter*"]
      disallow-privileged-containers:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi]
          # Sets kernel sysctls on every node
          - resources:
              namespaces: [node-sysctls]
              names: ["node-sysctls*"]
          # Tailscale proxies: the operator's sysctler init container (sets ip_forward)
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          # Raw disk access for SMART data
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
          # UniFi OS Server: systemd as PID 1 needs a writable cgroup tree and mounts
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
      disallow-selinux:
        any:
          - resources:
              namespaces: [kube-system]
      restrict-seccomp:
        any:
          - resources:
              namespaces: [kube-system]
      # --- Restricted profile. Every other workload runs as non-root with no
      # capabilities, no privilege escalation and the RuntimeDefault seccomp profile.
      disallow-capabilities-strict:
        any:
          # Node infrastructure created by operators (CNI, CSI, BGP/L2, sysctls)
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
          # gluetun VPN sidecar: root with its default capabilities plus NET_ADMIN
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
          # Images that need root with the default capabilities (s6 init / su);
          # matter-server only for the init container's chown
          - resources:
              namespaces: [homeassistant]
              names: ["homeassistant*", "matter-server*"]
          # UniFi OS Server: privileged (see disallow-privileged-containers)
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
      disallow-privilege-escalation:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
          # Privileged (see disallow-privileged-containers)
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
      require-run-as-non-root-user:
        any:
          # Writes the containerd registry mirror config (Harbor) on every node
          - resources:
              namespaces: [registry-mirror]
              names: ["registry-mirror*"]
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi]
          # Explicit runAsUser 0: SMART reads, node log reader, chown init, gluetun
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*", "vlagent-logs*"]
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
      require-run-as-nonroot:
        any:
          # Writes the containerd registry mirror config (Harbor) on every node
          - resources:
              namespaces: [registry-mirror]
              names: ["registry-mirror*"]
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*", "vlagent-logs*"]
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
          - resources:
              namespaces: [homeassistant]
              names: ["homeassistant*", "matter-server*"]
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
          # GPU device nodes belong to a per-node render gid; root keeps no capabilities
          - resources:
              namespaces: [ollama]
              names: ["ollama*"]
      restrict-seccomp-strict:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
      restrict-volume-types:
        any:
          # Writes the containerd registry mirror config (Harbor) on every node
          - resources:
              namespaces: [registry-mirror]
              names: ["registry-mirror*"]
          # hostPath: same workloads as disallow-host-path above
          - resources:
              namespaces: [kube-system, longhorn-system, truenas-csi]
          # Tailscale proxy: tailscaled with NET_ADMIN and the node's /dev/net/tun
          # (mounted by the tailscale-proxy-tun policy)
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names:
                - "victoriametrics-prometheus-node-exporter*"
                - "smartctl-exporter*"
                - "vlagent-logs*"
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          - resources:
              namespaces:
                - dispatcharr
                - prowlarr
                - qbittorrent
