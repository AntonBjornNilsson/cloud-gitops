# Pod Security Standards (baseline profile) as Kyverno ClusterPolicies.
# Workloads that legitimately need more (CNI, CSI, GPU, node agents, host
# networking) are allowlisted per policy in policyExclude below.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      # Keep in step with the kyverno chart version
      version: "3.7.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno-repo
        namespace: kyverno
      interval: 12h
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    podSecurityStandard: baseline
    # Audit first: collect violations in PolicyReports before enforcing
    validationFailureAction: Audit
    background: true
