# Pod Security Standards as Kyverno ClusterPolicies: baseline profile enforced,
# restricted profile audited.
# Workloads that legitimately need more (CNI, CSI, GPU, node agents, host
# networking) are allowlisted per policy in policyExclude below. Violations
# show up in PolicyReports (kubectl get policyreports -A) and in admission errors.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kyverno-policies
  namespace: kyverno
spec:
  interval: 30m
  chart:
    spec:
      chart: kyverno-policies
      # Keep in step with the kyverno chart version
      version: "3.7.2"
      sourceRef:
        kind: HelmRepository
        name: kyverno-repo
        namespace: kyverno
      interval: 12h
  timeout: 5m
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    # restricted = the baseline policies plus the restricted-only ones below
    podSecurityStandard: restricted
    validationFailureAction: Enforce
    # Restricted-only policies report (PolicyReports) without blocking. Workloads are
    # hardened and the exceptions allowlisted below, so these can move to Enforce.
    validationFailureActionByPolicy:
      disallow-capabilities-strict: Audit
      disallow-privilege-escalation: Audit
      require-run-as-non-root-user: Audit
      require-run-as-nonroot: Audit
      restrict-seccomp-strict: Audit
      restrict-volume-types: Audit
    background: true
    # Allowlist, per policy. Each entry is the smallest scope that covers the
    # need: whole namespace for node-level infrastructure whose pods are
    # created by operators (Cilium, Longhorn, MetalLB, AMD GPU), name prefix
    # elsewhere. Autogen applies these to Deployments/DaemonSets/... too.
    # A new workload that needs one of these: add it here, with the reason.
    policyExclude:
      disallow-capabilities:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, metallb]
          # gluetun VPN sidecar needs NET_ADMIN for its tunnel and firewall
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
      disallow-host-namespaces:
        any:
          - resources:
              namespaces: [kube-system, metallb]
          - resources:
              namespaces: [victoriametrics]
              names: ["victoriametrics-prometheus-node-exporter*"]
          # Matter needs hostNetwork for IPv6 link-local / mDNS to devices
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
      disallow-host-path:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system]
          - resources:
              namespaces: [victoriametrics]
              names:
                - "victoriametrics-prometheus-node-exporter*"
                - "smartctl-exporter*"
                - "vlagent-logs*"
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          # Media library on the media node's disk
          - resources:
              namespaces:
                - bazarr
                - cleanuparr
                - dispatcharr
                - jellyfin
                - prowlarr
                - qbittorrent
                - radarr
                - sonarr
      disallow-host-ports:
        any:
          - resources:
              namespaces: [kube-system, metallb]
          - resources:
              namespaces: [victoriametrics]
              names: ["victoriametrics-prometheus-node-exporter*"]
      disallow-privileged-containers:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system]
          # Sets kernel sysctls on every node
          - resources:
              namespaces: [node-sysctls]
              names: ["node-sysctls*"]
          # Tailscale proxies (operator-created ts-* StatefulSets)
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          # Raw disk access for SMART data
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
      disallow-selinux:
        any:
          - resources:
              namespaces: [kube-system]
      restrict-seccomp:
        any:
          - resources:
              namespaces: [kube-system]
      # --- Restricted profile. Every other workload runs as non-root with no
      # capabilities, no privilege escalation and the RuntimeDefault seccomp profile.
      disallow-capabilities-strict:
        any:
          # Node infrastructure created by operators (CNI, CSI, BGP/L2, sysctls)
          - resources:
              namespaces: [kube-system, longhorn-system, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
          # gluetun VPN sidecar: root with its default capabilities plus NET_ADMIN
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
          # Images that need root with the default capabilities (s6 init / su / nginx
          # workers); matter-server only for the init container's chown
          - resources:
              namespaces: [homeassistant]
              names: ["homeassistant*", "matter-server*"]
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
          - resources:
              namespaces: [nginx-echo-namespace]
              names: ["nginx-deployment*"]
      disallow-privilege-escalation:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
      require-run-as-non-root-user:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system]
          # Explicit runAsUser 0: SMART reads, node log reader, chown init, gluetun
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*", "vlagent-logs*"]
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
      require-run-as-nonroot:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*", "vlagent-logs*"]
          - resources:
              namespaces: [dispatcharr]
              names: ["dispatcharr-web*"]
          - resources:
              namespaces: [prowlarr]
              names: ["prowlarr*"]
          - resources:
              namespaces: [qbittorrent]
              names: ["qbittorrent*"]
          - resources:
              namespaces: [homeassistant]
              names: ["homeassistant*", "matter-server*"]
          - resources:
              namespaces: [unifi]
              names: ["unifi*"]
          - resources:
              namespaces: [nginx-echo-namespace]
              names: ["nginx-deployment*"]
          # GPU device nodes belong to a per-node render gid; root keeps no capabilities
          - resources:
              namespaces: [ollama]
              names: ["ollama*"]
      restrict-seccomp-strict:
        any:
          - resources:
              namespaces: [kube-system, longhorn-system, metallb, node-sysctls]
          - resources:
              namespaces: [tailscale]
              names: ["ts-*"]
          - resources:
              namespaces: [victoriametrics]
              names: ["smartctl-exporter*"]
      restrict-volume-types:
        any:
          # hostPath: same workloads as disallow-host-path above
          - resources:
              namespaces: [kube-system, longhorn-system]
          - resources:
              namespaces: [victoriametrics]
              names:
                - "victoriametrics-prometheus-node-exporter*"
                - "smartctl-exporter*"
                - "vlagent-logs*"
          - resources:
              namespaces: [homeassistant]
              names: ["matter-server*"]
          - resources:
              namespaces:
                - bazarr
                - cleanuparr
                - dispatcharr
                - jellyfin
                - prowlarr
                - qbittorrent
                - radarr
                - sonarr
