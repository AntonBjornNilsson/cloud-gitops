apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: add-ingress-oauth2-proxy
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: add-oauth2-proxy-middleware
    match:
      resources:
        kinds:
        - Ingress
    exclude:
      resources:
        namespaces:
        - authentik
        - authelia
        - oauth2-proxy
    preconditions:
      all:
      - key: "{{ request.object.metadata.annotations.\"cert-manager.io/cluster-issuer\" || 'cloudflare-wildcard-issuer' }}"
        operator: Equals
        value: "cloudflare-wildcard-issuer"
      - key: "{{ request.object.metadata.labels.\"enable-oauth\" || 'true' }}"
        operator: Equals
        value: "true"
    mutate:
      patchStrategicMerge:
        metadata:
          annotations:
            +(traefik.ingress.kubernetes.io/router.middlewares): "oauth2-proxy-traefik-auth-forward@kubernetescrd"
