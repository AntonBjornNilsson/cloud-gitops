apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: protect-namespaces
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: add-flux-prune-disabled
    match:
      resources:
        kinds:
        - Namespace
    mutate:
      patchStrategicMerge:
        metadata:
          annotations:
            +(kustomize.toolkit.fluxcd.io/prune): disabled
---
# Keeps Flux from pruning a Namespace (and everything in it) when it is removed
# from Git: adds kustomize.toolkit.fluxcd.io/prune: disabled if it is missing.
apiVersion: policies.kyverno.io/v1
kind: MutatingPolicy
metadata:
  name: protect-namespaces
spec:
  failurePolicy: Fail
  evaluation:
    background:
      enabled: false
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [namespaces]
  matchConditions:
    - name: annotation-missing
      expression: >-
        !('kustomize.toolkit.fluxcd.io/prune' in object.metadata.?annotations.orValue({}))
  mutations:
    - patchType: JSONPatch
      jsonPatch:
        expression: >-
          has(object.metadata.annotations)
          ? [JSONPatch{op: "add", path: "/metadata/annotations/kustomize.toolkit.fluxcd.io~1prune", value: "disabled"}]
          : [JSONPatch{op: "add", path: "/metadata/annotations", value: {"kustomize.toolkit.fluxcd.io/prune": "disabled"}}]
