apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-services
  namespace: flux-system
spec:
  interval: 30s
  path: ./services
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: flux-components
    - name: system-traefik
    - name: system-cert-manager-config
    - name: system-longhorn
  retryInterval: 1m0s
  timeout: 5m0s
  wait: true
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions
      - kind: Secret
        name: network-substitutions
      - kind: Secret
        name: observability-substitutions
      - kind: Secret
        name: media-substitutions
      - kind: Secret
        name: apps-substitutions
