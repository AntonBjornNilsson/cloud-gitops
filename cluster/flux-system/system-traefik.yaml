apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-traefik
  namespace: flux-system
spec:
  interval: 2m0s
  path: ./components/networking/traefik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  # dependsOn:
  #   - name: system-cert-manager
  #   - name: system-metallb-post-install
  postBuild:
    substituteFrom:
      - kind: Secret
        name: flux-substitutions